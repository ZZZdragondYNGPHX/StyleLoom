name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
      - name: Test Rust core
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Build portable Windows bundle
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Generate checksum and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $archive = "dist/StyleLoom-windows-x64.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  StyleLoom-windows-x64.zip" | Set-Content "dist/StyleLoom-windows-x64.zip.sha256" -Encoding ascii
          gh release upload $env:RELEASE_TAG $archive "dist/StyleLoom-windows-x64.zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
