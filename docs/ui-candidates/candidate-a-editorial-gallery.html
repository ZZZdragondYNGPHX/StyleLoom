        ctx.strokeStyle = isEclipse ? 'rgba(206, 200, 184, 0.25)' : 'rgba(230, 186, 108, 0.26)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          const pad = w * (0.08 + i * 0.11);
          ctx.beginPath();
          ctx.moveTo(pad, h);
          ctx.lineTo(pad, h * 0.36);
          ctx.quadraticCurveTo(pad, h * 0.12, w * 0.5, h * (0.06 + i * 0.05));
          ctx.quadraticCurveTo(w - pad, h * 0.12, w - pad, h * 0.36);
          ctx.lineTo(w - pad, h);
          ctx.stroke();
        }
        ctx.restore();

        // 巴洛克金箔玫瑰花窗 + 月相星盘
        const cx = w * 0.5;
        const cy = h * 0.35;
        const rad = w * 0.27;
        ctx.save();
        ctx.strokeStyle = isEclipse ? '#DFD8C6' : '#E7BE70';
        ctx.lineWidth = 2.2;
        ctx.shadowColor = isEclipse ? 'rgba(225,230,255,0.45)' : 'rgba(235,180,85,0.5)';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(cx, cy, rad * 0.82, 0, Math.PI * 2);
        ctx.stroke();

        for (let k = 0; k < 12; k++) {
          const ang = (k * Math.PI * 2) / 12;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(ang) * rad * 0.36, cy + Math.sin(ang) * rad * 0.36);
          ctx.lineTo(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(cx + Math.cos(ang) * rad * 0.62, cy + Math.sin(ang) * rad * 0.62, rad * 0.12, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 中央月相圆轮
        ctx.fillStyle = isEclipse ? '#13131A' : '#F6DBA0';
        ctx.beginPath();
        ctx.arc(cx, cy, rad * 0.30, 0, Math.PI * 2);
        ctx.fill();
        if (isEclipse) {
          ctx.strokeStyle = '#F7E7C0';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(cx, cy, rad * 0.31, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#1B130D';
          ctx.beginPath();
          ctx.arc(cx - rad * 0.10, cy - rad * 0.04, rad * 0.24, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 圣坛烛光微晕与飘落金粉
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (let c = 0; c < 7; c++) {
          const fx = w * (0.20 + c * 0.10);
          const fy = h * (0.83 + (c % 2) * 0.03);
          const cg = ctx.createRadialGradient(fx, fy, 1, fx, fy, 26);
          cg.addColorStop(0, 'rgba(255, 224, 152, 0.95)');
          cg.addColorStop(0.5, 'rgba(232, 146, 62, 0.30)');
          cg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = cg;
          ctx.beginPath();
          ctx.arc(fx, fy, 26, 0, Math.PI * 2);
          ctx.fill();
        }
        for (let m = 0; m < 40; m++) {
          ctx.fillStyle = 'rgba(246, 210, 134, 0.5)';
          ctx.fillRect(rand() * w, rand() * h, 1.8, 1.8);
        }
        ctx.restore();
        drawPaperGrain(ctx, w, h, 0.035, 404 + variant);
      }

      function paintRetroRainNeon(ctx, w, h, variant) {
        const rand = seededRand(505 + variant * 47);
        const isCyan = variant % 2 === 1;
        const sky = ctx.createLinearGradient(0, 0, 0, h * 0.68);
        sky.addColorStop(0, isCyan ? '#0E1A2C' : '#141528');
        sky.addColorStop(1, isCyan ? '#1D334D' : '#292242');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        // 远景几何街景建筑 (赛璐璐硬色块)
        ctx.fillStyle = isCyan ? '#132236' : '#1A1830';
        ctx.fillRect(0, h * 0.14, w * 0.56, h * 0.56);
        ctx.fillStyle = isCyan ? '#0D1726' : '#121224';
        ctx.fillRect(w * 0.56, h * 0.22, w * 0.44, h * 0.48);

        // 便利店/拉面屋暖光灯箱与窗面
        const glowColor = isCyan ? '#42E6D6' : '#FFAD5C';
        const secColor = isCyan ? '#FF6B9E' : '#5BE2F5';
        ctx.fillStyle = glowColor;
        ctx.fillRect(w * 0.06, h * 0.36, w * 0.44, h * 0.16);
        ctx.fillStyle = 'rgba(20, 22, 34, 0.85)';
        ctx.fillRect(w * 0.06, h * 0.34, w * 0.48, h * 0.04); // 屋檐

        // 垂直霓虹灯牌块
        ctx.save();
        ctx.shadowColor = secColor;
        ctx.shadowBlur = 18;
        ctx.fillStyle = secColor;
        ctx.fillRect(w * 0.59, h * 0.25, w * 0.075, h * 0.26);
        ctx.fillStyle = glowColor;
        ctx.fillRect(w * 0.72, h * 0.30, w * 0.06, h * 0.19);
        ctx.restore();

        // 湿润沥青地面与倒影
        const road = ctx.createLinearGradient(0, h * 0.68, 0, h);
        road.addColorStop(0, '#131626');
        road.addColorStop(1, '#0A0B14');
        ctx.fillStyle = road;
        ctx.fillRect(0, h * 0.68, w, h * 0.32);

        // 倒影水波纹色带
        for (let r = 0; r < 14; r++) {
          const ry = h * 0.70 + r * (h * 0.02);
          ctx.fillStyle = r % 2 === 0 ? glowColor : secColor;
          ctx.globalAlpha = 0.24 - r * 0.012;
          const rx = r % 2 === 0 ? w * 0.08 : w * 0.56;
          const rw = (r % 2 === 0 ? w * 0.42 : w * 0.26) * (0.7 + rand() * 0.4);
          ctx.fillRect(rx + (rand() - 0.5) * 14, ry, rw, 5);
        }
        ctx.globalAlpha = 1;

        // 伞下少女背影剪影
        ctx.fillStyle = '#0D0E18';
        ctx.beginPath();
        ctx.arc(w * 0.46, h * 0.56, w * 0.14, Math.PI, 0, false); // 雨伞
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(w * 0.456, h * 0.56, 3, h * 0.14);
        ctx.beginPath();
        ctx.moveTo(w * 0.42, h * 0.60);
        ctx.lineTo(w * 0.50, h * 0.60);
        ctx.lineTo(w * 0.53, h * 0.85);
        ctx.lineTo(w * 0.39, h * 0.85);
        ctx.closePath();
        ctx.fill();

        // 伞缘霓虹逆光边
        ctx.strokeStyle = secColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(w * 0.46, h * 0.56, w * 0.14, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();

        // 赛璐璐斜雨丝
        ctx.save();
        ctx.strokeStyle = 'rgba(220, 240, 255, 0.38)';
        ctx.lineWidth = 1.2;
        for (let i = 0; i < 65; i++) {
          const x = rand() * w;
          const y = rand() * h;
          const len = 18 + rand() * 26;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - len * 0.25, y + len);
          ctx.stroke();
        }
        ctx.restore();
      }

      function paintEmeraldStag(ctx, w, h, variant) {
        const rand = seededRand(606 + variant * 59);
        const isGold = variant % 2 === 1;
        const bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, isGold ? '#1B3A2A' : '#0B241E');
        bg.addColorStop(0.55, isGold ? '#2D5E44' : '#184A3A');
        bg.addColorStop(1, '#091A15');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        // 树干远景分层
        ctx.fillStyle = 'rgba(8, 22, 18, 0.55)';
        [0.08, 0.22, 0.78, 0.90].forEach((tx, idx) => {
          const tw = w * (0.06 + (idx % 2) * 0.03);
          ctx.fillRect(w * tx, 0, tw, h * 0.9);
        });

        // 木漏日斑与斜射光柱
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (let i = 0; i < 5; i++) {
          const bx = w * (0.18 + i * 0.14);
          const lg = ctx.createLinearGradient(bx, 0, bx + w * 0.24, h * 0.86);
          lg.addColorStop(0, isGold ? 'rgba(255, 232, 152, 0.30)' : 'rgba(134, 244, 200, 0.26)');
          lg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = lg;
          ctx.beginPath();
          ctx.moveTo(bx, 0);
          ctx.lineTo(bx + w * 0.11, 0);
          ctx.lineTo(bx + w * 0.34, h * 0.92);
          ctx.lineTo(bx + w * 0.16, h * 0.92);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // 森林地面与溪流微光
        ctx.fillStyle = '#0D261F';
        ctx.beginPath();
        ctx.moveTo(0, h * 0.75);
        ctx.quadraticCurveTo(w * 0.5, h * 0.69, w, h * 0.78);
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        ctx.fill();

        // 鹿影与繁复鹿角剪影
        ctx.save();
        const cx = w * 0.52;
        const baseY = h * 0.78;
        ctx.fillStyle = '#071410';
        // 身躯与颈部
        ctx.beginPath();
        ctx.ellipse(cx - w * 0.03, baseY - h * 0.10, w * 0.11, h * 0.055, -0.05, 0, Math.PI * 2);
        ctx.fill();
        // 腿
        ctx.fillRect(cx - w * 0.11, baseY - h * 0.08, 6, h * 0.14);
        ctx.fillRect(cx - w * 0.07, baseY - h * 0.08, 5, h * 0.12);
        ctx.fillRect(cx + w * 0.04, baseY - h * 0.08, 6, h * 0.14);
        // 抬头脖颈与头部
        ctx.beginPath();
        ctx.moveTo(cx + w * 0.02, baseY - h * 0.11);
        ctx.lineTo(cx + w * 0.08, baseY - h * 0.25);
        ctx.lineTo(cx + w * 0.14, baseY - h * 0.24);
        ctx.lineTo(cx + w * 0.08, baseY - h * 0.20);
        ctx.lineTo(cx + w * 0.07, baseY - h * 0.09);
        ctx.closePath();
        ctx.fill();

        // 分枝鹿角
        ctx.strokeStyle = isGold ? '#BFE8B6' : '#8CF4CB';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        function drawAntler(sign) {
          const ax = cx + w * 0.085;
          const ay = baseY - h * 0.255;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.quadraticCurveTo(ax + sign * w * 0.04, ay - h * 0.09, ax + sign * w * 0.12, ay - h * 0.17);
          ctx.moveTo(ax + sign * w * 0.04, ay - h * 0.07);
          ctx.lineTo(ax + sign * w * 0.02, ay - h * 0.14);
          ctx.moveTo(ax + sign * w * 0.08, ay - h * 0.12);
          ctx.lineTo(ax + sign * w * 0.14, ay - h * 0.11);
          ctx.stroke();
        }
        drawAntler(1);
        drawAntler(-0.7);
        ctx.restore();

        // 森林萤火与光斑
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (let i = 0; i < 38; i++) {
          const px = rand() * w;
          const py = rand() * h * 0.86;
          const pr = rand() * 5 + 1.5;
          ctx.fillStyle = isGold ? 'rgba(255, 232, 136, 0.55)' : 'rgba(130, 255, 206, 0.52)';
          ctx.beginPath();
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        drawPaperGrain(ctx, w, h, 0.03, 606 + variant);
      }

      function paintUkiyoeCrimsonMoon(ctx, w, h, variant) {
        const isKintsugi = variant % 2 === 1;
        // 和纸底色
        const paper = ctx.createLinearGradient(0, 0, 0, h);
        paper.addColorStop(0, isKintsugi ? '#E9D9B8' : '#F2E7CF');
        paper.addColorStop(1, isKintsugi ? '#CCB489' : '#DBC8A6');
        ctx.fillStyle = paper;
        ctx.fillRect(0, 0, w, h);

        // 赤红大月
        ctx.save();
        const mx = w * 0.62;
        const my = h * 0.28;
        const mr = w * 0.24;
        const moonGrad = ctx.createRadialGradient(mx, my, mr * 0.1, mx, my, mr);
        moonGrad.addColorStop(0, isKintsugi ? '#D63D29' : '#C92B25');
        moonGrad.addColorStop(1, '#9E1B1A');
        ctx.fillStyle = moonGrad;
        ctx.beginPath();
        ctx.arc(mx, my, mr, 0, Math.PI * 2);
        ctx.fill();
        if (isKintsugi) {
          ctx.fillStyle = '#241F1C';
          ctx.beginPath();
          ctx.arc(mx - mr * 0.28, my - mr * 0.12, mr * 0.72, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 远山剪影
        ctx.fillStyle = '#2A2B36';
        ctx.beginPath();
        ctx.moveTo(w * 0.52, h * 0.64);
        ctx.lineTo(w * 0.75, h * 0.45);
        ctx.lineTo(w * 0.98, h * 0.64);
        ctx.closePath();
        ctx.fill();

        // 墨燕 / 白鹤飞影
        ctx.strokeStyle = isKintsugi ? '#F6EDD7' : '#1E1B18';
        ctx.lineWidth = 2;
        [[0.26, 0.22], [0.34, 0.18], [0.22, 0.28]].forEach(([bx, by]) => {
          ctx.beginPath();
          ctx.moveTo(w * bx - 12, h * by);
          ctx.quadraticCurveTo(w * bx - 5, h * by - 7, w * bx, h * by);
          ctx.quadraticCurveTo(w * bx + 5, h * by - 7, w * bx + 12, h * by);
          ctx.stroke();
        });

        // 浮世绘卷涌狂澜
        function drawWave(yRatio, fill, stroke) {
          ctx.fillStyle = fill;
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(0, h);
          ctx.lineTo(0, h * yRatio);
          ctx.bezierCurveTo(w * 0.22, h * (yRatio - 0.18), w * 0.48, h * (yRatio - 0.22), w * 0.64, h * (yRatio - 0.04));
          ctx.bezierCurveTo(w * 0.52, h * (yRatio - 0.02), w * 0.44, h * (yRatio + 0.04), w * 0.52, h * (yRatio + 0.07));
          ctx.bezierCurveTo(w * 0.72, h * (yRatio + 0.10), w * 0.88, h * (yRatio - 0.05), w, h * (yRatio + 0.02));
          ctx.lineTo(w, h);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        drawWave(0.62, '#1F3A56', '#111924');
        drawWave(0.75, '#16283E', isKintsugi ? '#D7AD58' : '#0E141C');

        // 浪花爪状浪尖沫
        ctx.fillStyle = '#F7F0DF';
        for (let k = 0; k < 6; k++) {
          ctx.beginPath();
          ctx.arc(w * (0.48 + k * 0.032), h * (0.52 + (k % 2) * 0.025), 7 + (k % 3) * 3, 0, Math.PI * 2);
          ctx.fill();
        }
        drawPaperGrain(ctx, w, h, 0.045, 707 + variant);
      }

      function paintBauhausSilhouette(ctx, w, h, variant) {
        const isCobalt = variant % 2 === 1;
        ctx.fillStyle = '#F5EFE2';
        ctx.fillRect(0, 0, w, h);

        // 极简辅助构图线
        ctx.strokeStyle = 'rgba(28, 26, 23, 0.14)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(w * 0.12, h * 0.12);
        ctx.lineTo(w * 0.88, h * 0.88);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(w * 0.5, h * 0.5, w * 0.39, 0, Math.PI * 2);
        ctx.stroke();

        // 包豪斯核心几何色块
        ctx.fillStyle = isCobalt ? '#2A5C6B' : '#C85230';
        ctx.beginPath();
        ctx.arc(w * 0.58, h * 0.42, w * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = isCobalt ? '#C85230' : '#26435A';
        ctx.beginPath();
        ctx.moveTo(w * 0.12, h * 0.84);
        ctx.arc(w * 0.12, h * 0.84, w * 0.42, -Math.PI / 2, 0, false);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#DCA23A';
        ctx.fillRect(w * 0.16, h * 0.18, w * 0.16, h * 0.28);

        // 极简少女侧脸剪影
        ctx.fillStyle = '#1C1A17';
        ctx.beginPath();
        ctx.moveTo(w * 0.34, h * 0.88);
        ctx.lineTo(w * 0.36, h * 0.58);
        ctx.quadraticCurveTo(w * 0.32, h * 0.36, w * 0.46, h * 0.30);
        ctx.quadraticCurveTo(w * 0.58, h * 0.30, w * 0.61, h * 0.42);
        ctx.lineTo(w * 0.65, h * 0.46); // 鼻尖
        ctx.lineTo(w * 0.62, h * 0.49);
        ctx.lineTo(w * 0.63, h * 0.52);
        ctx.quadraticCurveTo(w * 0.60, h * 0.56, w * 0.54, h * 0.58);
        ctx.lineTo(w * 0.54, h * 0.88);
        ctx.closePath();
        ctx.fill();

        // 流动几何丝带弧线
        ctx.strokeStyle = '#F5EFE2';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(w * 0.42, h * 0.48);
        ctx.bezierCurveTo(w * 0.26, h * 0.55, w * 0.22, h * 0.68, w * 0.12, h * 0.72);
        ctx.stroke();

        drawPaperGrain(ctx, w, h, 0.03, 808 + variant);
      }

      function paintCustomImage(ctx, w, h, imgObj) {
        ctx.fillStyle = '#141210';
        ctx.fillRect(0, 0, w, h);
        const iw = imgObj.naturalWidth || imgObj.width || w;
        const ih = imgObj.naturalHeight || imgObj.height || h;
        const scale = Math.max(w / iw, h / ih);
        const dw = iw * scale;
        const dh = ih * scale;
        ctx.drawImage(imgObj, (w - dw) / 2, (h - dh) / 2, dw, dh);
      }

      const PAINTERS = {
        'tyndall-cyber': paintTyndallCyber,
        'sunset-torii': paintSunsetTorii,
        'watercolor-greenhouse': paintWatercolorGreenhouse,
        'baroque-cathedral': paintBaroqueCathedral,
        'retro-rain-neon': paintRetroRainNeon,
        'emerald-stag': paintEmeraldStag,
        'ukiyoe-crimson-moon': paintUkiyoeCrimsonMoon,
        'bauhaus-silhouette': paintBauhausSilhouette
      };

      function renderCanvasArt(canvas, themeId, variantIdx, aspectRatio, customImgKey) {
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const cssW = Math.max(rect.width || canvas.clientWidth || 320, 64);
        const cssH = Math.max(rect.height || cssW / (aspectRatio || 1), 64);
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const targetW = Math.round(cssW * dpr);
        const targetH = Math.round(cssH * dpr);
        if (canvas.width !== targetW || canvas.height !== targetH) {
          canvas.width = targetW;
          canvas.height = targetH;
        }
        const ctx = canvas.getContext('2d');
        ctx.save();
        ctx.scale(dpr, dpr);
        const customImg = customImgKey ? state.customImages[customImgKey] : null;
        if (customImg) {
          paintCustomImage(ctx, cssW, cssH, customImg);
        } else {
          const painter = PAINTERS[themeId] || paintTyndallCyber;
          painter(ctx, cssW, cssH, variantIdx || 0);
        }
        ctx.restore();
      }

      function fitStageArtworkBoxes() {
        document.querySelectorAll('#artworkStageBox[data-box-ratio]').forEach((box) => {
          const frame = box.parentElement;
          if (!frame) return;
          const ratio = Number(box.dataset.boxRatio || 1);
          const pad = 8;
          const fw = Math.max(frame.clientWidth - pad, 120);
          const fh = Math.max(frame.clientHeight - pad, 120);
          let w = fw;
          let h = w / ratio;
          if (h > fh) {
            h = fh;
            w = h * ratio;
          }
          box.style.width = `${Math.floor(w)}px`;
          box.style.height = `${Math.floor(h)}px`;
        });
      }

      function hydrateAllCanvases() {
        fitStageArtworkBoxes();
        document.querySelectorAll('canvas[data-art-theme]').forEach((cv) => {
          const theme = cv.dataset.artTheme;
          const variant = Number(cv.dataset.artVariant || 0);
          const ratio = Number(cv.dataset.artRatio || 1);
          const customKey = cv.dataset.customImg || '';
          renderCanvasArt(cv, theme, variant, ratio, customKey);
        });
      }

      /* =========================================================================
       * 5. 提示词 AST 解析与 4 种目标方言转换引擎
       * ========================================================================= */
      function findSnippet(snippetId) {
        return state.snippets.find((s) => s.id === snippetId);
      }

      function expandTokenToLeaves(tok, mult = 1.0) {
        if (!tok || tok.muted) return [];
        if (tok.kind === 'tag') {
          return [{ text: tok.text, weight: Number((tok.weight * mult).toFixed(2)) }];
        }
        const snp = findSnippet(tok.snippetId);
        if (!snp) return [];
        const parsed = parseRawToTokens(snp.content);
        const out = [];
        parsed.forEach((sub) => {
          if (sub.muted) return;
          if (sub.kind === 'tag') {
            out.push({ text: sub.text, weight: Number((sub.weight * tok.weight * mult).toFixed(2)) });
          }
        });
        return out;
      }

      function formatSingleLeaf(leaf, dialect) {
        const cleanText = leaf.text.trim();
        if (!cleanText) return '';
        const w = Number(leaf.weight || 1.0);
        if (dialect === 'plain') {
          return cleanText;
        }
        if (dialect === 'moss') {
          const spaced = cleanText.replace(/_/g, ' ');
          return Math.abs(w - 1.0) < 0.01 ? spaced : `(${spaced}:${w.toFixed(2)})`;
        }
        if (dialect === 'nai') {
          return Math.abs(w - 1.0) < 0.01 ? cleanText : `${w.toFixed(2)}::${cleanText}::`;
        }
        if (dialect === 'sd' || dialect === 'anima') {
          return Math.abs(w - 1.0) < 0.01 ? cleanText : `(${cleanText}:${w.toFixed(2)})`;
        }
        return cleanText;
      }

      function compileTokensToString(tokens, targetMode, cardDialect = 'nai') {
        const dialect = targetMode === 'native' ? cardDialect : targetMode;
        const parts = [];
        tokens.forEach((tok) => {
          const leaves = expandTokenToLeaves(tok, 1.0);
          leaves.forEach((lf) => {
            const formatted = formatSingleLeaf(lf, dialect);
            if (formatted) parts.push(formatted);
          });
        });
        return parts.join(', ');
      }

      function tokensToEditableSource(tokens, cardDialect = 'nai') {
        return tokens
          .map((tok) => {
            const prefix = tok.muted ? '~~' : '';
            const suffix = tok.muted ? '~~' : '';
            if (tok.kind === 'snippet') {
              const snp = findSnippet(tok.snippetId);
              const name = snp ? snp.name : '未知积木';
              const core = Math.abs(tok.weight - 1.0) < 0.01 ? `[🧩 ${name}]` : `${tok.weight.toFixed(2)}::[🧩 ${name}]::`;
              return `${prefix}${core}${suffix}`;
            }
            const formatted = formatSingleLeaf({ text: tok.text, weight: tok.weight }, cardDialect);
            return `${prefix}${formatted}${suffix}`;
          })
          .join(', ');
      }

      function parseRawToTokens(raw) {
        if (!raw || !raw.trim()) return [];
        const chunks = raw.split(',').map((s) => s.trim()).filter(Boolean);
        return chunks.map((chunk) => {
          let work = chunk;
          let muted = false;
          if (work.startsWith('~~') && work.endsWith('~~') && work.length > 4) {
            muted = true;
            work = work.slice(2, -2).trim();
          }

          let weight = 1.0;
          const naiMatch = work.match(/^([0-9]+(?:\.[0-9]+)?)::(.*?)::$/);
          if (naiMatch) {
            weight = parseFloat(naiMatch[1]);
            work = naiMatch[2].trim();
          } else {
            const sdMatch = work.match(/^\((.+):([0-9]+(?:\.[0-9]+)?)\)$/);
            if (sdMatch) {
              weight = parseFloat(sdMatch[2]);
              work = sdMatch[1].trim();
            } else if (work.startsWith('{') && work.endsWith('}')) {
              let depth = 0;
              while (work.startsWith('{') && work.endsWith('}')) {
                depth++;
                work = work.slice(1, -1).trim();
              }
              weight = Number(Math.pow(1.05, depth).toFixed(2));
            }
          }

          const snpMatch = work.match(/^\[🧩\s*(.+?)\]$/);
          if (snpMatch) {
            const snpName = snpMatch[1].trim();
            const found = state.snippets.find((s) => s.name === snpName);
            if (found) {
              return makeSnippetRef(found.id, weight, muted);
            }
          }

          return makeTag(work, weight, muted);
        });
      }

      /* =========================================================================
       * 6. 工具函数：剪贴板、Toast、Schema 查询
       * ========================================================================= */
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getSchema(schemaId) {
        return state.schemas.find((s) => s.id === schemaId) || state.schemas[0];
      }

      function copyText(text, label) {
        const finalText = text && text.trim() ? text : '(空提示词)';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(finalText).catch(() => {});
        } else {
          const ta = document.createElement('textarea');
          ta.value = finalText;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta);
        }
        showToast(label, finalText);
      }

      function showToast(title, detail = '') {
        const stack = document.getElementById('toastStack');
        if (!stack) return;
        const el = document.createElement('div');
        el.className = 'sl-toast';
        el.innerHTML = `<strong>${escapeHtml(title)}</strong>${detail ? `<code class="sl-toast-code">${escapeHtml(detail)}</code>` : ''}`;
        stack.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 2800);
      }

      function getFilteredCards() {
        const q = state.searchQuery.trim().toLowerCase();
        return state.cards.filter((card) => {
          if (state.onlyFavorites && !card.favorite) return false;
          if (state.platformFilter !== '全部' && card.platform !== state.platformFilter) return false;
          if (state.tagFilter && !card.tags.includes(state.tagFilter)) return false;
          if (!q) return true;
          const schema = getSchema(card.schemaId);
          const posStr = compileTokensToString(card.posTokens, 'plain', schema.dialect).toLowerCase();
          const negStr = compileTokensToString(card.negTokens, 'plain', schema.dialect).toLowerCase();
          return (
            card.title.toLowerCase().includes(q) ||
            schema.name.toLowerCase().includes(q) ||
            schema.shortName.toLowerCase().includes(q) ||
            card.tags.some((t) => t.toLowerCase().includes(q)) ||
            posStr.includes(q) ||
            negStr.includes(q)
          );
        });
      }

      function formatSyntaxLabel(mode) {
        if (mode === 'nai') return 'NAI 1.2::tag::';
        if (mode === 'sd') return 'SD (tag:1.2)';
        if (mode === 'plain') return '纯词去权';
        return '原样';
      }

      function copyCardPrompt(cardId, side, syntaxMode) {
        const card = state.cards.find((c) => c.id === cardId);
        if (!card) return;
        const schema = getSchema(card.schemaId);
        const tokens = side === 'pos' ? card.posTokens : card.negTokens;
        const output = compileTokensToString(tokens, syntaxMode, schema.dialect);
        const prefix = side === 'pos' ? '已复制正面提示词' : '已复制负面提示词';
        const modeTxt = syntaxMode === 'native' ? `${schema.shortName} 原样` : formatSyntaxLabel(syntaxMode);
        copyText(output, `${prefix} · ${modeTxt}`);
      }

      /* =========================================================================
       * 8. 画册页面渲染 (杂志丝带 + 纯图瀑布流)
       * ========================================================================= */
      function buildMasonryColumnsHtml(cards, colCount, isMobile = false) {
        if (!cards.length) {
          return `
            <div class="sl-empty-state">
              <h3>画册暂未匹配到相关画师串</h3>
              <p>尝试切换平台丝带、清除聚光灯搜索词，或取消「仅看收藏」过滤。</p>
              <button class="sl-btn-soft" id="resetFiltersBtn" style="margin-top: 12px;">恢复全部画册展示</button>
            </div>
          `;
        }

        const cols = Array.from({ length: colCount }, () => ({ height: 0, items: [] }));
        cards.forEach((card) => {
          let shortest = cols[0];
          for (let i = 1; i < cols.length; i++) {
            if (cols[i].height < shortest.height) shortest = cols[i];
          }
          shortest.items.push(card);
          shortest.height += 1 / (card.aspectRatio || 1) + 0.12;
        });

        return `
          <div class="sl-masonry-grid" style="gap: ${isMobile ? '11px' : '22px'};">
            ${cols.map((col) => `
              <div class="sl-masonry-col" style="gap: ${isMobile ? '11px' : '22px'};">
                ${col.items.map((card) => renderGalleryCardHtml(card, isMobile)).join('')}
              </div>
            `).join('')}
          </div>
        `;
      }

        return `
          <article class="sl-card ${isSyntaxOpen ? 'is-menu-open' : ''}" data-card-id="${card.id}">
            <div class="sl-card-media" style="aspect-ratio: ${card.aspectRatio};">
              <canvas

                data-art-theme="${escapeHtml(card.artTheme)}"

                data-art-ratio="${card.aspectRatio}"
                data-custom-img="${escapeHtml(customKey)}"
              ></canvas>

              <div class="sl-card-top-badges">
                <span class="sl-model-chip">${escapeHtml(schema.shortName)}</span>

              </div>

              ${isMobile ? `

              ` : `
                <div class="sl-card-hover-bar" data-stop-open="1">
                  <div class="sl-card-hover-title">
                    <span>${escapeHtml(card.title)}</span>
                    <small>${card.variants.length} 变体</small>
                  </div>
                  <div class="sl-card-actions-pill">
                    <button class="sl-hover-act-btn is-primary" data-copy-pos="${card.id}">复制正面</button>
                    <button class="sl-hover-act-btn" data-copy-neg="${card.id}">复制负面</button>
                    <button class="sl-hover-act-btn" data-toggle-syntax="${card.id}">语法 ▾</button>

                    ${isSyntaxOpen ? `
                      <div class="sl-syntax-dropdown">
                        <button class="sl-syntax-option" data-syntax-copy="${card.id}:pos:native"><span>正面 · 原样</span><code>${escapeHtml(schema.shortName)}</code></button>
                        <button class="sl-syntax-option" data-syntax-copy="${card.id}:pos:nai"><span>正面 · NAI</span><code>1.2::tag::</code></button>
                        <button class="sl-syntax-option" data-syntax-copy="${card.id}:pos:sd"><span>正面 · SD</span><code>(tag:1.2)</code></button>
                        <button class="sl-syntax-option" data-syntax-copy="${card.id}:pos:plain"><span>正面 · 纯词去权</span><code>plain</code></button>
                        <div style="height:1px;background:var(--sl-hairline);margin:3px 0;"></div>
                        <button class="sl-syntax-option" data-syntax-copy="${card.id}:neg:nai"><span>负面 · NAI</span><code>1.2::tag::</code></button>
                        <button class="sl-syntax-option" data-syntax-copy="${card.id}:neg:sd"><span>负面 · SD</span><code>(tag:1.2)</code></button>

      function renderVisualStageHtml(card, isMobile = false) {
        const activeVar = card.activeVariant || 0;

        const canAB = card.variants.length >= 2;

        const schema = getSchema(card.schemaId);

        return `
          <div class="sl-stage-topbar">
            <div class="sl-stage-meta">
              <strong>${escapeHtml(schema.shortName)}</strong>
              <span class="sl-tabular">${escapeHtml(card.aspectLabel)}</span>
            </div>
            ${canAB ? `
              <button class="sl-ab-toggle ${state.abMode ? 'is-active' : ''}" id="abToggleBtn">
                ${ICONS.split}<span>A/B 拉帘对比</span>
              </button>
            ` : `<span style="font-size:11.5px;opacity:0.6;">单图封面</span>`}
          </div>

          <div class="sl-stage-frame" style="${isMobile ? 'height: 228px; flex: none;' : ''}">
            <div class="sl-artwork-box" id="artworkStageBox" data-box-ratio="${card.aspectRatio}" style="${boxStyle}">
              ${state.abMode && canAB ? `
                <canvas
                  data-art-theme="${escapeHtml(card.artTheme)}"
                  data-art-variant="${abRight}"
                  data-art-ratio="${card.aspectRatio}"
                  data-custom-img="${escapeHtml(customKey)}"
                ></canvas>

                <div class="sl-curtain-layer" id="abClipLayer" style="clip-path: inset(0 ${100 - state.abSplitPct}% 0 0);">
                  <canvas
                    data-art-theme="${escapeHtml(card.artTheme)}"
                    data-art-variant="${abLeft}"
                    data-art-ratio="${card.aspectRatio}"
                    data-custom-img="${escapeHtml(customKey)}"
                  ></canvas>
                </div>

                <span class="sl-curtain-badge is-left">${escapeHtml(card.variants[abLeft]?.name || '左图')}</span>
                <span class="sl-curtain-badge is-right">${escapeHtml(card.variants[abRight]?.name || '右图')}</span>

                <div class="sl-curtain-divider" id="abDivider" style="left: ${state.abSplitPct}%;">
                  <div class="sl-curtain-handle">⇄</div>
                </div>
              ` : `
                <canvas
                  data-art-theme="${escapeHtml(card.artTheme)}"
                  data-art-variant="${activeVar}"
                  data-art-ratio="${card.aspectRatio}"
                  data-custom-img="${escapeHtml(customKey)}"
                ></canvas>
              `}
            </div>
          </div>

          ${state.abMode && canAB ? `
            <div class="sl-ab-controls">
              <span>左图</span>
              <select class="sl-ab-select" id="abLeftSelect">
                ${card.variants.map((v, idx) => `<option value="${idx}" ${idx === abLeft ? 'selected' : ''}>${escapeHtml(v.name)}</option>`).join('')}
              </select>
              <span class="sl-tabular" id="abPctLabel" style="min-width:34px;text-align:center;">${Math.round(state.abSplitPct)}%</span>
              <span>右图</span>
              <select class="sl-ab-select" id="abRightSelect">
                ${card.variants.map((v, idx) => `<option value="${idx}" ${idx === abRight ? 'selected' : ''}>${escapeHtml(v.name)}</option>`).join('')}
              </select>
            </div>
          ` : ''}

          <div class="sl-filmstrip">
            ${card.variants.map((v, idx) => `
              <button class="sl-film-item ${!state.abMode && activeVar === idx ? 'is-active' : ''}" data-variant-idx="${idx}">
                <div class="sl-film-thumb">
                  <canvas
                    data-art-theme="${escapeHtml(card.artTheme)}"
                    data-art-variant="${idx}"
                    data-art-ratio="1"
                    data-custom-img="${escapeHtml(customKey)}"
                  ></canvas>
                </div>
                <span>0${idx + 1} ${isMobile ? '' : escapeHtml(v.name.split('·')[1] || v.name)}</span>
              </button>
            `).join('')}
          </div>
        `;
      }

      function renderWeaveSectionHtml(card, side, schema) {
        const isPos = side === 'pos';
        const tokens = isPos ? card.posTokens : card.negTokens;
        const mode = isPos ? card.posMode : card.negMode;
        const title = isPos ? '正面提示词 · Positive' : '负面提示词 · Negative / UC';
        const menuOpen = state.openPromptSyntaxMenu === side;

        return `
          <div class="sl-prompt-block" data-prompt-side="${side}">
            <div class="sl-prompt-block-head">
              <div class="sl-prompt-label">
                <span>${title}</span>
                <span class="sl-chip-soft sl-tabular">${tokens.length} 块</span>
              </div>

              <div class="sl-prompt-tools">
                <button class="sl-mini-btn" data-toggle-mode="${side}">
                  ${mode === 'capsule' ? '切至源码' : '切至胶囊'}
                </button>
                <button class="sl-mini-btn is-accent" data-copy-side="${side}:native">
                  ${ICONS.copy}<span>复制</span>
                </button>
                <button class="sl-mini-btn" data-toggle-side-syntax="${side}">语法 ▾</button>

                ${menuOpen ? `
                  <div class="sl-syntax-dropdown" style="top: calc(100% + 6px); bottom: auto;">
                    <button class="sl-syntax-option" data-copy-side="${side}:native"><span>原样格式</span><code>${escapeHtml(schema.shortName)}</code></button>
                    <button class="sl-syntax-option" data-copy-side="${side}:nai"><span>NAI 语法</span><code>1.2::tag::</code></button>
                    <button class="sl-syntax-option" data-copy-side="${side}:sd"><span>SD 语法</span><code>(tag:1.2)</code></button>
                    <button class="sl-syntax-option" data-copy-side="${side}:plain"><span>纯词去权</span><code>plain</code></button>
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="sl-capsule-well">
              ${mode === 'capsule' ? `
                <div class="sl-capsule-flow" data-capsule-flow="${side}">
                  ${tokens.length ? tokens.map((tok, idx) => renderCapsuleItemHtml(card, side, tok, idx)).join('') : `
                    <span style="font-size:12px;color:var(--sl-muted);">暂无词条，可在下方快速输入或织入预设积木。</span>
                  `}
                </div>
              ` : `
                <textarea class="sl-source-textarea" data-source-side="${side}" placeholder="输入逗号分隔提示词，支持 1.2::tag::、(tag:1.2) 与 [🧩 预设名]…">${escapeHtml(tokensToEditableSource(tokens, schema.dialect))}</textarea>
              `}
            </div>

            ${mode === 'capsule' ? `
              <div class="sl-capsule-add-row">
                <input class="sl-input-soft" data-add-input="${side}" type="text" placeholder="输入词条后回车添加（支持 1.15::tag:: 或直接文本）…" />
                <button class="sl-mini-btn is-celadon" data-open-snippet-picker="${side}" style="height:34px;padding:0 12px;">
                  ${ICONS.puzzle}<span>织入预设积木</span>
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }

      function renderCapsuleItemHtml(card, side, tok, idx) {
        const capKey = `${card.id}:${side}:${tok.id}`;
        const isOpen = state.activeCapsuleKey === capKey;
        const isSnippet = tok.kind === 'snippet';
        const snp = isSnippet ? findSnippet(tok.snippetId) : null;
        const displayLabel = isSnippet ? (snp ? snp.name : '已删除积木') : tok.text;
        const showWeight = Math.abs(tok.weight - 1.0) >= 0.01;

        return `
          <div class="sl-capsule-wrap ${isOpen ? 'is-open' : ''}" data-cap-wrap="${capKey}">
            <div
              class="sl-capsule ${isSnippet ? 'is-snippet' : ''} ${tok.muted ? 'is-muted' : ''}"
              draggable="true"
              data-cap-key="${capKey}"
              data-cap-side="${side}"
              data-cap-idx="${idx}"
              data-tok-id="${tok.id}"
            >
              ${isSnippet ? ICONS.puzzle : ''}
              <span>${escapeHtml(displayLabel)}</span>
              ${showWeight ? `<sup class="sl-capsule-weight sl-tabular">${tok.weight.toFixed(2)}</sup>` : ''}
            </div>

            <div class="sl-capsule-popover" data-stop-cap="1">
              <button class="sl-pop-btn" data-cap-act="dec:${side}:${tok.id}" title="权重 -0.05">-0.05</button>
              <span class="sl-pop-val sl-tabular">${tok.weight.toFixed(2)}</span>
              <button class="sl-pop-btn" data-cap-act="inc:${side}:${tok.id}" title="权重 +0.05">+0.05</button>
              <span class="sl-pop-sep"></span>
              <button class="sl-pop-btn" data-cap-act="mute:${side}:${tok.id}">${tok.muted ? '恢复' : '静音'}</button>
              ${isSnippet ? `
                <span class="sl-pop-sep"></span>
                <button class="sl-pop-btn is-celadon" data-cap-act="explode:${side}:${tok.id}">打散积木</button>
              ` : ''}
              <span class="sl-pop-sep"></span>
              <button class="sl-pop-btn is-danger" data-cap-act="del:${side}:${tok.id}">移除</button>
            </div>
          </div>
        `;
      }

      function renderParamsTabHtml(card, schema) {
        return `
          <div class="sl-schema-switcher">
            <div>
              <div style="font-size:12px;color:var(--sl-muted);margin-bottom:2px;">当前绑定底模 Schema</div>
              <div style="font-size:13px;font-weight:600;">${escapeHtml(schema.desc)}</div>
            </div>
            <select class="sl-select-soft" id="cardSchemaSelect">
              ${state.schemas.map((s) => `
                <option value="${s.id}" ${s.id === card.schemaId ? 'selected' : ''}>${escapeHtml(s.name)}</option>
              `).join('')}
            </select>
          </div>

          <div class="sl-param-list">
            ${schema.fields.map((f) => renderParamFieldHtml(card, f)).join('')}
          </div>
        `;
      }

      function renderParamFieldHtml(card, field) {
        const val = card.params[field.key] !== undefined ? card.params[field.key] : field.defaultValue;

        if (field.type === 'slider') {
          const numVal = Number(val ?? field.defaultValue);
          const hasSafe = field.safeMin !== undefined && field.safeMax !== undefined;
          const inSafe = !hasSafe || (numVal >= field.safeMin && numVal <= field.safeMax);
          const span = Math.max(field.max - field.min, 0.001);
          const leftPct = hasSafe ? ((field.safeMin - field.min) / span) * 100 : 0;
          const widthPct = hasSafe ? ((field.safeMax - field.safeMin) / span) * 100 : 0;

          return `
            <div class="sl-param-card">
              <div class="sl-param-head">
                <span class="sl-param-name">${escapeHtml(field.label)}</span>
                <div class="sl-param-status">
                  <strong class="sl-tabular" style="font-size:14px;">${numVal}</strong>
                  ${hasSafe ? `
                    <span class="sl-safe-badge ${inSafe ? 'is-safe' : 'is-warn'}">
                      ${inSafe ? '✓ 安全区间内' : `⚠ 超出推荐 (${field.safeMin}–${field.safeMax})`}
                    </span>
                  ` : ''}
                </div>
              </div>
              <div class="sl-slider-wrap">
                <div class="sl-slider-track">
                  ${hasSafe ? `<div class="sl-slider-safe-band" style="left:${leftPct}%;width:${widthPct}%;"></div>` : ''}
                </div>
                <input
                  class="sl-range-input"
                  type="range"
                  min="${field.min}"
                  max="${field.max}"
                  step="${field.step || 1}"
                  value="${numVal}"
                  data-param-slider="${field.key}"
                />
              </div>
              ${field.hint ? `<div class="sl-param-hint">${escapeHtml(field.hint)}</div>` : ''}
            </div>
          `;
        }

        if (field.type === 'stepper') {
          const numVal = Number(val ?? field.defaultValue);
          const hasSafe = field.safeMin !== undefined && field.safeMax !== undefined;
          const inSafe = !hasSafe || (numVal >= field.safeMin && numVal <= field.safeMax);
          return `
            <div class="sl-param-card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <div>
                <div class="sl-param-name">${escapeHtml(field.label)}</div>
                ${hasSafe ? `<span class="sl-safe-badge ${inSafe ? 'is-safe' : 'is-warn'}" style="display:inline-block;margin-top:4px;">${inSafe ? '安全区间内' : `推荐 ${field.safeMin}–${field.safeMax}`}</span>` : ''}
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="sl-mini-btn" data-step-dec="${field.key}:${field.min ?? 1}">−</button>
                <strong class="sl-tabular" style="min-width:28px;text-align:center;">${numVal}</strong>
                <button class="sl-mini-btn" data-step-inc="${field.key}:${field.max ?? 99}">+</button>
              </div>
            </div>
          `;
        }

        if (field.type === 'select' || field.type === 'resolution') {
          const opts = field.options || [];
          return `
            <div class="sl-param-card">
              <div class="sl-param-head" style="margin-bottom:8px;">
                <span class="sl-param-name">${escapeHtml(field.label)}</span>
                <span class="sl-tabular" style="font-size:12px;color:var(--sl-muted);">${escapeHtml(String(val))}</span>
              </div>
              <div class="sl-pill-group">
                ${opts.map((opt) => `
                  <button class="sl-choice-pill ${String(val) === String(opt) ? 'is-active' : ''}" data-param-choice="${field.key}" data-choice-val="${escapeHtml(opt)}">
                    ${escapeHtml(opt)}
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }

        if (field.type === 'toggle') {
          const on = Boolean(val);
          return `
            <div class="sl-param-card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <span class="sl-param-name">${escapeHtml(field.label)}</span>
              <button class="sl-switch ${on ? 'is-on' : ''}" data-param-toggle="${field.key}" aria-pressed="${on}"></button>
            </div>
          `;
        }

        if (field.type === 'text') {
          return `
            <div class="sl-param-card">
              <div class="sl-param-head"><span class="sl-param-name">${escapeHtml(field.label)}</span></div>
              <input class="sl-input-soft" style="width:100%;" type="text" value="${escapeHtml(String(val || ''))}" data-param-text="${field.key}" />
            </div>
          `;
        }

        if (field.type === 'lora_list') {
          const list = Array.isArray(val) ? val : [];
          return `
            <div class="sl-param-card">
              <div class="sl-param-head">
                <span class="sl-param-name">${escapeHtml(field.label)}</span>
                <button class="sl-mini-btn is-accent" data-add-lora="${field.key}">${ICONS.plus}<span>挂载 LoRA</span></button>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${list.length ? list.map((lr, i) => `
                  <div style="display:flex;align-items:center;gap:8px;background:var(--sl-surface);padding:8px 10px;border-radius:10px;">
                    <input class="sl-input-soft" style="flex:1;height:28px;" value="${escapeHtml(lr.name)}" data-lora-name="${field.key}:${i}" />
                    <input type="range" min="0" max="1.5" step="0.05" value="${lr.weight}" style="width:90px;" data-lora-weight="${field.key}:${i}" />
                    <span class="sl-tabular" style="font-size:12px;min-width:34px;">${Number(lr.weight).toFixed(2)}</span>
                    <button class="sl-mini-btn" data-del-lora="${field.key}:${i}">×</button>
                  </div>
                `).join('') : `<span style="font-size:12px;color:var(--sl-muted);">当前未挂载 LoRA。</span>`}
              </div>
            </div>
          `;
        }

        return '';
      }

      function renderNotesTabHtml(card, schema) {
        return `
          <div style="display:flex;flex-direction:column;gap:18px;">
            <div>
              <label style="display:block;font-size:12px;color:var(--sl-muted);margin-bottom:6px;">画师串名称</label>
              <input class="sl-input-soft" id="noteTitleInput" style="width:100%;height:38px;font-size:14px;font-weight:600;" value="${escapeHtml(card.title)}" />
            </div>

            <div>
              <label style="display:block;font-size:12px;color:var(--sl-muted);margin-bottom:6px;">画册风格标签（将同步更新主画廊筛选丝带）</label>
              <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;">
                ${card.tags.map((t, idx) => `
                  <span class="sl-chip-soft">
                    <span>${escapeHtml(t)}</span>
                    <button data-remove-card-tag="${idx}" style="margin-left:4px;color:var(--sl-muted);">×</button>

              <div style="display:flex;gap:8px;">

                <button class="sl-btn-soft" id="addCardTagBtn" style="height:34px;">添加标签</button>
              </div>

            <div>
              <label style="display:block;font-size:12px;color:var(--sl-muted);margin-bottom:6px;">来源溯源与调参手记</label>
              <textarea class="sl-input-soft" id="cardNotesArea" style="width:100%;min-height:110px;height:auto;padding:10px 12px;line-height:1.6;">${escapeHtml(card.notes || '')}</textarea>
            </div>

            <div class="sl-param-card" style="background:var(--sl-accent-soft);">
              <div style="font-family:var(--sl-font-serif);font-size:15px;font-weight:700;margin-bottom:6px;">
                一卡一模型 · 跨底模克隆对比

              <p style="margin:0 0 12px;font-size:12.5px;color:var(--sl-muted);">

                  ${state.schemas.filter((s) => s.id !== card.schemaId).map((s) => `

                  `).join('')}

                  ${ICONS.clone}<span>克隆到其他底模并转写语法</span>
                </button>

      function renderSpreadModal() {
        const overlay = document.getElementById('spreadOverlay');
        const card = state.cards.find((c) => c.id === state.openCardId);
        if (!card) {
          overlay.classList.remove('is-open');
          overlay.setAttribute('aria-hidden', 'true');
          return;
        }

        const schema = getSchema(card.schemaId);
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');

        overlay.innerHTML = `
          <div class="sl-spread-modal" role="dialog" aria-label="${escapeHtml(card.title)}">
            <section class="sl-spread-left">
              ${renderVisualStageHtml(card, false)}
            </section>

            <section class="sl-spread-right">
              <div class="sl-spread-head">
                <div class="sl-spread-title-row">
                  <div>
                    <h2 class="sl-spread-title">${escapeHtml(card.title)}</h2>
                    <div class="sl-spread-sub">
                      <span class="sl-chip-soft">${escapeHtml(schema.shortName)}</span>
                      <span class="sl-chip-soft">${escapeHtml(card.platform)}</span>
                      ${card.tags.map((t) => `<span>${escapeHtml(t)}</span>`).join('')}
                    </div>
                  </div>
                  <div style="display:flex;gap:8px;align-items:center;">
                    <button class="sl-close-btn" id="spreadFavBtn" title="收藏" style="color:${card.favorite ? 'var(--sl-accent)' : 'var(--sl-muted)'};font-size:15px;">
                      ${card.favorite ? '★' : '☆'}
                    </button>
                    <button class="sl-close-btn" id="spreadCloseBtn" title="关闭">${ICONS.close}</button>
                  </div>
                </div>

                <div class="sl-spread-tabs">
                  <button class="sl-spread-tab ${state.spreadTab === 'weave' ? 'is-active' : ''}" data-spread-tab="weave">
                    <span>01</span>咒语编织
                  </button>
                  <button class="sl-spread-tab ${state.spreadTab === 'params' ? 'is-active' : ''}" data-spread-tab="params">
                    <span>02</span>底模参数
                  </button>
                  <button class="sl-spread-tab ${state.spreadTab === 'notes' ? 'is-active' : ''}" data-spread-tab="notes">
                    <span>03</span>溯源手记
                  </button>
                </div>
              </div>

              <div class="sl-spread-body sl-scroll" id="spreadBodyScroll">
                ${state.spreadTab === 'weave'
                  ? renderWeaveSectionHtml(card, 'pos', schema) + renderWeaveSectionHtml(card, 'neg', schema)
                  : state.spreadTab === 'params'
                  ? renderParamsTabHtml(card, schema)
                  : renderNotesTabHtml(card, schema)}
              </div>
            </section>
          </div>
        `;

        hydrateAllCanvases();
        bindDetailEditorEvents(overlay, card, false);

        overlay.onclick = (e) => {
          if (e.target === overlay) closeSpreadModal();
        };
        const closeBtn = overlay.querySelector('#spreadCloseBtn');
        if (closeBtn) closeBtn.addEventListener('click', closeSpreadModal);
      }

      function positionPopoverInsideBounds(wrap) {
        const pop = wrap.querySelector('.sl-capsule-popover');
        const scroller = wrap.closest('.sl-spread-body, .sl-scroll');
        if (!pop || !scroller) return;
        pop.style.left = '50%';
        pop.style.transform = 'translateX(-50%)';
        pop.style.bottom = 'calc(100% + 8px)';
        pop.style.top = 'auto';
        const pRect = pop.getBoundingClientRect();
        const sRect = scroller.getBoundingClientRect();
        let dx = 0;
        if (pRect.left < sRect.left + 8) dx = sRect.left + 8 - pRect.left;
        else if (pRect.right > sRect.right - 8) dx = sRect.right - 8 - pRect.right;
        if (dx !== 0) {
          pop.style.transform = `translateX(calc(-50% + ${Math.round(dx)}px))`;
        }
        if (pRect.top < sRect.top + 4) {
          pop.style.bottom = 'auto';
          pop.style.top = 'calc(100% + 8px)';
        }
      }

      function bindDetailEditorEvents(rootEl, card, isMobile) {
        const rerender = () => {
          const scroller = rootEl.querySelector('.sl-spread-body, .sl-scroll');
          const savedScroll = scroller ? scroller.scrollTop : 0;
          if (isMobile) {
            renderMainStage();
            const nextScroller = document.querySelector('#mobileDrawer .sl-scroll');
            if (nextScroller) nextScroller.scrollTop = savedScroll;
          } else {
            renderSpreadModal();
            const nextScroller = document.querySelector('#spreadOverlay .sl-spread-body');
            if (nextScroller) nextScroller.scrollTop = savedScroll;
          }
        };

        rootEl.querySelectorAll('.sl-capsule-wrap').forEach((wrap) => {
          if (wrap.classList.contains('is-open')) {
            requestAnimationFrame(() => positionPopoverInsideBounds(wrap));
          }
          wrap.addEventListener('mouseenter', () => {
            requestAnimationFrame(() => positionPopoverInsideBounds(wrap));
          });
        });

        const favBtn = rootEl.querySelector('#spreadFavBtn');
        if (favBtn) {
          favBtn.addEventListener('click', () => {
            card.favorite = !card.favorite;
            rerender();
          });
        }

        rootEl.querySelectorAll('[data-spread-tab]').forEach((tab) => {
          tab.addEventListener('click', () => {
            state.spreadTab = tab.dataset.spreadTab;
            state.activeCapsuleKey = null;
            state.openPromptSyntaxMenu = null;
            rerender();
          });
        });

        // 视觉舞台：变体缩略切换 & A/B 拉帘
        rootEl.querySelectorAll('[data-variant-idx]').forEach((btn) => {
          btn.addEventListener('click', () => {
            card.activeVariant = Number(btn.dataset.variantIdx);
            state.abMode = false;
            rerender();
          });
        });

        const abToggle = rootEl.querySelector('#abToggleBtn');
        if (abToggle) {
          abToggle.addEventListener('click', () => {
            state.abMode = !state.abMode;
            rerender();
          });
        }

        const abLeftSel = rootEl.querySelector('#abLeftSelect');
        if (abLeftSel) {
          abLeftSel.addEventListener('change', (e) => {
            card.abLeft = Number(e.target.value);
            rerender();
          });
        }
        const abRightSel = rootEl.querySelector('#abRightSelect');
        if (abRightSel) {
          abRightSel.addEventListener('change', (e) => {
            card.abRight = Number(e.target.value);
            rerender();
          });
        }

        // A/B 拉帘鼠标/触摸拖拽逻辑
        const abDivider = rootEl.querySelector('#abDivider');
        const artworkBox = rootEl.querySelector('#artworkStageBox');
        const abClipLayer = rootEl.querySelector('#abClipLayer');
        const abPctLabel = rootEl.querySelector('#abPctLabel');
        if (abDivider && artworkBox && abClipLayer) {
          let dragging = false;
          const updateSplit = (clientX) => {
            const rect = artworkBox.getBoundingClientRect();
            const pct = Math.max(4, Math.min(96, ((clientX - rect.left) / rect.width) * 100));
            state.abSplitPct = pct;
            abDivider.style.left = `${pct}%`;
            abClipLayer.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
            if (abPctLabel) abPctLabel.textContent = `${Math.round(pct)}%`;
          };
          abDivider.addEventListener('pointerdown', (e) => {
            dragging = true;
            abDivider.setPointerCapture(e.pointerId);
            updateSplit(e.clientX);
          });
          abDivider.addEventListener('pointermove', (e) => {
            if (dragging) updateSplit(e.clientX);
          });
          abDivider.addEventListener('pointerup', () => { dragging = false; });
          abDivider.addEventListener('pointercancel', () => { dragging = false; });
          artworkBox.addEventListener('pointerdown', (e) => {
            if (state.abMode && e.target !== abDivider) {
              updateSplit(e.clientX);
            }
          });
        }

        // 01 咒语编织事件
        rootEl.querySelectorAll('[data-toggle-mode]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const side = btn.dataset.toggleMode;
            if (side === 'pos') {
              card.posMode = card.posMode === 'capsule' ? 'source' : 'capsule';
            } else {
              card.negMode = card.negMode === 'capsule' ? 'source' : 'capsule';
            }
            state.activeCapsuleKey = null;
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-source-side]').forEach((ta) => {
          ta.addEventListener('change', (e) => {
            const side = ta.dataset.sourceSide;
            const parsed = parseRawToTokens(e.target.value);
            if (side === 'pos') card.posTokens = parsed;
            else card.negTokens = parsed;
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-toggle-side-syntax]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const side = btn.dataset.toggleSideSyntax;
            state.openPromptSyntaxMenu = state.openPromptSyntaxMenu === side ? null : side;
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-copy-side]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const [side, mode] = btn.dataset.copySide.split(':');
            state.openPromptSyntaxMenu = null;
            copyCardPrompt(card.id, side, mode);
            rerender();
          });
        });

        // 胶囊点击锁定微浮窗 & 微浮窗动作
        rootEl.querySelectorAll('[data-cap-key]').forEach((cap) => {
          cap.addEventListener('click', (e) => {
            e.stopPropagation();
            const k = cap.dataset.capKey;
            state.activeCapsuleKey = state.activeCapsuleKey === k ? null : k;
            rerender();
          });

          // 拖拽调序
          cap.addEventListener('dragstart', (e) => {
            cap.classList.add('is-dragging');
            e.dataTransfer.setData('text/plain', `${cap.dataset.capSide}:${cap.dataset.capIdx}`);
          });
          cap.addEventListener('dragend', () => cap.classList.remove('is-dragging'));
          cap.addEventListener('dragover', (e) => e.preventDefault());
          cap.addEventListener('drop', (e) => {
            e.preventDefault();
            const payload = e.dataTransfer.getData('text/plain');
            const [fromSide, fromIdxStr] = payload.split(':');
            const toSide = cap.dataset.capSide;
            const toIdx = Number(cap.dataset.capIdx);
            const fromIdx = Number(fromIdxStr);
            if (fromSide === toSide && fromIdx !== toIdx) {
              const arr = toSide === 'pos' ? card.posTokens : card.negTokens;
              const [moved] = arr.splice(fromIdx, 1);
              arr.splice(toIdx, 0, moved);
              rerender();
            }
          });
        });

        rootEl.querySelectorAll('[data-cap-act]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const [act, side, tokId] = btn.dataset.capAct.split(':');
            const arr = side === 'pos' ? card.posTokens : card.negTokens;
            const idx = arr.findIndex((t) => t.id === tokId);
            if (idx === -1) return;
            const tok = arr[idx];

            if (act === 'inc') {
              tok.weight = Number(Math.min(2.5, tok.weight + 0.05).toFixed(2));
            } else if (act === 'dec') {
              tok.weight = Number(Math.max(0.1, tok.weight - 0.05).toFixed(2));
            } else if (act === 'mute') {
              tok.muted = !tok.muted;
            } else if (act === 'del') {
              arr.splice(idx, 1);
              state.activeCapsuleKey = null;
            } else if (act === 'explode') {
              const snp = findSnippet(tok.snippetId);
              if (snp) {
                const subTokens = parseRawToTokens(snp.content).map((sub) => ({
                  ...sub,
                  weight: Number((sub.weight * tok.weight).toFixed(2)),
                  muted: tok.muted || sub.muted
                }));
                arr.splice(idx, 1, ...subTokens);
                state.activeCapsuleKey = null;
                showToast(`已将 [🧩 ${snp.name}] 打散为 ${subTokens.length} 枚独立词条`);
              }
            }
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-add-input]').forEach((inp) => {
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && inp.value.trim()) {
              e.preventDefault();
              const side = inp.dataset.addInput;
              const parsed = parseRawToTokens(inp.value.trim());
              if (side === 'pos') card.posTokens.push(...parsed);
              else card.negTokens.push(...parsed);
              rerender();
            }
          });
        });

        rootEl.querySelectorAll('[data-open-snippet-picker]').forEach((btn) => {
          btn.addEventListener('click', () => {
            openSnippetPickerModal(card.id, btn.dataset.openSnippetPicker, isMobile);
          });
        });

        // 02 底模参数事件
        const schemaSel = rootEl.querySelector('#cardSchemaSelect');
        if (schemaSel) {
          schemaSel.addEventListener('change', (e) => {
            const newSchema = getSchema(e.target.value);
            card.schemaId = newSchema.id;
            card.platform = newSchema.platform;
            newSchema.fields.forEach((f) => {
              if (card.params[f.key] === undefined) {
                card.params[f.key] = JSON.parse(JSON.stringify(f.defaultValue));
              }
            });
            showToast(`已切换底模至 ${newSchema.name}`);
            rerender();
          });
        }

        rootEl.querySelectorAll('[data-param-slider]').forEach((sl) => {
          sl.addEventListener('input', (e) => {
            const key = sl.dataset.paramSlider;
            const val = Number(e.target.value);
            card.params[key] = val;
            const cardWrap = sl.closest('.sl-param-card');
            if (cardWrap) {
              const numEl = cardWrap.querySelector('.sl-param-status strong');
              if (numEl) numEl.textContent = e.target.value;
              const badgeEl = cardWrap.querySelector('.sl-safe-badge');
              const field = getSchema(card.schemaId).fields.find((f) => f.key === key);
              if (badgeEl && field && field.safeMin !== undefined && field.safeMax !== undefined) {
                const inSafe = val >= field.safeMin && val <= field.safeMax;
                badgeEl.className = `sl-safe-badge ${inSafe ? 'is-safe' : 'is-warn'}`;
                badgeEl.textContent = inSafe ? '✓ 安全区间内' : `⚠ 超出推荐 (${field.safeMin}–${field.safeMax})`;
              }
            }
          });
          sl.addEventListener('change', () => rerender());
        });

        rootEl.querySelectorAll('[data-step-dec]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const [k, minStr] = btn.dataset.stepDec.split(':');
            const cur = Number(card.params[k] ?? 1);
            card.params[k] = Math.max(Number(minStr), cur - 1);
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-step-inc]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const [k, maxStr] = btn.dataset.stepInc.split(':');
            const cur = Number(card.params[k] ?? 1);
            card.params[k] = Math.min(Number(maxStr), cur + 1);
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-param-choice]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const k = btn.dataset.paramChoice;
            card.params[k] = btn.dataset.choiceVal;
            if (k === 'resolution') {
              const parts = String(card.params[k]).split('×').map(Number);
              if (parts.length === 2 && parts[0] && parts[1]) {
                card.aspectRatio = parts[0] / parts[1];
                card.aspectLabel = `${parts[0]}×${parts[1]}`;
              }
            }
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-param-toggle]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const k = btn.dataset.paramToggle;
            card.params[k] = !card.params[k];
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-param-text]').forEach((inp) => {
          inp.addEventListener('change', (e) => {
            card.params[inp.dataset.paramText] = e.target.value;
          });
        });

        rootEl.querySelectorAll('[data-add-lora]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const k = btn.dataset.addLora;
            if (!Array.isArray(card.params[k])) card.params[k] = [];
            card.params[k].push({ name: 'new_style_lora', weight: 0.75 });
            rerender();
          });
        });

        rootEl.querySelectorAll('[data-lora-name]').forEach((inp) => {
          inp.addEventListener('change', (e) => {
            const [k, i] = inp.dataset.loraName.split(':');
            if (card.params[k] && card.params[k][Number(i)]) {
              card.params[k][Number(i)].name = e.target.value;
            }
          });
        });

        rootEl.querySelectorAll('[data-lora-weight]').forEach((inp) => {
          inp.addEventListener('change', (e) => {
            const [k, i] = inp.dataset.loraWeight.split(':');
            if (card.params[k] && card.params[k][Number(i)]) {
              card.params[k][Number(i)].weight = Number(e.target.value);
              rerender();
            }
          });
        });

        rootEl.querySelectorAll('[data-del-lora]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const [k, i] = btn.dataset.delLora.split(':');
            if (Array.isArray(card.params[k])) {
              card.params[k].splice(Number(i), 1);
              rerender();
            }
          });
        });

        // 03 溯源手记事件
        const titleInp = rootEl.querySelector('#noteTitleInput');
        if (titleInp) {
          titleInp.addEventListener('change', (e) => {
            card.title = e.target.value.trim() || card.title;
            rerender();
          });
        }

        rootEl.querySelectorAll('[data-remove-card-tag]').forEach((btn) => {
          btn.addEventListener('click', () => {
            card.tags.splice(Number(btn.dataset.removeCardTag), 1);
            rerender();
          });
        });

        const addTagAction = () => {
          const inp = rootEl.querySelector('#newCardTagInput');
          if (!inp || !inp.value.trim()) return;
          let tag = inp.value.trim();
          if (!tag.startsWith('#')) tag = `#${tag}`;
          if (!card.tags.includes(tag)) card.tags.push(tag);
          rerender();
        };
        const addTagBtn = rootEl.querySelector('#addCardTagBtn');
        if (addTagBtn) addTagBtn.addEventListener('click', addTagAction);
        const tagInp = rootEl.querySelector('#newCardTagInput');
        if (tagInp) {
          tagInp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addTagAction(); }
          });
        }

        const notesArea = rootEl.querySelector('#cardNotesArea');
        if (notesArea) {
          notesArea.addEventListener('change', (e) => {
            card.notes = e.target.value;
          });
        }

        const cloneBtn = rootEl.querySelector('#cloneToModelBtn');
        if (cloneBtn) {
          cloneBtn.addEventListener('click', () => {
            const sel = rootEl.querySelector('#cloneTargetSchemaSelect');
            if (!sel) return;
            const targetSchema = getSchema(sel.value);
            const clonedParams = {};
            targetSchema.fields.forEach((f) => {
              clonedParams[f.key] = card.params[f.key] !== undefined
                ? JSON.parse(JSON.stringify(card.params[f.key]))
                : JSON.parse(JSON.stringify(f.defaultValue));
            });

            const clonePos = JSON.parse(JSON.stringify(card.posTokens)).map((t) => {
              const copy = { ...t, id: nextId('tok') };
              if (copy.kind === 'tag' && targetSchema.dialect === 'moss') {
                copy.text = copy.text.replace(/_/g, ' ');
              }
              return copy;
            });
            if (targetSchema.dialect === 'moss' && !clonePos.some((t) => t.kind === 'tag' && t.text.includes('Anime-style'))) {
              clonePos.unshift(makeTag('Anime-style digital illustration', 1.0));
            }

            const newCard = {
              id: nextId('card'),
              title: `${card.title} (${targetSchema.shortName})`,
              schemaId: targetSchema.id,
              platform: targetSchema.platform,
              aspectRatio: card.aspectRatio,
              aspectLabel: card.aspectLabel,
              artTheme: card.artTheme,
              customImageKey: card.customImageKey || '',
              favorite: false,
              tags: [...card.tags],
              variants: JSON.parse(JSON.stringify(card.variants)),
              activeVariant: card.activeVariant,
              abLeft: 0,
              abRight: Math.min(1, card.variants.length - 1),
              posMode: 'capsule',
              negMode: 'capsule',
              posTokens: clonePos,
              negTokens: JSON.parse(JSON.stringify(card.negTokens)).map((t) => ({ ...t, id: nextId('tok') })),
              params: clonedParams,
              notes: `克隆自「${card.title}」并已转写为 ${targetSchema.name} 语法。\n${card.notes || ''}`
            };
            state.cards.unshift(newCard);
            showToast(`已克隆并转写至 ${targetSchema.shortName}`, compileTokensToString(newCard.posTokens, 'native', targetSchema.dialect));
            if (isMobile) {
              state.mobileDrawerCardId = newCard.id;
              state.spreadTab = 'weave';
              renderMainStage();
            } else {
              state.openCardId = newCard.id;
              state.spreadTab = 'weave';
              renderSpreadModal();
            }
          });
        }
      }

      /* =========================================================================
       * 10. 织入预设积木选择器弹窗 & 积木新建/编辑弹窗
       * ========================================================================= */
      function openSnippetPickerModal(cardId, side, isMobile) {
        const card = state.cards.find((c) => c.id === cardId);
        if (!card) return;
        const overlay = document.getElementById('subModalOverlay');
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');

        const selected = new Set();
        const renderPicker = () => {
          overlay.innerHTML = `
            <div class="sl-dialog">
              <div class="sl-dialog-head">
                <div>
                  <h3 class="sl-serif" style="margin:0;font-size:18px;">织入提示词积木至${side === 'pos' ? '正面' : '负面'}</h3>
                  <small style="color:var(--sl-muted);">可多选导入为 [🧩 预设名] 动态块，支持整块拖拽与一键打散</small>
                </div>
                <button class="sl-close-btn" id="closeSubModal">${ICONS.close}</button>
              </div>
              <div class="sl-dialog-body sl-scroll">
                <div style="display:flex;flex-direction:column;gap:10px;">
                  ${state.snippets.map((snp) => `
                    <label style="display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--sl-trough);cursor:pointer;">
                      <input type="checkbox" value="${snp.id}" ${selected.has(snp.id) ? 'checked' : ''} style="margin-top:3px;accent-color:var(--sl-celadon);" />
                      <div style="flex:1;min-width:0;">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                          <strong style="color:var(--sl-celadon);">🧩 ${escapeHtml(snp.name)}</strong>
                          <span class="sl-chip-soft">${escapeHtml(snp.category)}</span>
                        </div>
                        <div class="sl-mono" style="font-size:11.5px;color:var(--sl-muted);word-break:break-word;">${escapeHtml(snp.content)}</div>
                      </div>
                    </label>
                  `).join('')}
                </div>
                <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:6px;">
                  <button class="sl-btn-soft" id="cancelSubModal">取消</button>
                  <button class="sl-btn-primary" id="confirmWeaveSnippets">织入所选积木 (${selected.size})</button>
                </div>
              </div>
            </div>
          `;

          overlay.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
            cb.addEventListener('change', () => {
              if (cb.checked) selected.add(cb.value);
              else selected.delete(cb.value);
              overlay.querySelector('#confirmWeaveSnippets').textContent = `织入所选积木 (${selected.size})`;
            });
          });
          overlay.querySelector('#closeSubModal').onclick = closeSubModal;
          overlay.querySelector('#cancelSubModal').onclick = closeSubModal;
          overlay.querySelector('#confirmWeaveSnippets').onclick = () => {
            if (selected.size) {
              const targetArr = side === 'pos' ? card.posTokens : card.negTokens;
              selected.forEach((snpId) => targetArr.push(makeSnippetRef(snpId, 1.0)));
              showToast(`已织入 ${selected.size} 枚积木胶囊块`);
            }
            closeSubModal();
            if (isMobile) renderMainStage();
            else renderSpreadModal();
          };
        };
        overlay.onclick = (e) => { if (e.target === overlay) closeSubModal(); };
        renderPicker();
      }

      function closeSubModal() {
        const overlay = document.getElementById('subModalOverlay');
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        overlay.innerHTML = '';
      }

      /* =========================================================================
       * 11. 积木库页面 (Snippets)
       * ========================================================================= */
      function renderSnippetsView(container, isMobile = false) {
        const cats = ['全部', '画质起手', '光影氛围', '人物主体', '媒介风格', '常用负面'];
        const q = state.snippetSearch.trim().toLowerCase();
        const filtered = state.snippets.filter((s) => {
          if (state.snippetCategoryFilter !== '全部' && s.category !== state.snippetCategoryFilter) return false;
          if (!q) return true;
          return s.name.toLowerCase().includes(q) || s.content.toLowerCase().includes(q) || s.category.toLowerCase().includes(q);
        });

        container.innerHTML = `
          <div class="${isMobile ? '' : 'sl-canvas-wrap'}">
            <div class="sl-page-head" style="${isMobile ? 'padding-top:2px;margin-bottom:14px;' : ''}">
              <div>
                <h1 class="sl-page-title" style="${isMobile ? 'font-size:21px;' : ''}">提示词积木库 · Snippets</h1>
                <p class="sl-page-desc">中性可复用提示词片段，可随时多选织入任意画师串的正/负面词，支持整块同步或一键打散。</p>
              </div>
              <button class="sl-btn-primary" id="newSnippetBtn">${ICONS.plus}<span>新建积木</span></button>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px;">
              <div class="sl-pill-group">
                ${cats.map((c) => `
                  <button class="sl-choice-pill ${state.snippetCategoryFilter === c ? 'is-active' : ''}" data-snp-cat="${c}">${c}</button>
                `).join('')}
              </div>
              <input class="sl-input-soft" id="snpSearchInput" style="width:${isMobile ? '100%' : '230px'};" placeholder="筛选积木名称或内容…" value="${escapeHtml(state.snippetSearch)}" />
            </div>

            <div class="sl-card-grid" id="snippetsGridWrap" style="${isMobile ? 'grid-template-columns:1fr;gap:14px;' : ''}">
              ${filtered.map((snp) => {
                const tokens = parseRawToTokens(snp.content);
                return `
                  <div class="sl-paper-card">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                      <div>
                        <div style="display:flex;align-items:center;gap:7px;">
                          <span style="color:var(--sl-celadon);display:flex;">${ICONS.puzzle}</span>
                          <h3 class="sl-serif" style="margin:0;font-size:17px;">${escapeHtml(snp.name)}</h3>
                        </div>
                        <div style="font-size:11.5px;color:var(--sl-muted);margin-top:4px;">${escapeHtml(snp.category)} · ${escapeHtml(snp.modelNote)}</div>
                      </div>
                      <button class="sl-mini-btn" data-edit-snp="${snp.id}">编辑</button>
                    </div>

                    <div class="sl-capsule-well" style="padding:10px;min-height:auto;">
                      <div class="sl-capsule-flow" style="gap:6px;">
                        ${tokens.map((t) => `
                          <span class="sl-capsule" style="cursor:default;padding:4px 9px;font-size:11.5px;">
                            ${escapeHtml(t.text)}${Math.abs(t.weight - 1) >= 0.01 ? `<sup class="sl-capsule-weight">${t.weight.toFixed(2)}</sup>` : ''}
                          </span>
                        `).join('')}
                      </div>
                    </div>

                    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;">
                      <button class="sl-mini-btn is-accent" data-copy-snp="${snp.id}:nai">${ICONS.copy}<span>NAI 语法</span></button>
                      <button class="sl-mini-btn" data-copy-snp="${snp.id}:sd">SD (tag:1.2)</button>
                      <button class="sl-mini-btn" data-copy-snp="${snp.id}:plain">纯词去权</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;

        const bindSnippetCardEvents = (scope) => {
          scope.querySelectorAll('[data-edit-snp]').forEach((btn) => {
            btn.addEventListener('click', () => openSnippetEditorModal(btn.dataset.editSnp));
          });
          scope.querySelectorAll('[data-copy-snp]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const [id, dialect] = btn.dataset.copySnp.split(':');
              const snp = findSnippet(id);
              if (!snp) return;
              const text = compileTokensToString(parseRawToTokens(snp.content), dialect, dialect);
              copyText(text, `已复制积木「${snp.name}」· ${formatSyntaxLabel(dialect)}`);
            });
          });
        };
