  function bindScrubbers(root, card) {
    root.querySelectorAll(".sl-scrubber").forEach(el => {
      const isLora = el.dataset.loraScrub != null;
      const key = el.dataset.scrubKey;
      const min = parseFloat(el.dataset.min);
      const max = parseFloat(el.dataset.max);
      const step = parseFloat(el.dataset.step);
      const smin = el.dataset.smin !== "" ? parseFloat(el.dataset.smin) : null;
      const smax = el.dataset.smax !== "" ? parseFloat(el.dataset.smax) : null;
      const decimals = (String(step).split(".")[1] || "").length;

      function applyVal(rawVal) {
        const snapped = Math.round((rawVal - min) / step) * step + min;
        const clamped = Math.max(min, Math.min(max, Number(snapped.toFixed(decimals))));
        if (isLora) {
          card.loras[Number(el.dataset.loraScrub)].weight = clamped;
        } else {
          card.params[key] = clamped;
        }
        const pct = Math.max(0, Math.min(100, ((clamped - min) / (max - min)) * 100));
        el.querySelector(".sl-scrubber-fill").style.width = pct + "%";
        const valEl = el.querySelector(".sl-scrubber-val");
        if (valEl) {
          const schemaParam = !isLora ? getSchema(card.schemaId).params.find(p => p.key === key) : null;
          const unit = schemaParam && schemaParam.unit ? " " + schemaParam.unit : "";
          valEl.textContent = clamped.toFixed(decimals) + unit;
        }
        if (smin != null && smax != null) {
          const inSafe = clamped >= smin - 1e-6 && clamped <= smax + 1e-6;
          el.classList.toggle("in-safe", inSafe);
          el.classList.toggle("out-of-safe", !inSafe);
          const noteEl = el.querySelector(".sl-scrubber-note");
          if (noteEl && !isLora) {
            const sp = getSchema(card.schemaId).params.find(p => p.key === key);
            if (sp && sp.safeNote) noteEl.textContent = inSafe ? sp.safeNote : ("越界 · " + sp.safeNote);
          }
        }
      }

      function updateFromPointer(clientX) {
        const r = el.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
        applyVal(min + ratio * (max - min));
      }

      let dragging = false;
      el.addEventListener("pointerdown", e => {
        if (e.target.tagName === "INPUT") return;
        dragging = true;
        el.setPointerCapture(e.pointerId);
        updateFromPointer(e.clientX);
      });
      el.addEventListener("pointermove", e => {
        if (!dragging) return;
        updateFromPointer(e.clientX);
      });
      el.addEventListener("pointerup", e => {
        if (dragging) {
          dragging = false;
          try { el.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      });
      el.addEventListener("dblclick", () => {
        const cur = isLora ? card.loras[Number(el.dataset.loraScrub)].weight : card.params[key];
        const valSpan = el.querySelector(".sl-scrubber-val");
        const inp = document.createElement("input");
        inp.className = "sl-scrubber-edit";
        inp.value = cur;
        valSpan.replaceWith(inp);
        inp.focus(); inp.select();
        const commit = () => {
          const num = parseFloat(inp.value);
          const span = document.createElement("span");
          span.className = "sl-scrubber-val";
          inp.replaceWith(span);
          applyVal(isNaN(num) ? cur : num);
        };
        inp.addEventListener("blur", commit);
        inp.addEventListener("keydown", ev => { if (ev.key === "Enter") commit(); });
      });
    });
  }

  // =========================================================================
  // 15. MODULE 3: SPELL INSPECTOR (暗房光学解析台 + REAL PNG/COMFY PARSER)
  // =========================================================================
  async function parseUploadedFile(file) {
    const lower = file.name.toLowerCase();
    if (lower.endsWith(".json")) {
      const txt = await file.text();
      try {
        const json = JSON.parse(txt);
        return buildParsedComfyResult(file.name, json, null);
      } catch (_) {
        showToast("JSON 解析失败");
        return null;
      }
    }
    const buf = new Uint8Array(await file.arrayBuffer());
    let bitmap = null;
    try { bitmap = await createImageBitmap(file); } catch (_) {}

    // Scan PNG Chunks if PNG signature matches
    let chunks = {};
    if (buf.length > 8 && buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4E && buf[3] === 0x47) {
      chunks = await readPngTextChunks(buf);
      if (!chunks.Description && !chunks.parameters && !chunks.prompt && !chunks.workflow && bitmap) {
        const stealth = await tryExtractStealthPngInfo(bitmap);
        if (stealth) chunks.__stealth = stealth;
      }
    }

    return buildResultFromChunks(file.name, chunks, bitmap);
  }

  async function readPngTextChunks(buf) {
    const out = {};
    const dec = new TextDecoder("utf-8", { fatal: false });
    let off = 8;
    const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    while (off + 12 <= buf.length) {
      const len = view.getUint32(off);
      const type = String.fromCharCode(buf[off + 4], buf[off + 5], buf[off + 6], buf[off + 7]);
      const data = buf.slice(off + 8, off + 8 + len);
      if (type === "tEXt") {
        const nul = data.indexOf(0);
        if (nul > 0) out[dec.decode(data.slice(0, nul))] = dec.decode(data.slice(nul + 1));
      } else if (type === "zTXt") {
        const nul = data.indexOf(0);
        if (nul > 0 && typeof DecompressionStream !== "undefined") {
          try {
            const ds = new Blob([data.slice(nul + 2)]).stream().pipeThrough(new DecompressionStream("deflate"));
            out[dec.decode(data.slice(0, nul))] = await new Response(ds).text();
          } catch (_) {}
        }
      } else if (type === "iTXt") {
        const nul = data.indexOf(0);
        if (nul > 0) {
          const key = dec.decode(data.slice(0, nul));
          const compFlag = data[nul + 1];
          let p = nul + 3;
          while (p < data.length && data[p] !== 0) p++;
          p++;
          while (p < data.length && data[p] !== 0) p++;
          p++;
          const payload = data.slice(p);
          if (compFlag === 1 && typeof DecompressionStream !== "undefined") {
            try {
              const ds = new Blob([payload]).stream().pipeThrough(new DecompressionStream("deflate"));
              out[key] = await new Response(ds).text();
            } catch (_) {}
          } else {
            out[key] = dec.decode(payload);
          }
        }
      }
      if (type === "IEND") break;
      off += 12 + len;
    }
    return out;
  }

  async function tryExtractStealthPngInfo(bitmap) {
    try {
      const c = document.createElement("canvas");
      c.width = bitmap.width; c.height = bitmap.height;
      const ctx = c.getContext("2d");
      ctx.drawImage(bitmap, 0, 0);
      const img = ctx.getImageData(0, 0, c.width, c.height).data;
      const readBits = (mode) => {
        const bytes = [];
        let cur = 0, cnt = 0;
        for (let x = 0; x < c.width; x++) {
          for (let y = 0; y < c.height; y++) {
            const idx = (y * c.width + x) * 4;
            if (mode === "alpha") {
              cur = (cur << 1) | (img[idx + 3] & 1); cnt++;
              if (cnt === 8) { bytes.push(cur); cur = 0; cnt = 0; }
            } else {
              for (let ch = 0; ch < 3; ch++) {
                cur = (cur << 1) | (img[idx + ch] & 1); cnt++;
                if (cnt === 8) { bytes.push(cur); cur = 0; cnt = 0; }
              }
            }
            if (bytes.length === 15) {
              const sig = String.fromCharCode(...bytes.slice(0, 15));
              if (!sig.startsWith("stealth_")) return null;
            }
            if (bytes.length > 262144) break;
          }
          if (bytes.length > 262144) break;
        }
        return new Uint8Array(bytes);
      };
      const raw = readBits("alpha") || readBits("rgb");
      if (!raw || raw.length < 24) return null;
      const sig = String.fromCharCode(...raw.slice(0, 15));
      const bitLen = new DataView(raw.buffer).getUint32(15, false);
      const byteLen = Math.min(raw.length - 19, Math.ceil(bitLen / 8));
      const payload = raw.slice(19, 19 + byteLen);
      if (sig.includes("comp") && typeof DecompressionStream !== "undefined") {
        const ds = new Blob([payload]).stream().pipeThrough(new DecompressionStream("gzip"));
        return await new Response(ds).text();
      }
      return new TextDecoder().decode(payload);
    } catch (_) {
      return null;
    }
  }

  function buildParsedComfyResult(fileName, json, bitmap) {
    const stages = [];
    const nodesMap = {};
    if (Array.isArray(json.nodes)) {
      json.nodes.forEach(n => { nodesMap[n.id] = n; });
      const samplers = json.nodes.filter(n => /KSampler|SamplerCustom/i.test(n.type || ""));
      samplers.forEach((sp, i) => {
        const vals = sp.widgets_values || [];
        stages.push({
          name: "Stage " + (i + 1) + " · " + (sp.type || "KSampler"),
          positive: "(从 ComfyUI Workflow 节点 #" + sp.id + " 提取)",
          negative: "",
          params: [
            { k: "Sampler Node", v: "#" + sp.id },
            { k: "Steps", v: String(vals[2] ?? 26) },
            { k: "CFG", v: String(vals[3] ?? 4.0) },
            { k: "Sampler", v: String(vals[4] ?? "euler") },
            { k: "Scheduler", v: String(vals[5] ?? "normal") }
          ],
          applyParams: { steps: Number(vals[2] ?? 26), cfg: Number(vals[3] ?? 4.0), sampler: "Euler", resolution: "832x1216" },
          applyLoras: []
        });
      });
    } else {
      Object.entries(json).forEach(([nid, node]) => {
        if (/KSampler/i.test(node.class_type || "")) {
          const inp = node.inputs || {};
          const posNode = Array.isArray(inp.positive) ? json[inp.positive[0]] : null;
          const negNode = Array.isArray(inp.negative) ? json[inp.negative[0]] : null;
          stages.push({
            name: "Stage · Node #" + nid,
            positive: posNode && posNode.inputs ? (posNode.inputs.text || "") : "",
            negative: negNode && negNode.inputs ? (negNode.inputs.text || "") : "",
            params: [
              { k: "Steps", v: String(inp.steps ?? 26) },
              { k: "CFG", v: String(inp.cfg ?? 4.0) },
              { k: "Sampler", v: String(inp.sampler_name ?? "euler") },
              { k: "Scheduler", v: String(inp.scheduler ?? "normal") }
            ],
            applyParams: { steps: Number(inp.steps ?? 26), cfg: Number(inp.cfg ?? 4.0), resolution: "832x1216" },
            applyLoras: []
          });
        }
      });
    }
    if (stages.length === 0) {
      stages.push({
        name: "ComfyUI JSON 摘要",
        positive: "未检测到标准 KSampler 节点，请在右侧查看原始 JSON。",
        negative: "",
        params: [{ k: "File", v: fileName }],
        applyParams: { steps: 26, cfg: 4.0, resolution: "832x1216" },
        applyLoras: []
      });
    }
    return {
      id: "custom-parse",
      label: fileName,
      format: "ComfyUI Graph JSON",
      schemaId: "illustrious",
      artTheme: "tyndall_cyber",
      variantIdx: 0,
      aspect: bitmap ? (bitmap.width >= bitmap.height ? "16:10" : "2:3") : "2:3",
      customBitmap: bitmap,
      suggestedTitle: "解析提取 · " + fileName.replace(/\.[^.]+$/, ""),
      stages,
      rawJson: JSON.stringify(json, null, 2).slice(0, 4000)
    };
  }

  function buildResultFromChunks(fileName, chunks, bitmap) {
    if (chunks.__stealth) {
      try {
        const sj = JSON.parse(chunks.__stealth);
        Object.assign(chunks, sj);
      } catch (_) { chunks.Description = chunks.__stealth; }
    }
    if (chunks.Comment || chunks.Description) {
      let c = {};
      try { c = JSON.parse(chunks.Comment || "{}"); } catch (_) {}
      return {
        id: "custom-parse",
        label: fileName,
        format: chunks.__stealth ? "stealth_pnginfo LSB" : "NovelAI PNG Chunk",
        schemaId: "nai-v45",
        artTheme: "tyndall_cyber",
        variantIdx: 0,
        aspect: bitmap && bitmap.width > bitmap.height ? "16:10" : "2:3",
        customBitmap: bitmap,
        suggestedTitle: "解析提取 · " + fileName.replace(/\.[^.]+$/, ""),
        stages: [{
          name: "NovelAI Metadata",
          positive: chunks.Description || c.prompt || "",
          negative: c.uc || "",
          params: [
            { k: "Steps", v: String(c.steps ?? 28) },
            { k: "Scale", v: String(c.scale ?? 5.5) },
            { k: "Sampler", v: String(c.sampler ?? "k_euler_ancestral") },
            { k: "Seed", v: String(c.seed ?? "-") }
          ],
          applyParams: { steps: Number(c.steps ?? 28), cfg: Number(c.scale ?? 5.5), resolution: "832x1216" },
          applyLoras: []
        }],
        rawJson: JSON.stringify(chunks, null, 2).slice(0, 4000)
      };
    }
    if (chunks.prompt || chunks.workflow) {
      try {
        const j = JSON.parse(chunks.prompt || chunks.workflow);
        return buildParsedComfyResult(fileName, j, bitmap);
      } catch (_) {}
    }
    if (chunks.parameters) {
      const parts = chunks.parameters.split("Negative prompt:");
      const pos = (parts[0] || "").trim();
      const rest = (parts[1] || "").split("\n");
      return {
        id: "custom-parse",
        label: fileName,
        format: "A1111 / Forge PNG parameters",
        schemaId: "webui-forge",
        artTheme: "tyndall_cyber",
        variantIdx: 0,
        aspect: bitmap && bitmap.width > bitmap.height ? "16:10" : "2:3",
        customBitmap: bitmap,
        suggestedTitle: "解析提取 · " + fileName.replace(/\.[^.]+$/, ""),
        stages: [{
          name: "A1111 Parameters",
          positive: pos,
          negative: (rest[0] || "").trim(),
          params: [{ k: "Raw Line", v: (rest[1] || "Detected").slice(0, 40) }],
          applyParams: { steps: 28, cfg: 6.5, resolution: "832x1216" },
          applyLoras: []
        }],
        rawJson: chunks.parameters
      };
    }
    return {
      id: "custom-parse",
      label: fileName,
      format: "未检测到内嵌 AI 元数据块（已读取图像封面）",
      schemaId: "nai-v5",
      artTheme: "geometric_girl",
      variantIdx: 0,
      aspect: bitmap && bitmap.width > bitmap.height ? "16:10" : "2:3",
      customBitmap: bitmap,
      suggestedTitle: "封面建卡 · " + fileName.replace(/\.[^.]+$/, ""),
      stages: [{
        name: "Pure Image Surface",
        positive: "",
        negative: "",
        params: [{ k: "Dimensions", v: bitmap ? (bitmap.width + "×" + bitmap.height) : "Unknown" }],
        applyParams: { steps: 28, cfg: 5.2, resolution: "832x1216" },
        applyLoras: []
      }],
      rawJson: JSON.stringify({ info: "No tEXt/iTXt/stealth_pnginfo detected in local file." }, null, 2)
    };
  }

    function downloadSlpack(subset, label) {
      const payload = {
        format: "styleloom-slpack-v1",
        exportedAt: new Date().toISOString(),
        cards: subset,
        snippets: state.snippets,
        schemas: state.schemas.filter(s => !s.builtin)
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "styleloom-" + label + ".slpack";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      appendSyncLog("sl-log-ok", "[slpack] 已打包导出 " + subset.length + " 张画师串至 styleloom-" + label + ".slpack");
      renderSyncModule(targetEl);
      showToast("已导出 " + subset.length + " 张画师串 (.slpack)");

  function openCompareModal(cardAId, cardBId) {
    const cardA = getCard(cardAId);

    openModal(
      '<div class="sl-modal-head">' +

             state.cards.map(c => '<option value="' + c.id + '"' + (c.id === cardB.id ? " selected" : "") + '>' + escapeHtml(c.title) + ' (' + escapeHtml(getSchema(c.schemaId).shortBadge) + ')</option>').join("") +

      '      <canvas id="ab-canvas-a" style="width:100%;border-radius:4px"></canvas>' +
      '      <div class="sl-code-box" style="font-size:11px">' + escapeHtml(compilePromptChips(cardA.positive, resolveEffectiveDialect(cardA, "keep"))) + '</div>' +

    document.getElementById("cl-confirm").onclick = () => {
      const targetSch = getSchema(document.getElementById("cl-schema").value);
      const clone = JSON.parse(JSON.stringify(srcCard));
      clone.id = "card-" + Date.now().toString(36);
      clone.title = srcCard.title + " · " + targetSch.shortBadge;
      clone.activeVariant = (srcCard.activeVariant + 1) % srcCard.variants.length;
      clone.customBitmap = srcCard.customBitmap || null;
      switchCardSchema(clone, targetSch.id);
      const idx = state.cards.findIndex(c => c.id === srcCard.id);
      state.cards.splice(idx + 1, 0, clone);
      state.selectedCardId = clone.id;
      state.activeModule = "gallery";
      closeModal();
      renderAll();
      showToast("已克隆对比卡：" + clone.title);
    };
  }

    stage.querySelectorAll("[data-mnav]").forEach(b => b.addEventListener("click", () => {
      state.activeModule = b.dataset.mnav;
      state.mobileDetailOpen = false;
      renderMobileView();
    }));

    stage.querySelector("#mob-dialect").addEventListener("change", e => { state.dockDialect = e.target.value; });
    stage.querySelector("#mob-copy-pos").addEventListener("click", () => copyText(compilePromptChips(card.positive, resolveEffectiveDialect(card, state.dockDialect)), "正面提示词"));
    stage.querySelector("#mob-copy-neg").addEventListener("click", () => copyText(compilePromptChips(card.negative, resolveEffectiveDialect(card, state.dockDialect)), "负面提示词"));
    stage.querySelector("#mob-open-insp").addEventListener("click", () => { state.activeModule = "gallery"; state.mobileDetailOpen = true; renderMobileView(); });

    if (state.activeModule === "gallery") {
      if (state.mobileDetailOpen) {
        stage.querySelectorAll("[data-mvcanvas]").forEach(cv => paintCanvasElement(cv, card, Number(cv.dataset.mvcanvas), 44));
        stage.querySelector("#mob-back").addEventListener("click", () => { state.mobileDetailOpen = false; renderMobileView(); });
        bindInspectorEvents(stage.querySelector("#mob-insp-body"), card, schema, state.promptChannel === "positive" ? card.positive : card.negative, d);
      } else {
        const mobSearch = stage.querySelector("#mob-search");
        mobSearch.addEventListener("input", e => {
          state.searchQuery = e.target.value;
          const pos = e.target.selectionStart;
          renderMobileView();
          const again = stage.querySelector("#mob-search");
          if (again) { again.focus(); again.setSelectionRange(pos, pos); }
        });
        stage.querySelectorAll("[data-mcol]").forEach(b => b.addEventListener("click", () => { state.mobileColCount = Number(b.dataset.mcol); renderMobileView(); }));
        layoutMasonry(filtered, stage.querySelector("#mob-masonry"), state.mobileColCount, true);
      }
    } else {
      const sub = stage.querySelector("#mob-submod");
      if (state.activeModule === "snippets") renderSnippetsModule(sub);
      else if (state.activeModule === "inspector") renderSpellInspectorModule(sub);
      else if (state.activeModule === "schemas") renderSchemasModule(sub);
      else if (state.activeModule === "sync") renderSyncModule(sub);
    }
  }

  // =========================================================================
  // 20. MASTER RENDER & GLOBAL EVENT HOOKS
  // =========================================================================
  function renderCenterModule() {
    const center = document.getElementById("sl-center");
    if (state.activeModule === "gallery") renderGalleryCenter();
    else if (state.activeModule === "snippets") renderSnippetsModule(center);
    else if (state.activeModule === "inspector") renderSpellInspectorModule(center);
    else if (state.activeModule === "schemas") renderSchemasModule(center);
    else if (state.activeModule === "sync") renderSyncModule(center);
  }

  function renderAll() {
    const app = document.getElementById("sl-app");
    app.classList.toggle("is-mobile", state.viewportMode === "mobile");
    if (state.viewportMode === "mobile") {
      renderMobileView();
    } else {
      renderRail();
      renderCenterModule();
      renderInspector();
      renderDock();
    }
  }

  document.addEventListener("click", e => {
    const pop = document.getElementById("sl-popover");
    if (pop.classList.contains("open") && !pop.contains(e.target) && e.target.id !== "insp-import-snp") {
      closePopover();
    }
  });
  document.getElementById("sl-modal-backdrop").addEventListener("click", e => {
    if (e.target.id === "sl-modal-backdrop") closeModal();
  });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      document.querySelectorAll(".sl-card-canvas").forEach(cv => {
        const cardEl = cv.closest(".sl-card");
        if (!cardEl) return;
        const c = getCard(cardEl.dataset.cardId);
        paintCanvasElement(cv, c, c.activeVariant, cardEl.clientWidth);
      });
    }, 90);
  });

  renderAll();
})();
</script>
</body>
</html>
