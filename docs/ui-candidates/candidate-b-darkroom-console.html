<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleLoom · 暗房光学工作台 (Darkroom Console HUD)</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0A0B0D;
  color: #ECEDEF;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.sl-darkroom {
  --bg-canvas: #0A0B0D;
  --bg-surface: #111317;
  --bg-elevated: #15181E;
  --bg-slot: #181B21;
  --bg-hover: #1F242C;
  --bg-active: #272D37;
  --text-primary: #ECEDEF;
  --text-secondary: #858B98;
  --text-muted: #585E6B;
  --hairline: rgba(255, 255, 255, 0.06);
  --hairline-mid: rgba(255, 255, 255, 0.11);
  --hairline-strong: rgba(255, 255, 255, 0.18);
  --amber: #E5A93C;
  --amber-dim: rgba(229, 169, 60, 0.14);
  --amber-glow: rgba(229, 169, 60, 0.36);
  --cyan: #38BDF8;
  --cyan-dim: rgba(56, 189, 248, 0.12);
  --green: #34D399;
  --green-band: rgba(52, 211, 153, 0.14);
  --warn: #F59E0B;
  --warn-band: rgba(245, 158, 11, 0.22);
  --danger: #F87171;
  --danger-dim: rgba(248, 113, 113, 0.14);
  --font-mono: "JetBrains Mono", "Cascadia Code", "SF Mono", "Fira Code", Consolas, monospace;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;

  min-height: 720px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-canvas);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.45;
  position: relative;
  user-select: none;
}

.sl-darkroom *, .sl-darkroom *::before, .sl-darkroom *::after {
  box-sizing: border-box;
}

.sl-darkroom input,
.sl-darkroom textarea,
.sl-darkroom select {
  font-family: inherit;
  color: var(--text-primary);
  user-select: text;
}

.sl-darkroom ::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
.sl-darkroom ::-webkit-scrollbar-track {
  background: transparent;
}
.sl-darkroom ::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.12);
  border-radius: 99px;
}
.sl-darkroom ::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.24);
}

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.tnum {
  font-variant-numeric: tabular-nums;
}

/* Workbench Desktop Layout */
.sl-workbench {
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: hidden;
}

/* 1. Left 54px Slim Icon Rail */
.sl-rail {
  width: 54px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-right: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0;
  z-index: 30;
}

.sl-brand {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  color: var(--amber);
  background: linear-gradient(145deg, rgba(229, 169, 60, 0.14), rgba(229, 169, 60, 0.02));
  border: 1px solid rgba(229, 169, 60, 0.24);
  position: relative;
  cursor: pointer;
}

.sl-rail-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  align-items: center;
}

.sl-rail-spacer {
  flex: 1;
}

.sl-rail-sep {
  width: 24px;
  height: 1px;
  background: var(--hairline);
  margin: 8px 0;
}

.sl-rail-btn {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: background 0.14s ease, color 0.14s ease;
  padding: 0;
}

.sl-rail-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.sl-rail-btn.active {
  background: var(--amber-dim);
  color: var(--amber);
}

.sl-rail-btn.active::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 7px;
  bottom: 7px;
  width: 2px;
  border-radius: 2px;
  background: var(--amber);
}

.sl-rail-btn.accent-plus {
  color: var(--amber);
  border: 1px solid rgba(229, 169, 60, 0.28);
  background: rgba(229, 169, 60, 0.08);
}

.sl-rail-btn.accent-plus:hover {
  background: rgba(229, 169, 60, 0.2);
}

.sl-rail-tip {
  position: fixed;
  left: 62px;
  padding: 5px 10px;
  background: #1B1F27;
  border: 1px solid var(--hairline-mid);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  display: none;
}

.sl-rail-tip .tip-sub {
  color: var(--text-secondary);
  font-size: 11px;
  margin-left: 6px;
}

/* 2. Center Area */
.sl-center {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-canvas);
  overflow: hidden;
  position: relative;
}

/* Command Bar (46px) */
.sl-cmdbar {
  height: 46px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--hairline);
}

.sl-search-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  height: 30px;
  padding: 0 9px;
  width: 220px;
  flex-shrink: 0;
  transition: border-color 0.14s ease;
}

.sl-search-wrap:focus-within {
  border-color: rgba(229, 169, 60, 0.55);
}

.sl-search-wrap input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  font-size: 12px;
  color: var(--text-primary);
}

.sl-search-wrap input::placeholder {
  color: var(--text-muted);
}

.sl-count-badge {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  color: var(--text-secondary);
  background: rgba(255, 255, 255, 0.04);
  padding: 1px 6px;
  border-radius: 3px;
}

.sl-cmd-scroll {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.sl-cmd-scroll::-webkit-scrollbar { display: none; }

.sl-cmd-divider {
  width: 1px;
  height: 18px;
  background: var(--hairline-mid);
  flex-shrink: 0;
  margin: 0 2px;
}

.sl-filter-pill {
  height: 26px;
  padding: 0 9px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.12s ease;
  font-family: inherit;
}

.sl-filter-pill:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.sl-filter-pill.active {
  background: var(--amber-dim);
  color: var(--amber);
  border-color: rgba(229, 169, 60, 0.28);
}

.sl-filter-pill.tag-active {
  background: var(--bg-active);
  color: var(--text-primary);
  border-color: var(--hairline-mid);
}

.sl-select-mini {
  height: 26px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12px;
  padding: 0 8px;
  outline: none;
  cursor: pointer;
}

.sl-col-stepper {
  display: flex;
  align-items: center;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  height: 28px;
  padding: 2px;
  flex-shrink: 0;
}

.sl-col-btn {
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.sl-col-btn:hover {
  color: var(--text-primary);
  background: var(--bg-hover);
}

.sl-col-btn.active {
  background: var(--amber);
  color: #0A0B0D;
  font-weight: 700;
}

/* Gallery Masonry */
.sl-gallery-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
}

.sl-masonry {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.sl-masonry-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sl-card {
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg-surface);
  cursor: pointer;
  border: 1px solid var(--hairline);
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
}

.sl-card:hover {
  border-color: var(--hairline-strong);
}

.sl-card.selected {
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 12px 28px rgba(0, 0, 0, 0.65);
}

.sl-card-canvas {
  display: block;
  width: 100%;
  height: auto;
}

.sl-card-badges {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.sl-lens-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.03em;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(10, 11, 13, 0.72);
  backdrop-filter: blur(8px);
  color: var(--text-primary);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.sl-card.selected .sl-lens-badge {
  border-color: rgba(229, 169, 60, 0.55);
  color: var(--amber);
}

.sl-fav-dot {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: rgba(10, 11, 13, 0.7);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--amber);
  opacity: 0;
  transition: opacity 0.15s ease;
  pointer-events: auto;
  border: none;
  cursor: pointer;
  padding: 0;
}

.sl-fav-dot.is-fav,
.sl-card:hover .sl-fav-dot {
  opacity: 1;
}

.sl-card-hover-hud {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 28px 9px 9px;
  background: linear-gradient(to top, rgba(10, 11, 13, 0.94) 0%, rgba(10, 11, 13, 0.65) 55%, transparent 100%);
  opacity: 0;
  transition: opacity 0.16s ease;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sl-card:hover .sl-card-hover-hud,
.sl-card.selected .sl-card-hover-hud {
  opacity: 1;
}

.sl-card-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.sl-card-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sl-card-ratio {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.sl-card-quick-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity 0.14s ease, transform 0.14s ease;
}

.sl-card:hover .sl-card-quick-actions {
  opacity: 1;
  transform: translateY(0);
}

.sl-qbtn {
  flex: 1;
  height: 24px;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(24, 27, 33, 0.88);
  color: var(--text-primary);
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0 6px;
  transition: all 0.12s ease;
  font-family: inherit;
}

.sl-qbtn:hover {
  background: var(--amber);
  color: #0A0B0D;
  border-color: var(--amber);
  font-weight: 600;
}

.sl-qbtn.icon-only {
  flex: 0 0 26px;
  padding: 0;
}

/* 3. Right 420px Persistent Optical Inspector */
.sl-inspector {
  width: 420px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-left: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sl-inspector.hidden {
  display: none;
}

.sl-insp-header {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.sl-insp-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.sl-insp-title-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 2px 6px;
  margin-left: -6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  outline: none;
}

.sl-insp-title-input:hover {
  background: var(--bg-slot);
}

.sl-insp-title-input:focus {
  background: var(--bg-slot);
  border-color: rgba(229, 169, 60, 0.5);
}

.sl-icon-btn {
  height: 26px;
  padding: 0 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline-mid);
  background: var(--bg-slot);
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.12s ease;
  font-family: inherit;
  flex-shrink: 0;
}

.sl-icon-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--hairline-strong);
}

.sl-icon-btn.amber {
  color: var(--amber);
  border-color: rgba(229, 169, 60, 0.3);
  background: var(--amber-dim);
}

.sl-icon-btn.amber:hover {
  background: var(--amber);
  color: #0A0B0D;
}

.sl-variant-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sl-variant-thumbs {
  display: flex;
  gap: 6px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
}

.sl-vthumb {
  width: 44px;
  height: 44px;
  border-radius: 5px;
  overflow: hidden;
  border: 1.5px solid var(--hairline);
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  background: var(--bg-canvas);
  padding: 0;
}

.sl-vthumb.active {
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber-glow);
}

.sl-vthumb canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.sl-vthumb-idx {
  position: absolute;
  bottom: 2px;
  right: 3px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: #fff;
  text-shadow: 0 1px 3px #000;
}

.sl-schema-switch-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sl-schema-label {
  font-size: 11px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.sl-schema-select {
  flex: 1;
  height: 28px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12px;
  padding: 0 8px;
  outline: none;
  cursor: pointer;
}

.sl-schema-select:focus {
  border-color: var(--amber);
}

.sl-insp-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.sl-sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.sl-sec-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.sl-seg-tabs {
  display: inline-flex;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
}

.sl-seg-tab {
  height: 22px;
  padding: 0 8px;
  border: none;
  border-radius: 3px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: inherit;
}

.sl-seg-tab.active {
  background: var(--bg-active);
  color: var(--text-primary);
  font-weight: 600;
}

.sl-seg-tab.amber.active {
  background: var(--amber-dim);
  color: var(--amber);
}

/* Track Chips Editor */
.sl-chip-input-row {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.sl-chip-input {
  flex: 1;
  height: 28px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
  padding: 0 9px;
  font-size: 12px;
  outline: none;
}

.sl-chip-input:focus {
  border-color: rgba(229, 169, 60, 0.5);
}

.sl-chips-bed {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  background: rgba(10, 11, 13, 0.55);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  min-height: 76px;
  align-content: flex-start;
}

.sl-chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 8px 2px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  font-size: 12px;
  color: var(--text-primary);
  cursor: grab;
  overflow: hidden;
  transition: border-color 0.12s ease, background 0.12s ease, opacity 0.12s ease;
}

.sl-chip:hover {
  background: var(--bg-hover);
  border-color: var(--hairline-mid);
}

.sl-chip.selected {
  border-color: var(--amber);
  background: var(--bg-active);
}

.sl-chip.is-snippet {
  background: var(--cyan-dim);
  border-color: rgba(56, 189, 248, 0.32);
  color: #BAE6FD;
}

.sl-chip.is-snippet.selected {
  border-color: var(--cyan);
  box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.35);
}

.sl-chip.is-muted {
  opacity: 0.42;
  text-decoration: line-through;
}

.sl-chip.drag-over {
  border-left: 2px solid var(--amber);
}

.sl-chip-w {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--amber);
}

.sl-chip-w.low {
  color: var(--cyan);
}

.sl-chip-bar {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  background: var(--amber);
  pointer-events: none;
  transition: width 0.12s ease;
}

.sl-chip.is-snippet .sl-chip-bar {
  background: var(--cyan);
}

.sl-chip.is-muted .sl-chip-bar {
  width: 0 !important;
}

/* Compact Inline Chip Micro-Bar / Snippet Bubble */
.sl-chip-microbar {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--hairline-mid);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sl-chip-microbar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}

.sl-micro-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.sl-mbtn {
  height: 22px;
  padding: 0 7px;
  border-radius: 3px;
  border: 1px solid var(--hairline-mid);
  background: var(--bg-slot);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.sl-mbtn:hover {
  background: var(--bg-hover);
  border-color: var(--hairline-strong);
}

.sl-mbtn.cyan {
  border-color: rgba(56, 189, 248, 0.35);
  color: var(--cyan);
  background: var(--cyan-dim);
}

.sl-mbtn.cyan:hover {
  background: var(--cyan);
  color: #0A0B0D;
}

.sl-mbtn.danger:hover {
  background: var(--danger-dim);
  color: var(--danger);
  border-color: rgba(248, 113, 113, 0.4);
}

.sl-snippet-preview-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding-top: 4px;
  border-top: 1px solid var(--hairline);
}

.sl-mini-tag {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(56, 189, 248, 0.08);
  color: #93C5FD;
  border: 1px solid rgba(56, 189, 248, 0.16);
}

.sl-source-textarea {
  width: 100%;
  min-height: 110px;
  background: rgba(10, 11, 13, 0.7);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 9px 10px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--text-primary);
  resize: vertical;
  outline: none;
}

.sl-source-textarea:focus {
  border-color: rgba(229, 169, 60, 0.5);
}

/* Borderless Blender/Figma Inline Scrubbers */
.sl-params-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sl-scrubber {
  position: relative;
  height: 32px;
  background: var(--bg-slot);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: ew-resize;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  border: 1px solid var(--hairline);
  touch-action: none;
  transition: border-color 0.12s ease;
}

.sl-scrubber:hover {
  border-color: var(--hairline-mid);
}

.sl-scrubber.out-of-safe {
  border-color: rgba(245, 158, 11, 0.4);
}

.sl-scrubber-safe {
  position: absolute;
  top: 0;
  bottom: 0;
  background: var(--green-band);
  border-left: 1px dashed rgba(52, 211, 153, 0.35);
  border-right: 1px dashed rgba(52, 211, 153, 0.35);
  pointer-events: none;
}

.sl-scrubber-fill {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  background: rgba(255, 255, 255, 0.075);
  border-right: 2px solid rgba(236, 237, 239, 0.5);
  pointer-events: none;
}

.sl-scrubber.in-safe .sl-scrubber-fill {
  background: rgba(52, 211, 153, 0.16);
  border-right-color: var(--green);
}

.sl-scrubber.out-of-safe .sl-scrubber-fill {
  background: var(--warn-band);
  border-right-color: var(--warn);
}

.sl-scrubber-left {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-primary);
  pointer-events: none;
}

.sl-scrubber-note {
  font-size: 10px;
  color: var(--text-secondary);
  background: rgba(10, 11, 13, 0.55);
  padding: 1px 5px;
  border-radius: 3px;
}

.sl-scrubber.out-of-safe .sl-scrubber-note {
  color: var(--warn);
}

.sl-scrubber-val {
  position: relative;
  z-index: 2;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  padding: 2px 4px;
  border-radius: 3px;
}

.sl-scrubber.in-safe .sl-scrubber-val {
  color: var(--green);
}

.sl-scrubber.out-of-safe .sl-scrubber-val {
  color: var(--warn);
}

.sl-scrubber-edit {
  position: relative;
  z-index: 3;
  width: 60px;
  height: 22px;
  background: #0A0B0D;
  border: 1px solid var(--amber);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 12px;
  text-align: right;
  padding: 0 5px;
  outline: none;
}

/* Toggle Chips & Select Pills & Resolution Bar */
.sl-toggles-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.sl-toggle-chip {
  height: 28px;
  padding: 0 10px;
  border-radius: var(--radius-md);
  border: 1px solid var(--hairline);
  background: var(--bg-slot);
  color: var(--text-secondary);
  font-size: 11.5px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.12s ease;
  font-family: inherit;
}

.sl-toggle-chip .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
}

.sl-toggle-chip.on {
  background: var(--amber-dim);
  border-color: rgba(229, 169, 60, 0.35);
  color: var(--text-primary);
}

.sl-toggle-chip.on .dot {
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
}

.sl-param-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 32px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 0 10px;
}

.sl-param-row label {
  font-size: 12px;
  color: var(--text-secondary);
}

.sl-param-row select {
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-primary);
  text-align: right;
  cursor: pointer;
}

.sl-param-row select option {
  background: #181B21;
  color: var(--text-primary);
}

.sl-res-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.sl-res-btn {
  height: 26px;
  padding: 0 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--hairline);
  background: var(--bg-slot);
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
}

.sl-res-btn.active {
  background: var(--amber-dim);
  border-color: rgba(229, 169, 60, 0.45);
  color: var(--amber);
}

/* LoRA Slots */
.sl-lora-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sl-lora-item {
  background: rgba(10, 11, 13, 0.45);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sl-lora-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.sl-lora-name {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sl-trigger-pill {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--cyan-dim);
  color: var(--cyan);
  border: 1px solid rgba(56, 189, 248, 0.25);
  cursor: pointer;
}

/* 4. Bottom Live Spell Output Dock (48px) */
.sl-dock {
  height: 48px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-top: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  z-index: 35;
}

.sl-dock-card {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
  max-width: 195px;
}

.sl-dock-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber-glow);
  flex-shrink: 0;
}

.sl-dock-title {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sl-dock-preview {
  flex: 1;
  min-width: 0;
  height: 30px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 10px;
}

.sl-dock-text {
  flex: 1;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sl-dock-stats {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.sl-dock-dialect {
  height: 30px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline-mid);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 12px;
  padding: 0 8px;
  outline: none;
  cursor: pointer;
  flex-shrink: 0;
}

.sl-dock-dialect option {
  background: #181B21;
}

.sl-dock-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.sl-btn {
  height: 30px;
  padding: 0 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--hairline-mid);
  background: var(--bg-slot);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.13s ease;
  font-family: inherit;
  white-space: nowrap;
}

.sl-btn:hover {
  background: var(--bg-hover);
  border-color: var(--hairline-strong);
}

.sl-btn.primary {
  background: var(--amber);
  border-color: var(--amber);
  color: #0A0B0D;
  font-weight: 700;
}

.sl-btn.primary:hover {
  background: #F0B64B;
}

.sl-btn.cyan {
  background: var(--cyan-dim);
  border-color: rgba(56, 189, 248, 0.35);
  color: var(--cyan);
}

.sl-btn.cyan:hover {
  background: var(--cyan);
  color: #0A0B0D;
}

/* Other Modules Layout (Snippets / Spell Inspector / Schemas / WebDAV) */
.sl-module-head {
  height: 46px;
  flex-shrink: 0;
  padding: 0 16px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.sl-module-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  font-weight: 600;
}

.sl-module-sub {
  font-size: 11.5px;
  color: var(--text-secondary);
  font-weight: 400;
}

.sl-split-body {
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: hidden;
}

.sl-pane-left {
  width: 310px;
  flex-shrink: 0;
  border-right: 1px solid var(--hairline);
  background: rgba(17, 19, 23, 0.55);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sl-pane-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 16px 18px;
  gap: 16px;
}

.sl-list-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sl-list-item {
  padding: 9px 10px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: background 0.12s ease;
}

.sl-list-item:hover {
  background: var(--bg-hover);
}

.sl-list-item.active {
  background: var(--bg-slot);
  border-color: var(--amber);
}

.sl-list-item-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.sl-list-item-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
}

.sl-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-secondary);
}

.sl-badge.cyan {
  background: var(--cyan-dim);
  color: var(--cyan);
}

.sl-badge.amber {
  background: var(--amber-dim);
  color: var(--amber);
}

.sl-badge.green {
  background: rgba(52, 211, 153, 0.14);
  color: var(--green);
}

.sl-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.sl-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.sl-field label {
  font-size: 11px;
  color: var(--text-secondary);
}

.sl-input {
  height: 32px;
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 0 10px;
  font-size: 12.5px;
  outline: none;
  color: var(--text-primary);
}

.sl-input:focus {
  border-color: rgba(229, 169, 60, 0.55);
}

/* Spell Inspector Dropzone & Matrix */
.sl-dropzone {
  border: 1px dashed var(--hairline-strong);
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.14s ease;
}

.sl-dropzone:hover,
.sl-dropzone.dragover {
  border-color: var(--amber);
  background: var(--amber-dim);
}

.sl-matrix-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 6px;
}

.sl-matrix-cell {
  background: var(--bg-slot);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 7px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: all 0.12s ease;
  text-align: left;
}

.sl-matrix-cell:hover {
  border-color: var(--amber);
  background: var(--bg-hover);
}

.sl-matrix-k {
  font-size: 10.5px;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
}

.sl-matrix-v {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sl-code-box {
  background: rgba(10, 11, 13, 0.72);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-primary);
  word-break: break-word;
  position: relative;
}

/* Terminal Diagnostic Log */
.sl-terminal {
  background: #07080A;
  border: 1px solid var(--hairline-mid);
  border-radius: var(--radius-md);
  padding: 12px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  line-height: 1.65;
  height: 250px;
  overflow-y: auto;
  color: #B4BCC9;
}

.sl-log-line {
  display: flex;
  gap: 8px;
}

.sl-log-ts { color: var(--text-muted); flex-shrink: 0; }
.sl-log-ok { color: var(--green); }
.sl-log-warn { color: var(--warn); }
.sl-log-info { color: var(--cyan); }
.sl-log-amber { color: var(--amber); }

/* Mobile 393x852 Simulation Shell */
.sl-mobile-stage {
  flex: 1;
  min-height: 0;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 16px;
  background: radial-gradient(circle at 50% 45%, #161922 0%, #0A0B0D 72%);
  overflow: auto;
}

.sl-darkroom.is-mobile .sl-workbench,
.sl-darkroom.is-mobile .sl-dock {
  display: none;
}

.sl-darkroom.is-mobile .sl-mobile-stage {
  display: flex;
}

.sl-phone-frame {
  width: 393px;
  height: 852px;
  max-height: calc(100vh - 32px);
  border-radius: 42px;
  background: #0A0B0D;
  border: 7px solid #1E222B;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 28px 80px rgba(0, 0, 0, 0.85);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}

.sl-phone-statusbar {
  height: 36px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-primary);
  background: var(--bg-surface);
  flex-shrink: 0;
  position: relative;
}

.sl-phone-notch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #000;
  border: 1px solid #22262E;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.sl-phone-content {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.sl-phone-thumb-dock {
  background: #14171D;
  border-top: 1px solid rgba(229, 169, 60, 0.35);
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}

.sl-phone-nav {
  height: 56px;
  background: var(--bg-surface);
  border-top: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-shrink: 0;
  padding-bottom: 6px;
}

.sl-pnav-btn {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  cursor: pointer;
  padding: 4px 10px;
  font-family: inherit;
}

.sl-pnav-btn.active {
  color: var(--amber);
}

.sl-mobile-aside {
  width: 260px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--hairline-mid);
  border-radius: var(--radius-lg);
  padding: 16px;
}

.sl-phone-frame .sl-module-head {
  height: auto;
  min-height: 44px;
  padding: 8px 12px;
  flex-wrap: wrap;
  gap: 8px;
}

.sl-phone-frame .sl-split-body {
  flex-direction: column;
  overflow-y: auto;
}

.sl-phone-frame .sl-pane-left {
  width: 100% !important;
  max-height: 240px;
  border-right: none;
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0;
}

.sl-phone-frame .sl-pane-right {
  overflow: visible;
  padding: 12px;
}

.sl-phone-frame .sl-form-grid {
  grid-template-columns: 1fr;
}

.sl-phone-frame .sl-matrix-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

/* Modal & Lightbox */
.sl-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 6, 8, 0.84);
  backdrop-filter: blur(8px);
  z-index: 120;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.sl-modal-backdrop.open {
  display: flex;
}

.sl-modal {
  background: var(--bg-surface);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-lg);
  max-width: 960px;
  width: 100%;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 72px rgba(0, 0, 0, 0.8);
}

.sl-modal-head {
  height: 46px;
  padding: 0 16px;
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.sl-modal-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px;
}

.sl-ab-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.sl-ab-pane {
  background: var(--bg-canvas);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Popover */
.sl-popover {
  position: fixed;
  z-index: 150;
  background: #171A21;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-md);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.72);
  padding: 6px;
  min-width: 220px;
  max-width: 320px;
  display: none;
}

.sl-popover.open {
  display: block;
}

.sl-pop-item {
  width: 100%;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font-size: 12px;
  padding: 7px 9px;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  text-align: left;
  font-family: inherit;
}

.sl-pop-item:hover {

/* Toast */
.sl-toast {
  position: fixed;
  bottom: 62px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: #1B1F27;
  border: 1px solid rgba(229, 169, 60, 0.45);
  color: var(--text-primary);
  padding: 7px 14px;
  border-radius: var(--radius-md);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease;
}

.sl-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

  // =========================================================================
  // 7. PROMPT AST, COMPILATION & DIALECT CONVERSION ENGINE
  // =========================================================================
  function getSchema(schemaId) {
    return state.schemas.find(s => s.id === schemaId) || state.schemas[0];
  }
  function getCard(cardId) {
    return state.cards.find(c => c.id === cardId) || state.cards[0];
  }
  function getSnippet(snippetId) {
    return state.snippets.find(s => s.id === snippetId);
  }

  function parseTagToken(raw) {
    let s = raw.trim();
    if (!s) return null;
    let muted = false;
    if (s.startsWith("[-") && s.endsWith("]")) {
      muted = true;
      s = s.slice(2, -1).trim();
    }
    const snpMatch = s.match(/^\[\[🧩\s*(.+?)\]\]$/);
    if (snpMatch) {
      const name = snpMatch[1].trim();
      const found = state.snippets.find(sp => sp.name === name);
      if (found) return mkSnp(found.id, muted);
    }
    // NAI numeric 1.2::tag::
    const naiMatch = s.match(/^([0-9]+(?:\.[0-9]+)?)::(.+?)::$/);
    if (naiMatch) {
      return mkTag(naiMatch[2].trim(), parseFloat(naiMatch[1]), muted);
    }
    // SD (tag:1.2)
    const sdMatch = s.match(/^\((.+):([0-9]+(?:\.[0-9]+)?)\)$/);
    if (sdMatch) {
      return mkTag(sdMatch[1].trim(), parseFloat(sdMatch[2]), muted);
    }
    // Curly {tag} or square [tag]
    if (/^\{.+\}$/.test(s)) {
      let depth = 0;
      while (s.startsWith("{") && s.endsWith("}")) { depth++; s = s.slice(1, -1); }
      return mkTag(s.trim(), +(Math.pow(1.05, depth)).toFixed(2), muted);
    }
    if (/^\[.+\]$/.test(s)) {
      let depth = 0;
      while (s.startsWith("[") && s.endsWith("]")) { depth++; s = s.slice(1, -1); }
      return mkTag(s.trim(), +(Math.pow(0.95, depth)).toFixed(2), muted);
    }
    return mkTag(s, 1.0, muted);
  }

  function parsePromptString(text) {
    return text.split(/[\n,]+/).map(parseTagToken).filter(Boolean);
  }

  function formatWeightVal(w) {
    return Number(w.toFixed(2)).toString();
  }

  function formatTagForDialect(text, weight, dialect) {
    let t = text.trim();
    if (!t) return "";
    const w = weight == null ? 1.0 : weight;
    const isOne = Math.abs(w - 1.0) < 0.005;

    if (dialect === "plain") {
      return t.replace(/^artist:/i, "").replace(/^@/, "");
    }
    if (dialect === "anima") {
      if (/^artist:/i.test(t)) {
        t = "@" + t.replace(/^artist:/i, "").trim().replace(/\s+/g, "_");
      }
      return isOne ? t : "(" + t + ":" + formatWeightVal(w) + ")";
    }
    if (dialect === "moss") {
      t = t.replace(/_/g, " ");
      return isOne ? t : "(" + t + ":" + formatWeightVal(w) + ")";
    }
    if (dialect === "nai") {
      return isOne ? t : formatWeightVal(w) + "::" + t + "::";
    }
    // default "sd"
    return isOne ? t : "(" + t + ":" + formatWeightVal(w) + ")";
  }

  function resolveEffectiveDialect(card, dialectChoice) {
    if (dialectChoice && dialectChoice !== "keep") return dialectChoice;
    return getSchema(card.schemaId).dialect || "sd";
  }

  function compilePromptChips(chips, dialect) {
    const out = [];
    for (const ch of chips) {
      if (ch.muted) continue;
      if (ch.type === "snippet") {
        const snp = getSnippet(ch.snippetId);
        if (!snp) continue;
        const inner = parsePromptString(snp.content);
        for (const sub of inner) {
          if (!sub.muted) {
            out.push(formatTagForDialect(sub.text, sub.weight, dialect));
          }
        }
      } else {
        out.push(formatTagForDialect(ch.text, ch.weight, dialect));
      }
    }
    return out.filter(Boolean).join(", ");
  }

  function chipsToSourceText(chips, cardDialect) {
    return chips.map(ch => {
      let body = "";
      if (ch.type === "snippet") {
        const snp = getSnippet(ch.snippetId);
        body = snp ? "[[🧩 " + snp.name + "]]" : "[[🧩 已删除积木]]";
      } else {
        body = formatTagForDialect(ch.text, ch.weight, cardDialect);
      }
      return ch.muted ? "[-" + body + "]" : body;
    }).join(", ");
  }

  function estimateTokens(compiledText) {
    if (!compiledText.trim()) return { words: 0, tokens: 0 };
    const words = compiledText.split(",").map(s => s.trim()).filter(Boolean).length;
    const chunks = compiledText.split(/[\s,_:()@]+/).filter(Boolean).length;
    return { words, tokens: Math.max(words, Math.round(chunks * 1.15)) };
  }

      ctx.fillStyle = light ? "rgba(255,255,255," + (strength * 0.65) + ")" : "rgba(0,0,0," + strength + ")";
      ctx.fillRect(gx, gy, 1.2, 1.2);

    const vig = ctx.createRadialGradient(w * 0.5, h * 0.45, Math.min(w, h) * 0.25, w * 0.5, h * 0.5, Math.max(w, h) * 0.78);
    vig.addColorStop(0, "rgba(0,0,0,0)");

    ctx.fillRect(0, 0, w, h);

        { n1: "#FB923C", n2: "#A3E635", sky: "#0D0B09" }
      ];
      const p = pals[variantIdx % pals.length];
      ctx.fillStyle = p.sky; ctx.fillRect(0, 0, w, h);

      const hor = h * 0.58;
      // Alley buildings
      ctx.fillStyle = "#0D1119";
      ctx.fillRect(0, 0, w * 0.34, hor);
      ctx.fillRect(w * 0.66, 0, w * 0.34, hor);

      // Vertical Neon Signs
      const signs = [
        { x: w * 0.16, y: h * 0.12, w: 18, h: 72, c: p.n1 },
        { x: w * 0.24, y: h * 0.24, w: 14, h: 52, c: p.n2 },
        { x: w * 0.72, y: h * 0.14, w: 20, h: 78, c: p.n2 },
        { x: w * 0.82, y: h * 0.28, w: 14, h: 48, c: p.n1 }
      ];
      signs.forEach(sg => {
        drawSoftOrb(ctx, sg.x + sg.w / 2, sg.y + sg.h / 2, sg.h * 0.9, sg.c + "44", "rgba(0,0,0,0)");
        ctx.fillStyle = sg.c;
        ctx.fillRect(sg.x, sg.y, sg.w, sg.h);
        ctx.fillStyle = "#080A0F";
        for (let k = sg.y + 8; k < sg.y + sg.h - 8; k += 10) {
          ctx.fillRect(sg.x + 4, k, sg.w - 8, 4);
        }
      });

      // Wet Asphalt Reflections
      const road = ctx.createLinearGradient(0, hor, 0, h);
      road.addColorStop(0, "#0A0D13"); road.addColorStop(1, "#050608");
      ctx.fillStyle = road; ctx.fillRect(0, hor, w, h - hor);

      ctx.globalCompositeOperation = "screen";
      for (let i = 0; i < 36; i++) {
        const sy = hor + rng() * (h - hor);
        const col = i % 2 === 0 ? p.n1 : p.n2;
        ctx.fillStyle = col + "33";
        ctx.fillRect(w * 0.12 + rng() * w * 0.72, sy, 18 + rng() * 55, 2.2);
      }
      ctx.globalCompositeOperation = "source-over";

      // Umbrella Figure
      const ux = w * 0.5, uy = hor - 6;
      ctx.fillStyle = "#07090D";
      ctx.fillRect(ux - 5, uy - 12, 10, 38);
      ctx.fillStyle = "rgba(220, 240, 255, 0.28)";
      ctx.beginPath(); ctx.arc(ux, uy - 14, 24, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = p.n2; ctx.lineWidth = 1.4; ctx.stroke();

      // Rain streaks
      ctx.strokeStyle = "rgba(220,235,255,0.22)"; ctx.lineWidth = 0.9;
      for (let r = 0; r < 65; r++) {
        const rx = rng() * w, ry = rng() * h;
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 2, ry + 18); ctx.stroke();
      }
      drawGrainAndVignette(ctx, w, h, rng, 0.05);
    }

    else if (theme === "emerald_forest") {
      const pals = [
        { top: "#06211B", bot: "#04120E", ray: "rgba(110, 231, 183,", glow: "#34D399" },
        { top: "#0B2421", bot: "#051112", ray: "rgba(167, 243, 208,", glow: "#A7F3D0" }
      ];
      const p = pals[variantIdx % pals.length];
      const bg = ctx.createLinearGradient(0, 0, 0, h);
      bg.addColorStop(0, p.top); bg.addColorStop(1, p.bot);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

      // Cedar Trunks
      for (let t = 0; t < 9; t++) {
        const tx = (w / 8) * t + (rng() - 0.5) * 18;
        const tw = 8 + rng() * 18;
        ctx.fillStyle = t % 2 === 0 ? "rgba(4, 16, 12, 0.86)" : "rgba(10, 34, 26, 0.55)";
        ctx.fillRect(tx, 0, tw, h);
      }

      // Komorebi Sunbeams
      ctx.globalCompositeOperation = "screen";
      for (let b = 0; b < 6; b++) {
        const bx = w * (0.05 + b * 0.16);
        const beam = ctx.createLinearGradient(bx, 0, bx + w * 0.35, h);
        beam.addColorStop(0, p.ray + "0.38)");
        beam.addColorStop(1, p.ray + "0)");
        ctx.fillStyle = beam;
        ctx.beginPath();
        ctx.moveTo(bx, 0); ctx.lineTo(bx + 28, 0);
        ctx.lineTo(bx + w * 0.42, h); ctx.lineTo(bx + w * 0.22, h);
        ctx.closePath(); ctx.fill();
      }
      // Bokeh & Fireflies
      for (let k = 0; k < 22; k++) {
        drawSoftOrb(ctx, rng() * w, rng() * h, 4 + rng() * 14, p.ray + "0.42)", p.ray + "0)");
      }
      ctx.globalCompositeOperation = "source-over";

      // Foreground Fern Silhouettes
      ctx.fillStyle = "#030D0A";
      for (let f = 0; f < 16; f++) {
        const fx = (w / 14) * f;
        ctx.beginPath();
        ctx.moveTo(fx, h);
        ctx.quadraticCurveTo(fx + (rng() - 0.5) * 40, h - 75, fx + (rng() - 0.5) * 20, h - 95);
        ctx.quadraticCurveTo(fx + 16, h - 40, fx + 12, h);
        ctx.fill();
      }
      drawGrainAndVignette(ctx, w, h, rng, 0.055);
    }

    else if (theme === "ukiyoe_crimson_moon") {
      const pals = [
        { paper: "#1C1815", moon: "#DC2626", ink: "#0B0A09", leaf: "#F87171" },
        { paper: "#221C14", moon: "#E5A93C", ink: "#0C0A08", leaf: "#FBBF24" },
        { paper: "#111827", moon: "#EF4444", ink: "#060911", leaf: "#93C5FD" }
      ];
      const p = pals[variantIdx % pals.length];
      ctx.fillStyle = p.paper; ctx.fillRect(0, 0, w, h);

      // Giant Crimson Moon
      const mx = w * 0.55, my = h * 0.42, mr = Math.min(w, h) * 0.29;
      drawSoftOrb(ctx, mx, my, mr * 1.5, p.moon + "40", "rgba(0,0,0,0)");
      ctx.fillStyle = p.moon;
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

      // Sumi-e Pine Branch Silhouette
      ctx.strokeStyle = p.ink; ctx.lineWidth = 8; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-10, h * 0.28);
      ctx.bezierCurveTo(w * 0.28, h * 0.18, w * 0.45, h * 0.42, w * 0.72, h * 0.34);
      ctx.stroke();
      ctx.lineWidth = 4;
      for (let n = 0; n < 7; n++) {
        const nx = w * (0.14 + n * 0.09), ny = h * (0.24 + Math.sin(n) * 0.08);
        ctx.fillStyle = p.ink;
        ctx.beginPath(); ctx.ellipse(nx, ny, 22, 10, -0.2, 0, Math.PI * 2); ctx.fill();
      }

      // Stylized Ukiyo-e Waves / Mountain Cliff
      ctx.fillStyle = p.ink;
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, h * 0.78);
      ctx.quadraticCurveTo(w * 0.32, h * 0.65, w * 0.58, h * 0.84);
      ctx.quadraticCurveTo(w * 0.82, h * 0.72, w, h * 0.8);
      ctx.lineTo(w, h); ctx.closePath(); ctx.fill();

      // Floating Maple Petals
      ctx.fillStyle = p.leaf;
      for (let m = 0; m < 18; m++) {
        ctx.save();
        ctx.translate(rng() * w, rng() * h);
        ctx.rotate(rng() * Math.PI);
        ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(3, 2); ctx.lineTo(-3, 2); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      drawGrainAndVignette(ctx, w, h, rng, 0.08);
    }

    else {
      // geometric_girl
      const pals = [
        { bg: "#10141E", c1: "#E5A93C", c2: "#38BDF8", sil: "#07090D" },
        { bg: "#121316", c1: "#ECEDEF", c2: "#858B98", sil: "#08090B" },
        { bg: "#1A1118", c1: "#FB7185", c2: "#FBBF24", sil: "#0A070B" }
      ];
      const p = pals[variantIdx % pals.length];
      ctx.fillStyle = p.bg; ctx.fillRect(0, 0, w, h);

      // Swiss/Bauhaus Geometric Arcs & Circles
      ctx.fillStyle = p.c1;
      ctx.beginPath(); ctx.arc(w * 0.62, h * 0.38, w * 0.28, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = p.c2; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(w * 0.44, h * 0.52, w * 0.36, 0.3, Math.PI * 1.45); ctx.stroke();

      // Prism Refraction Shards
      ctx.globalCompositeOperation = "screen";
      ctx.fillStyle = p.c2 + "33";
      ctx.beginPath(); ctx.moveTo(w * 0.1, h * 0.2); ctx.lineTo(w * 0.9, h * 0.6); ctx.lineTo(w * 0.3, h * 0.95); ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      // Clean Profile Silhouette
      drawAnimeGirlBust(ctx, w * 0.48, h * 0.88, Math.min(w, h) / 220, p.sil, p.c1, null);

      // Leica Viewfinder Reticle Marks
      ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(w * 0.5 - 8, h * 0.5); ctx.lineTo(w * 0.5 + 8, h * 0.5);
      ctx.moveTo(w * 0.5, h * 0.5 - 8); ctx.lineTo(w * 0.5, h * 0.5 + 8); ctx.stroke();
      ctx.strokeRect(14, 14, w - 28, h - 28);
      drawGrainAndVignette(ctx, w, h, rng, 0.045);
    }

    ctx.restore();
  }

  function paintCanvasElement(canvas, card, variantIdx, targetW) {
    if (!canvas || !card) return;
    const ratio = RATIO_MAP[card.aspect] || 0.75;
    const w = Math.max(40, Math.round(targetW || canvas.clientWidth || 240));
    const h = Math.max(40, Math.round(w / ratio));
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vIdx = variantIdx != null ? variantIdx : (card.activeVariant || 0);
    const key = card.id + ":" + vIdx + ":" + w + "x" + h + ":" + dpr + ":" + (card.customImageKey || "");
    if (canvas.dataset.renderKey === key) return;
    canvas.dataset.renderKey = key;

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.aspectRatio = card.aspect.replace(":", " / ");
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (card.customBitmap) {
      ctx.drawImage(card.customBitmap, 0, 0, w, h);
    } else {
      const variant = (card.variants && card.variants[vIdx]) || { seed: 999 };
      renderArtTheme(ctx, w, h, card.artTheme, vIdx, variant.seed);
    }
  }

  // 9. TOAST, CLIPBOARD & POPOVER HELPERS

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("sl-toast");
    el.innerHTML = '<span style="color:var(--amber)">' + ICONS.check + '</span><span>' + escapeHtml(msg) + '</span>';
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  function copyText(text, label) {
    if (!text) { showToast("当前内容为空"); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    showToast("已复制 " + label);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function closePopover() {
    const pop = document.getElementById("sl-popover");
    pop.classList.remove("open");
    pop.innerHTML = "";
  }

  function openPopover(anchorEl, htmlContent) {
    const pop = document.getElementById("sl-popover");
    pop.innerHTML = htmlContent;
    pop.classList.add("open");
    const rect = anchorEl.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    let left = Math.min(rect.left, window.innerWidth - popRect.width - 12);
    let top = rect.bottom + 6;
    if (top + popRect.height > window.innerHeight - 12) {
      top = Math.max(12, rect.top - popRect.height - 6);
    }
    pop.style.left = Math.max(10, left) + "px";
    pop.style.top = top + "px";
  }

  function getFilteredCards() {
    const q = state.searchQuery.trim().toLowerCase();
    return state.cards.filter(card => {
      const schema = getSchema(card.schemaId);
      if (state.filterFavOnly && !card.favorite) return false;
      if (state.filterPlatform !== "ALL" && schema.platform !== state.filterPlatform && card.schemaId !== state.filterPlatform) return false;
      if (state.filterTag !== "ALL" && !card.tags.includes(state.filterTag)) return false;
      if (q) {
        const pos = compilePromptChips(card.positive, "plain").toLowerCase();
        const hay = (card.title + " " + schema.name + " " + schema.shortBadge + " " + card.tags.join(" ") + " " + pos).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function getAllUniqueTags() {
    const set = new Set();
    state.cards.forEach(c => c.tags.forEach(t => set.add(t)));
    return Array.from(set);
  }

      if (again) { again.focus(); again.setSelectionRange(pos, pos); }

    const clearBtn = center.querySelector("#sl-search-clear");
    if (clearBtn) clearBtn.addEventListener("click", () => { state.searchQuery = ""; renderGalleryCenter(); });

      state.searchQuery = ""; state.filterPlatform = "ALL"; state.filterTag = "ALL"; state.filterFavOnly = false;

    if (filtered.length > 0) {
      layoutMasonry(filtered, center.querySelector("#sl-masonry"), state.galleryCols, false);
    }

  function layoutMasonry(cards, container, colsCount, isMobile) {
    container.innerHTML = "";
    const cols = [];
    const heights = new Array(colsCount).fill(0);
    for (let i = 0; i < colsCount; i++) {
      const col = document.createElement("div");
      col.className = "sl-masonry-col";
      container.appendChild(col);
      cols.push(col);
    }

    cards.forEach(card => {
      let minIdx = 0;
      for (let i = 1; i < colsCount; i++) {
        if (heights[i] < heights[minIdx]) minIdx = i;
      }
      const ratio = RATIO_MAP[card.aspect] || 0.75;
      heights[minIdx] += (1 / ratio) + 0.08;

      const schema = getSchema(card.schemaId);
      const isSelected = card.id === state.selectedCardId;
      const el = document.createElement("div");
      el.className = "sl-card" + (isSelected ? " selected" : "");
      el.dataset.cardId = card.id;
      el.innerHTML =
        '<canvas class="sl-card-canvas"></canvas>' +
        '<div class="sl-card-badges">' +
        '  <span class="sl-lens-badge">' + escapeHtml(schema.shortBadge) + '</span>' +
        '  <button class="sl-fav-dot ' + (card.favorite ? "is-fav" : "") + '" title="收藏">' + (card.favorite ? ICONS.star : ICONS.starOutline) + '</button>' +
        '</div>' +
        '<div class="sl-card-hover-hud">' +
        '  <div class="sl-card-title-row">' +
        '    <span class="sl-card-name">' + escapeHtml(card.title) + '</span>' +
        '    <span class="sl-card-ratio">' + escapeHtml(card.aspect) + '</span>' +
        '  </div>' +
        (!isMobile
          ? '<div class="sl-card-quick-actions">' +
            '  <button class="sl-qbtn" data-q="copy-pos" title="复制正面提示词">' + ICONS.copy + ' 正面</button>' +
            '  <button class="sl-qbtn" data-q="copy-neg" title="复制负面提示词">负面</button>' +
            '  <button class="sl-qbtn icon-only" data-q="ab" title="A/B 并排对比">' + ICONS.compare + '</button>' +
            '</div>'
          : '') +
        '</div>';

      el.querySelector(".sl-fav-dot").addEventListener("click", e => {
        e.stopPropagation();
        card.favorite = !card.favorite;
        renderAll();
      });

      el.querySelectorAll("[data-q]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const act = btn.dataset.q;
          const d = resolveEffectiveDialect(card, state.dockDialect);
          if (act === "copy-pos") {
            copyText(compilePromptChips(card.positive, d), card.title + " 正面");
          } else if (act === "copy-neg") {
            copyText(compilePromptChips(card.negative, d), card.title + " 负面");
          } else if (act === "ab") {
            openCompareModal(card.id);
          }
        });
      });

      let pressTimer = null;
      if (isMobile) {
        el.addEventListener("touchstart", () => {
          pressTimer = setTimeout(() => {
            state.selectedCardId = card.id;
            renderMobileView();
            showToast("已选中：" + card.title + "（使用底部拇指坞极速复制）");
          }, 420);
        }, { passive: true });
        el.addEventListener("touchend", () => clearTimeout(pressTimer));
      }

      el.addEventListener("click", () => {
        state.selectedCardId = card.id;
        state.selectedChipId = null;
        if (isMobile) {
          state.mobileDetailOpen = true;
          renderMobileView();
        } else {
          renderGalleryCenter();
          renderInspector();
          renderDock();
        }
      });

      cols[minIdx].appendChild(el);
      const canvas = el.querySelector("canvas");
      requestAnimationFrame(() => {
        paintCanvasElement(canvas, card, card.activeVariant, colWidthEstimate(cols[minIdx], isMobile ? 165 : 220));
      });
    });
  }

  function colWidthEstimate(colEl, fallback) {
    return (colEl && colEl.clientWidth > 30) ? colEl.clientWidth : fallback;
  }

  // =========================================================================
  // 12. RIGHT 420px PERSISTENT OPTICAL INSPECTOR
  // =========================================================================
  function renderInspector() {
    const insp = document.getElementById("sl-inspector");
    const showInspector = (state.activeModule === "gallery" || state.activeModule === "snippets");
    insp.classList.toggle("hidden", !showInspector);
    if (!showInspector) return;

    const card = getCard(state.selectedCardId);
    if (!card) return;
    const schema = getSchema(card.schemaId);
    const activeChips = state.promptChannel === "positive" ? card.positive : card.negative;
    const effectiveDialect = resolveEffectiveDialect(card, "keep");

    insp.innerHTML =
      '<div class="sl-insp-header">' +
      '  <div class="sl-insp-top-bar">' +
      '    <input class="sl-insp-title-input" id="insp-title-input" value="' + escapeHtml(card.title) + '" title="点击重命名画师串">' +
      '    <button class="sl-icon-btn" id="insp-ab-btn" title="双图 A/B 并排放大对比">' + ICONS.compare + ' A/B对比</button>' +
      '    <button class="sl-icon-btn ' + (card.favorite ? "amber" : "") + '" id="insp-fav-btn" title="收藏">' + (card.favorite ? ICONS.star : ICONS.starOutline) + '</button>' +
      '  </div>' +
      '  <div class="sl-variant-row">' +
      '    <div class="sl-variant-thumbs">' +
             card.variants.map((v, idx) =>
               '<button class="sl-vthumb ' + (card.activeVariant === idx ? "active" : "") + '" data-vidx="' + idx + '" title="' + escapeHtml(v.name) + '">' +
               '<canvas data-vcanvas="' + idx + '"></canvas>' +
               '<span class="sl-vthumb-idx">V' + (idx + 1) + '</span>' +
               '</button>'
             ).join("") +
      '    </div>' +
      '    <span style="font-size:11px;color:var(--text-secondary);white-space:nowrap">' + escapeHtml((card.variants[card.activeVariant] || {}).name || "") + '</span>' +
      '  </div>' +
      '  <div class="sl-schema-switch-row">' +
      '    <span class="sl-schema-label">底模 Schema</span>' +
      '    <select class="sl-schema-select" id="insp-schema-select">' +
             state.schemas.map(s => '<option value="' + s.id + '"' + (s.id === card.schemaId ? " selected" : "") + '>' + escapeHtml(s.name) + ' (' + escapeHtml(s.shortBadge) + ')</option>').join("") +
      '    </select>' +
      '  </div>' +
      '</div>' +
      '<div class="sl-insp-scroll" id="insp-scroll">' +
      buildPromptEditorHtml(card, schema, activeChips, effectiveDialect) +
      buildDynamicParamsHtml(card, schema) +
      '</div>';

    // Paint variant thumbnails
    insp.querySelectorAll("[data-vcanvas]").forEach(cv => {
      const idx = Number(cv.dataset.vcanvas);
      paintCanvasElement(cv, card, idx, 44);
    });

    bindInspectorEvents(insp, card, schema, activeChips, effectiveDialect);
  }

  function buildPromptEditorHtml(card, schema, activeChips, effectiveDialect) {
    const selectedChip = activeChips.find(c => c.id === state.selectedChipId);
    let html =
      '<div>' +
      '  <div class="sl-sec-head">' +
      '    <div class="sl-seg-tabs">' +
      '      <button class="sl-seg-tab amber ' + (state.promptChannel === "positive" ? "active" : "") + '" data-ch="positive">正面 (' + card.positive.length + ')</button>' +
      '      <button class="sl-seg-tab ' + (state.promptChannel === "negative" ? "active" : "") + '" data-ch="negative">负面 (' + card.negative.length + ')</button>' +
      '    </div>' +
      '    <div class="sl-seg-tabs">' +
      '      <button class="sl-seg-tab ' + (state.promptEditorMode === "chips" ? "active" : "") + '" data-ed="chips">' + ICONS.chips + ' 胶囊</button>' +
      '      <button class="sl-seg-tab ' + (state.promptEditorMode === "source" ? "active" : "") + '" data-ed="source">' + ICONS.code + ' 源码</button>' +
      '    </div>' +
      '  </div>';

    if (state.promptEditorMode === "chips") {
      html +=
        '  <div class="sl-chip-input-row">' +
        '    <input class="sl-chip-input" id="insp-add-chip" placeholder="输入词条按回车添加 (支持 1.2::tag::)">' +
        '    <button class="sl-icon-btn" id="insp-import-snp" style="color:var(--cyan);border-color:rgba(56,189,248,0.3)">' + ICONS.puzzle + ' 导入积木</button>' +
        '  </div>' +
        '  <div class="sl-chips-bed" id="insp-chips-bed">';

      if (activeChips.length === 0) {
        html += '<span style="color:var(--text-muted);font-size:11.5px;margin:auto">暂无词条 — 输入词条或导入积木块</span>';
      } else {
        activeChips.forEach((chip, idx) => {
          const isSel = chip.id === state.selectedChipId;
          if (chip.type === "snippet") {
            const snp = getSnippet(chip.snippetId);
            const name = snp ? snp.name : "已移除积木";
            const count = snp ? parsePromptString(snp.content).length : 0;
            html +=
              '<div class="sl-chip is-snippet' + (isSel ? " selected" : "") + (chip.muted ? " is-muted" : "") + '" draggable="true" data-chip-id="' + chip.id + '" data-chip-idx="' + idx + '">' +
              '  <span style="color:var(--cyan);display:flex">' + ICONS.puzzle + '</span>' +
              '  <span>' + escapeHtml(name) + '</span>' +
              '  <span class="mono" style="font-size:10px;opacity:0.75">' + count + '</span>' +
              '  <span class="sl-chip-bar" style="width:100%"></span>' +
              '</div>';
          } else {
            const w = chip.weight == null ? 1.0 : chip.weight;
            const isOne = Math.abs(w - 1.0) < 0.005;
            const pct = Math.min(100, Math.max(8, Math.round(((w - 0.5) / 1.1) * 100)));
            const barWidth = isOne ? "0%" : pct + "%";
            html +=
              '<div class="sl-chip' + (isSel ? " selected" : "") + (chip.muted ? " is-muted" : "") + '" draggable="true" data-chip-id="' + chip.id + '" data-chip-idx="' + idx + '">' +
              '  <span>' + escapeHtml(chip.text) + '</span>' +
              (!isOne ? '<span class="sl-chip-w ' + (w < 1.0 ? "low" : "") + '">' + w.toFixed(2) + '</span>' : '') +
              '  <span class="sl-chip-bar" style="width:' + barWidth + ';background:' + (w < 1.0 ? "var(--cyan)" : "var(--amber)") + '"></span>' +
              '</div>';
          }
        });
      }
      html += '  </div>';

      // Micro-adjust bar / Inline snippet preview bubble when a chip is selected
      if (selectedChip) {
        if (selectedChip.type === "snippet") {
          const snp = getSnippet(selectedChip.snippetId);
          const inner = snp ? parsePromptString(snp.content) : [];
          html +=
            '<div class="sl-chip-microbar" style="border-color:rgba(56,189,248,0.38)">' +
            '  <div class="sl-chip-microbar-top">' +
            '    <span style="font-size:11.5px;color:var(--cyan);font-weight:600;display:flex;align-items:center;gap:5px">' + ICONS.puzzle + ' ' + escapeHtml(snp ? snp.name : "未知积木") + '</span>' +
            '    <div class="sl-micro-actions">' +
            '      <button class="sl-mbtn" data-cact="move-l" title="左移">←</button>' +
            '      <button class="sl-mbtn" data-cact="move-r" title="右移">→</button>' +
            '      <button class="sl-mbtn" data-cact="mute">' + (selectedChip.muted ? "恢复" : "静音") + '</button>' +
            '      <button class="sl-mbtn cyan" data-cact="explode">' + ICONS.explode + ' 打散</button>' +
            '      <button class="sl-mbtn danger" data-cact="remove">×</button>' +
            '    </div>' +
            '  </div>' +
            '  <div class="sl-snippet-preview-tags">' +
                 inner.map(it => '<span class="sl-mini-tag">' + escapeHtml(it.text) + (Math.abs(it.weight - 1) > 0.005 ? ' <b class="mono">' + it.weight.toFixed(2) + '</b>' : '') + '</span>').join("") +
            '  </div>' +
            '</div>';
        } else {
          html +=
            '<div class="sl-chip-microbar">' +
            '  <div class="sl-chip-microbar-top">' +
            '    <span style="font-size:11.5px;color:var(--text-primary);font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(selectedChip.text) + ' <span class="mono" style="color:var(--amber)">' + (selectedChip.weight || 1).toFixed(2) + '</span></span>' +
            '    <div class="sl-micro-actions">' +
            '      <button class="sl-mbtn" data-cact="w-down">−0.05</button>' +
            '      <button class="sl-mbtn" data-cact="w-up">+0.05</button>' +
            '      <button class="sl-mbtn" data-cact="mute">' + (selectedChip.muted ? "恢复" : "静音") + '</button>' +
            '      <button class="sl-mbtn" data-cact="move-l" title="左移">←</button>' +
            '      <button class="sl-mbtn" data-cact="move-r" title="右移">→</button>' +
            '      <button class="sl-mbtn danger" data-cact="remove">×</button>' +
            '    </div>' +
            '  </div>' +
            '</div>';
        }
      }
    } else {
      const sourceText = chipsToSourceText(activeChips, effectiveDialect);
      html +=
        '  <textarea class="sl-source-textarea" id="insp-source-ta" placeholder="输入逗号分隔的提示词，支持 1.2::tag:: / (tag:1.2) / [[🧩 积木名]]">' + escapeHtml(sourceText) + '</textarea>' +
        '  <div style="font-size:11px;color:var(--text-muted);margin-top:4px">编辑即实时同步 AST；支持 <span class="mono">[[🧩 积木名]]</span> 与 <span class="mono">[-静音词]</span></div>';
    }

    html += '</div>';
    return html;
  }

  function buildDynamicParamsHtml(card, schema) {
    const sliders = schema.params.filter(p => p.type === "slider");
    const selects = schema.params.filter(p => p.type === "select");
    const toggles = schema.params.filter(p => p.type === "toggle");

    let html =
      '<div>' +
      '  <div class="sl-sec-head">' +
      '    <span class="sl-sec-title">动态光学参数 · ' + escapeHtml(schema.shortBadge) + '</span>' +
      '    <span style="font-size:10.5px;color:var(--text-muted)">左右拖拽滑轨 / 双击精调</span>' +
      '  </div>' +
      '  <div class="sl-params-list">';

    sliders.forEach(p => {
      const val = card.params[p.key] != null ? Number(card.params[p.key]) : p.default;
      const pct = Math.max(0, Math.min(100, ((val - p.min) / (p.max - p.min)) * 100));
      const hasSafe = p.safeMin != null && p.safeMax != null;
      const inSafe = hasSafe ? (val >= p.safeMin - 1e-6 && val <= p.safeMax + 1e-6) : true;
      const safeLeft = hasSafe ? ((p.safeMin - p.min) / (p.max - p.min)) * 100 : 0;
      const safeWidth = hasSafe ? ((p.safeMax - p.safeMin) / (p.max - p.min)) * 100 : 0;
      const cls = hasSafe ? (inSafe ? "in-safe" : "out-of-safe") : "";
      const decimals = (String(p.step).split(".")[1] || "").length;

      html +=
        '<div class="sl-scrubber ' + cls + '" data-scrub-key="' + p.key + '" data-min="' + p.min + '" data-max="' + p.max + '" data-step="' + p.step + '" data-smin="' + (p.safeMin ?? "") + '" data-smax="' + (p.safeMax ?? "") + '">' +
        (hasSafe ? '<div class="sl-scrubber-safe" style="left:' + safeLeft + '%;width:' + safeWidth + '%"></div>' : '') +
        '  <div class="sl-scrubber-fill" style="width:' + pct + '%"></div>' +
        '  <div class="sl-scrubber-left">' +
        '    <span>' + escapeHtml(p.label) + '</span>' +
        (p.safeNote ? '<span class="sl-scrubber-note">' + (inSafe ? escapeHtml(p.safeNote) : '越界 · ' + escapeHtml(p.safeNote)) + '</span>' : '') +
        '  </div>' +
        '  <span class="sl-scrubber-val">' + val.toFixed(decimals) + (p.unit ? ' ' + p.unit : '') + '</span>' +
        '</div>';
    });

    selects.forEach(p => {
      const val = card.params[p.key] != null ? card.params[p.key] : p.default;
      html +=
        '<div class="sl-param-row">' +
        '  <label>' + escapeHtml(p.label) + '</label>' +
        '  <select data-param-select="' + p.key + '">' +
             p.options.map(opt => '<option value="' + escapeHtml(opt) + '"' + (val === opt ? " selected" : "") + '>' + escapeHtml(opt) + '</option>').join("") +
        '  </select>' +
        '</div>';
    });

    if (toggles.length > 0) {
      html += '<div class="sl-toggles-grid">';
      toggles.forEach(p => {
        const on = card.params[p.key] != null ? !!card.params[p.key] : !!p.default;
        html +=
          '<button class="sl-toggle-chip ' + (on ? "on" : "") + '" data-param-toggle="' + p.key + '">' +
          '  <span class="dot"></span><span>' + escapeHtml(p.label) + '</span>' +
          '</button>';
      });
      html += '</div>';
    }

    // Resolution Strip
    if (schema.resolutions && schema.resolutions.length > 0) {
      const curRes = card.params.resolution || schema.resolutions[0];
      html +=
        '  <div style="margin-top:4px">' +
        '    <div style="font-size:11px;color:var(--text-secondary);margin-bottom:5px">画幅分辨率</div>' +
        '    <div class="sl-res-strip">' +
             schema.resolutions.map(r => '<button class="sl-res-btn ' + (curRes === r ? "active" : "") + '" data-res="' + r + '">' + r + '</button>').join("") +
        '    </div>' +
        '  </div>';
    }

    // LoRA Slots
    if (schema.supportsLora) {
      const loras = card.loras || [];
      html +=
        '<div style="margin-top:6px">' +
        '  <div class="sl-sec-head" style="margin-bottom:6px">' +
        '    <span class="sl-sec-title">LoRA 权重槽 (' + loras.length + ')</span>' +
        '    <button class="sl-mbtn" id="insp-add-lora">+ 添加 LoRA</button>' +
        '  </div>' +
        '  <div class="sl-lora-list">';
      if (loras.length === 0) {
        html += '<div style="font-size:11px;color:var(--text-muted);padding:6px 0">暂无挂载 LoRA（点击右上角添加）</div>';
      } else {
        loras.forEach((lr, idx) => {
          const pct = Math.max(0, Math.min(100, (lr.weight / 1.5) * 100));
          html +=
            '<div class="sl-lora-item">' +
            '  <div class="sl-lora-head">' +
            '    <span class="sl-lora-name">' + escapeHtml(lr.name) + '</span>' +
            '    <div style="display:flex;align-items:center;gap:4px">' +
                 (lr.trigger ? '<span class="sl-trigger-pill" data-lora-trig="' + escapeHtml(lr.trigger) + '" title="点击插入正面提示词">+' + escapeHtml(lr.trigger) + '</span>' : '') +
            '      <button class="sl-mbtn" data-lora-tog="' + idx + '">' + (lr.enabled ? "启用" : "停用") + '</button>' +
            '      <button class="sl-mbtn danger" data-lora-del="' + idx + '">×</button>' +
            '    </div>' +
            '  </div>' +
            '  <div class="sl-scrubber ' + (lr.weight <= 1.0 ? "in-safe" : "out-of-safe") + '" style="height:26px" data-lora-scrub="' + idx + '" data-min="0" data-max="1.5" data-step="0.05" data-smin="0.4" data-smax="1.0">' +
            '    <div class="sl-scrubber-fill" style="width:' + pct + '%"></div>' +
            '    <div class="sl-scrubber-left"><span>权重 Strength</span></div>' +
            '    <span class="sl-scrubber-val">' + lr.weight.toFixed(2) + '</span>' +
            '  </div>' +
            '</div>';
        });
      }
      html += '  </div></div>';
    }

    html += '  </div></div>';
    return html;
  }

  function refreshInspectorAndDock() {
    if (state.viewportMode === "mobile") {
      renderMobileView();
    } else {
      renderInspector();
      renderDock();
    }
  }

  function bindInspectorEvents(root, card, schema, activeChips, effectiveDialect) {
    const titleInp = root.querySelector("#insp-title-input");
    if (titleInp) {
      titleInp.addEventListener("change", e => {
        card.title = e.target.value.trim() || card.title;
        if (state.viewportMode === "mobile") renderMobileView();
        else { renderGalleryCenter(); renderDock(); }
      });
    }

    const favBtn = root.querySelector("#insp-fav-btn");
    if (favBtn) favBtn.addEventListener("click", () => { card.favorite = !card.favorite; renderAll(); });

    const abBtn = root.querySelector("#insp-ab-btn");
    if (abBtn) abBtn.addEventListener("click", () => openCompareModal(card.id));

    root.querySelectorAll("[data-vidx]").forEach(btn => {
      btn.addEventListener("click", () => {
        card.activeVariant = Number(btn.dataset.vidx);
        renderAll();
      });
    });

    const schemaSel = root.querySelector("#insp-schema-select");
    if (schemaSel) {
      schemaSel.addEventListener("change", e => {
        switchCardSchema(card, e.target.value);
        renderAll();
        showToast("已切换 Schema 至 " + getSchema(e.target.value).name);
      });
    }

    // Channel & Editor Mode
    root.querySelectorAll("[data-ch]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.promptChannel = btn.dataset.ch;
        state.selectedChipId = null;
        refreshInspectorAndDock();
      });
    });
    root.querySelectorAll("[data-ed]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.promptEditorMode = btn.dataset.ed;
        state.selectedChipId = null;
        refreshInspectorAndDock();
      });
    });

    // Add chip input
    const addInp = root.querySelector("#insp-add-chip");
    if (addInp) {
      addInp.addEventListener("keydown", e => {
        if (e.key === "Enter" && addInp.value.trim()) {
          const parsed = parsePromptString(addInp.value);
          activeChips.push(...parsed);
          addInp.value = "";
          refreshInspectorAndDock();
        }
      });
    }

    // Import snippet button
    const impBtn = root.querySelector("#insp-import-snp");
    if (impBtn) {
      impBtn.addEventListener("click", e => {
        e.stopPropagation();
        const html = state.snippets.map(s =>
          '<button class="sl-pop-item" data-pick-snp="' + s.id + '">' +
          '<span>' + ICONS.puzzle + ' ' + escapeHtml(s.name) + '</span>' +
          '<span class="sl-badge cyan">' + escapeHtml(s.category) + '</span>' +
          '</button>'
        ).join("");
        openPopover(impBtn, html);
        document.getElementById("sl-popover").querySelectorAll("[data-pick-snp]").forEach(item => {
          item.addEventListener("click", () => {
            const newSnp = mkSnp(item.dataset.pickSnp);
            activeChips.push(newSnp);
            state.selectedChipId = newSnp.id;
            closePopover();
            refreshInspectorAndDock();
            showToast("已导入积木块");
          });
        });
      });
    }

    // Chip selection & drag-and-drop reorder
    let dragSrcIdx = null;
    root.querySelectorAll(".sl-chip[data-chip-id]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.chipId;
        state.selectedChipId = (state.selectedChipId === id) ? null : id;
        refreshInspectorAndDock();
      });
      el.addEventListener("dragstart", e => {
        dragSrcIdx = Number(el.dataset.chipIdx);
        e.dataTransfer.effectAllowed = "move";
      });
      el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("drag-over"); });
      el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
      el.addEventListener("drop", e => {
        e.preventDefault();
        el.classList.remove("drag-over");
        const dstIdx = Number(el.dataset.chipIdx);
        if (dragSrcIdx != null && dragSrcIdx !== dstIdx) {
          const [moved] = activeChips.splice(dragSrcIdx, 1);
          activeChips.splice(dstIdx, 0, moved);
          refreshInspectorAndDock();
        }
      });
    });

    // Chip microbar actions
    root.querySelectorAll("[data-cact]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = activeChips.findIndex(c => c.id === state.selectedChipId);
        if (idx < 0) return;
        const chip = activeChips[idx];
        const act = btn.dataset.cact;
        if (act === "w-up") chip.weight = Math.min(2.0, +((chip.weight || 1.0) + 0.05).toFixed(2));
        else if (act === "w-down") chip.weight = Math.max(0.1, +((chip.weight || 1.0) - 0.05).toFixed(2));
        else if (act === "mute") chip.muted = !chip.muted;
        else if (act === "move-l" && idx > 0) { const t = activeChips[idx - 1]; activeChips[idx - 1] = chip; activeChips[idx] = t; }
        else if (act === "move-r" && idx < activeChips.length - 1) { const t = activeChips[idx + 1]; activeChips[idx + 1] = chip; activeChips[idx] = t; }
        else if (act === "remove") { activeChips.splice(idx, 1); state.selectedChipId = null; }
        else if (act === "explode" && chip.type === "snippet") {
          const snp = getSnippet(chip.snippetId);
          const expanded = snp ? parsePromptString(snp.content) : [];
          activeChips.splice(idx, 1, ...expanded);
          state.selectedChipId = expanded[0] ? expanded[0].id : null;
          showToast("已将积木块原地打散为 " + expanded.length + " 枚独立词条");
        }
        refreshInspectorAndDock();
      });
    });

    // Source mode live sync
    const sourceTa = root.querySelector("#insp-source-ta");
    if (sourceTa) {
      sourceTa.addEventListener("input", () => {
        const parsed = parsePromptString(sourceTa.value);
        if (state.promptChannel === "positive") card.positive = parsed;
        else card.negative = parsed;
