  /* =========================================================
   * 9. REAL .slpack ZIP ARCHIVE BUILDER (Pure JS + CRC32)
   * ========================================================= */
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      c ^= bytes[i];
      for (let k = 0; k < 8; k++) {
        c = (c >>> 1) ^ (c & 1 ? 0xEDB88320 : 0);
      }
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZipArchive(files) {
    const enc = new TextEncoder();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    for (const f of files) {
      const nameBytes = enc.encode(f.name);
      const dataBytes = typeof f.content === 'string' ? enc.encode(f.content) : f.content;
      const crc = crc32(dataBytes);

      const lh = new ArrayBuffer(30 + nameBytes.length);
      const lv = new DataView(lh);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, dataBytes.length, true);
      lv.setUint32(22, dataBytes.length, true);
      lv.setUint16(26, nameBytes.length, true);
      new Uint8Array(lh, 30).set(nameBytes);

      localParts.push(new Uint8Array(lh), dataBytes);

      const ch = new ArrayBuffer(46 + nameBytes.length);
      const cv = new DataView(ch);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, dataBytes.length, true);
      cv.setUint32(24, dataBytes.length, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      new Uint8Array(ch, 46).set(nameBytes);

      centralParts.push(new Uint8Array(ch));
      offset += 30 + nameBytes.length + dataBytes.length;
    }

    const centralSize = centralParts.reduce((s, a) => s + a.length, 0);
    const eocd = new ArrayBuffer(22);
    const ev = new DataView(eocd);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);

    return new Blob([...localParts, ...centralParts, new Uint8Array(eocd)], { type: 'application/zip' });
  }

  /* =========================================================
   * 10. CLIPBOARD & TOAST & ACTIONS
   * ========================================================= */
  function showToast(msg) {
    const stack = document.getElementById('toastStack');
    if (!stack) return;
    const el = document.createElement('div');
    el.className = 'toast-pill';
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      el.style.transition = 'all 0.22s ease';
      setTimeout(() => el.remove(), 220);
    }, 2600);
  }

  function copyText(txt, label) {
    const text = txt || '';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
    }
    showToast(`${label}：${text.length > 48 ? text.slice(0, 48) + '…' : text || '(空)'}`);
  }

  function openRecipeTab(recipeId) {
    if (!STATE.openTabs.includes(recipeId)) {
      STATE.openTabs.push(recipeId);
    }
    if (STATE.viewportMode === 'mobile') {
      STATE.mobileSheetRecipeId = recipeId;
    } else {
      STATE.activeTab = recipeId;
    }
    renderAll();
  }

  function closeRecipeTab(recipeId) {
    const idx = STATE.openTabs.indexOf(recipeId);
    if (idx !== -1) STATE.openTabs.splice(idx, 1);
    if (STATE.activeTab === recipeId) {
      STATE.activeTab = STATE.openTabs[idx - 1] || STATE.openTabs[0] || 'gallery';
    }
    renderAll();
  }

  function cloneRecipeToModel(sourceId, targetSchemaId, options = {}) {
    const src = getRecipe(sourceId);
    const targetSchema = getSchema(targetSchemaId);
    const snMap = getSnippetsMap();

    // Clone & transpile AST tokens cleanly to target schema dialect
    const cloneNode = (n) => {
      if (n.type === 'snippet') return snipRef(n.snippetId, n.muted);
      return tok(n.text, n.weight, n.muted);
    };
    const newPos = src.posNodes.map(cloneNode);
    const newNeg = src.negNodes.map(cloneNode);

    // Map parameters with target schema defaults + preserved common fields
    const newParams = {};
    for (const f of targetSchema.fields) {
      if (f.key === 'resolution' && src.params.resolution) {
        newParams[f.key] = src.params.resolution;
      } else if (f.key === 'steps' && src.params.steps != null) {
        newParams[f.key] = Math.min(f.max, Math.max(f.min, f.safeMax ? Math.min(src.params.steps, f.safeMax) : src.params.steps));
      } else if (f.key === 'cfg') {
        newParams[f.key] = f.default;
      } else {
        newParams[f.key] = f.default;
      }
    }

    const newRecipe = {
      id: uid('rec'),
      title: `${src.title.split('·')[0].trim()} · ${targetSchema.name}`,
      schemaId: targetSchema.id,
      aspect: src.aspect,
      artTheme: src.artTheme,
      tags: Array.from(new Set([...src.tags, targetSchema.name])),
      notes: `从「${src.title}」克隆至 ${targetSchema.name}，已自动转写为 ${DIALECTS[targetSchema.dialect].short} 语法并映射推荐基准参数。`,
      posNodes: newPos,
      negNodes: newNeg,
      params: newParams,
      loras: JSON.parse(JSON.stringify(src.loras || [])),
      variants: JSON.parse(JSON.stringify(src.variants)),
      activeVariant: src.activeVariant || 0
    };

    STATE.recipes.unshift(newRecipe);

    if (options.putInArenaRight) {
      STATE.arena.leftId = src.id;
      STATE.arena.rightId = newRecipe.id;
      STATE.activeTab = 'gallery';
      STATE.galleryMode = 'arena';
      showToast(`已克隆左卡至「${targetSchema.name}」并转写语法放入右卡竞技场！`);
    } else if (options.openTab !== false) {
      STATE.openTabs.push(newRecipe.id);
      if (STATE.viewportMode === 'mobile') {
        STATE.mobileSheetRecipeId = newRecipe.id;
      } else {
        STATE.activeTab = newRecipe.id;
      }
      showToast(`已克隆到 ${targetSchema.name} 并打开工作标签`);
    }
    STATE.modal = null;
    renderAll();
    return newRecipe;
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

                </div>

  function buildArenaDiffData(left, right) {
    const scL = getSchema(left.schemaId);
    const scR = getSchema(right.schemaId);
    const snMap = getSnippetsMap();

    // Parameter Diff Union
    const fieldByKeyL = {};
    const fieldByKeyR = {};
    scL.fields.forEach(f => { fieldByKeyL[f.key] = f; });
    scR.fields.forEach(f => { fieldByKeyR[f.key] = f; });
    const allKeys = Array.from(new Set([...scL.fields.map(f => f.key), ...scR.fields.map(f => f.key)]));

    const paramRows = allKeys.map(k => {
      const fL = fieldByKeyL[k];
      const fR = fieldByKeyR[k];
      const label = (fL || fR).label;
      const vL = fL ? (left.params[k] ?? fL.default) : null;
      const vR = fR ? (right.params[k] ?? fR.default) : null;
      const fmt = v => v === null ? '—' : typeof v === 'boolean' ? (v ? 'ON' : 'OFF') : String(v);
      let status = 'same';
      if (fL && !fR) status = 'only-a';
      else if (!fL && fR) status = 'only-b';
      else if (String(vL) !== String(vR)) status = 'diff';
      return { key: k, label, valL: fmt(vL), valR: fmt(vR), status };
    });

    // Token Syntax & Weight Diff
    const flatL = expandNodesFlat(left.posNodes, snMap, true);
    const flatR = expandNodesFlat(right.posNodes, snMap, true);
    const mapL = new Map();
    const mapR = new Map();
    flatL.forEach(n => {
      const nk = normalizeTokenKey(n.text);
      if (!mapL.has(nk)) mapL.set(nk, n);
    });
    flatR.forEach(n => {
      const nk = normalizeTokenKey(n.text);
      if (!mapR.has(nk)) mapR.set(nk, n);
    });
    const allTokenKeys = Array.from(new Set([...mapL.keys(), ...mapR.keys()]));
    const tokenRows = allTokenKeys.map(nk => {
      const nL = mapL.get(nk);
      const nR = mapR.get(nk);
      const rawL = nL ? formatTokenForDialect(nL.text, nL.weight, scL.dialect) : '—';
      const rawR = nR ? formatTokenForDialect(nR.text, nR.weight, scR.dialect) : '—';
      let status = 'same';
      if (nL && !nR) status = 'only-a';
      else if (!nL && nR) status = 'only-b';
      else if (rawL !== rawR || Math.abs((nL.weight || 1) - (nR.weight || 1)) > 0.01) status = 'diff';
      return { key: nk, rawL, rawR, status };
    });

    return { scL, scR, paramRows, tokenRows };
  }

  function renderSchemaParamsPanel(recipe, sc) {
    const groups = {};
    sc.fields.forEach(f => {
      if (!groups[f.group]) groups[f.group] = [];
      groups[f.group].push(f);
    });

    const renderField = (f) => {
      const val = recipe.params[f.key] ?? f.default;
      if (f.type === 'slider' || f.type === 'stepper') {
        const num = Number(val);
        const hasSafe = f.safeMin != null && f.safeMax != null;
        const outOfSafe = hasSafe && (num < f.safeMin || num > f.safeMax);
        const span = Math.max(0.0001, (f.max - f.min));
        const safeLeftPct = hasSafe ? ((f.safeMin - f.min) / span) * 100 : 0;
        const safeWidthPct = hasSafe ? ((f.safeMax - f.safeMin) / span) * 100 : 100;

        return `
          <div class="param-item ${outOfSafe ? 'warn' : ''}" data-param-box="${escapeHtml(recipe.id)}:${escapeHtml(f.key)}">
            <div class="param-head">
              <span>${escapeHtml(f.label)}</span>
              <span class="param-val" data-param-val="${escapeHtml(recipe.id)}:${escapeHtml(f.key)}">${num}</span>
            </div>
            <div class="safe-track-wrap">
              <div class="safe-track-bg">
                ${hasSafe ? `<div class="safe-track-zone" style="left:${safeLeftPct}%; width:${safeWidthPct}%;"></div>` : ''}
              </div>
              <input class="safe-range-input" type="range" min="${f.min}" max="${f.max}" step="${f.step || 1}" value="${num}"
                     data-action="param-range" data-id="${escapeHtml(recipe.id)}" data-key="${escapeHtml(f.key)}"
                     data-smin="${f.safeMin ?? ''}" data-smax="${f.safeMax ?? ''}">
            </div>
            <div class="param-hint">
              <span>${hasSafe ? `推荐安全区间 ${f.safeMin}–${f.safeMax}` : ''}</span>
              <span data-param-warn="${escapeHtml(recipe.id)}:${escapeHtml(f.key)}">${outOfSafe ? '⚠ 超出推荐范围' : escapeHtml(f.hint || '')}</span>
            </div>
          </div>
        `;
      }
      if (f.type === 'select') {
        return `
          <div class="param-item">
            <div class="param-head"><span>${escapeHtml(f.label)}</span></div>
            <select class="sl-select" data-action="param-select" data-id="${escapeHtml(recipe.id)}" data-key="${escapeHtml(f.key)}">
              ${(f.options || []).map(opt => `<option value="${escapeHtml(opt)}" ${String(val) === String(opt) ? 'selected' : ''}>${escapeHtml(opt)}</option>`).join('')}
            </select>
            ${f.hint ? `<div class="param-hint"><span>${escapeHtml(f.hint)}</span></div>` : ''}
          </div>
        `;
      }
      if (f.type === 'toggle') {
        const on = !!val;
        return `
          <div class="param-item" style="flex-direction:row; align-items:center; justify-content:space-between;">
            <div>
              <div style="font-size:12px; font-weight:500;">${escapeHtml(f.label)}</div>
              ${f.hint ? `<div class="param-hint"><span>${escapeHtml(f.hint)}</span></div>` : ''}
            </div>
            <button class="sl-switch ${on ? 'on' : ''}" data-action="param-toggle" data-id="${escapeHtml(recipe.id)}" data-key="${escapeHtml(f.key)}" aria-label="${escapeHtml(f.label)}"></button>
          </div>
        `;
      }
      if (f.type === 'resolution') {
        const presets = f.presets || ['832x1216', '1024x1024', '1216x832'];
        return `
          <div class="param-item" style="grid-column:1 / -1;">
            <div class="param-head">
              <span>${escapeHtml(f.label)}</span>
              <span class="param-val">${escapeHtml(val)}</span>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${presets.map(p => `
                <button class="filter-pill ${String(val) === p ? 'active' : ''}" data-action="param-res" data-id="${escapeHtml(recipe.id)}" data-key="${escapeHtml(f.key)}" data-res="${escapeHtml(p)}">${escapeHtml(p)}</button>

          <div class="param-head"><span>${escapeHtml(f.label)}</span></div>
          <input class="sl-input" type="text" value="${escapeHtml(val)}" data-action="param-text" data-id="${escapeHtml(recipe.id)}" data-key="${escapeHtml(f.key)}">
        </div>
      `;

  /* ---------- Snippets Library View (积木库) ---------- */
  function countSnippetRefs(snippetId) {
    return STATE.recipes.filter(r =>
      r.posNodes.some(n => n.type === 'snippet' && n.snippetId === snippetId) ||
      r.negNodes.some(n => n.type === 'snippet' && n.snippetId === snippetId)
    ).length;
  }

  function renderSnippetsView() {
    const cats = ['全部', '人物主体', '画质起手', '光影氛围', '服饰姿势', '常用负面', '媒介前缀'];
    const filtered = STATE.snippets.filter(s => {
      if (STATE.snippetEditor.catFilter !== '全部' && s.category !== STATE.snippetEditor.catFilter) return false;
      const q = STATE.snippetEditor.search.trim().toLowerCase();
      if (!q) return true;
      return `${s.name} ${s.category} ${s.modelNote} ${s.nodes.map(n => n.text).join(' ')}`.toLowerCase().includes(q);
    });
    const selected = STATE.snippets.find(s => s.id === STATE.snippetEditor.selectedId) || STATE.snippets[0];

    return `
      <div class="utility-view">
        <div class="glass-panel" style="border-radius:16px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">

            <div style="font-size:15px; font-weight:700;">提示词积木库 (中性独立片段)</div>
            <div style="font-size:12px; color:var(--sl-text-sub);">修改积木原件会实时同步至所有引用了该 [🧩 预设块] 的配方卡片与 A/B 对比。</div>

          ${cats.map(c => `
            <button class="filter-pill ${STATE.snippetEditor.catFilter === c ? 'active' : ''}" data-action="set-snip-cat" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>

        </div>

        <div class="two-col-split" style="flex:1;">
          <div style="display:flex; flex-direction:column; gap:10px; overflow-y:auto;">
            ${filtered.map(s => {
              const refs = countSnippetRefs(s.id);
              const isSel = selected && selected.id === s.id;
              return `
                <div class="glass-panel" style="border-radius:14px; padding:12px; cursor:pointer; border-color:${isSel ? 'rgba(45,212,191,0.65)' : 'var(--sl-border)'};"

                  <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                    <div style="font-size:13.5px; font-weight:700; color:#CCFBF1;">🧩 ${escapeHtml(s.name)}</div>
                    <span class="filter-pill" style="height:21px; font-size:10.5px;">${escapeHtml(s.category)}</span>
                  </div>
                  <div style="font-size:11px; color:var(--sl-text-dim); margin:4px 0 8px;">${escapeHtml(s.modelNote)} · 被 ${refs} 张配方引用</div>
                  <div style="font-family:var(--sl-mono); font-size:11.5px; color:var(--sl-text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                    ${escapeHtml(s.nodes.map(n => formatTokenForDialect(n.text, n.weight, 'sdxl')).join(', '))}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          ${selected ? `
            <div class="glass-panel" style="border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:12px;">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                <div style="font-size:15px; font-weight:700;">编辑积木 · ${escapeHtml(selected.name)}</div>
                <div style="display:flex; gap:6px;">
                  <button class="btn btn-sm" data-action="copy-snippet-text" data-sid="${escapeHtml(selected.id)}">${SVG.copy}复制片段</button>

                </div>
              </div>

              <div style="display:grid; grid-template-columns:1fr 160px; gap:10px;">
                <div>
                  <div style="font-size:11px; color:var(--sl-text-sub); margin-bottom:4px;">积木名称</div>
                  <input class="sl-input" style="width:100%;" value="${escapeHtml(selected.name)}" data-action="edit-snippet-field" data-sid="${escapeHtml(selected.id)}" data-field="name">
                </div>
                <div>
                  <div style="font-size:11px; color:var(--sl-text-sub); margin-bottom:4px;">分类标签</div>
                  <select class="sl-select" style="width:100%;" data-action="edit-snippet-field" data-sid="${escapeHtml(selected.id)}" data-field="category">
                    ${cats.slice(1).map(c => `<option value="${escapeHtml(c)}" ${selected.category === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}

              <div>

          ` : ''}
        </div>
      </div>
    `;
  }

   * 14. GLOBAL FLOATING OVERLAYS & MODALS
   * ========================================================= */
  function renderOverlays() {
    const parts = [];

    if (STATE.xray.overlayOpen && STATE.viewportMode === 'desktop') {
      parts.push(`<div class="xray-overlay">${renderXRayInner(true)}</div>`);
    }

    if (STATE.modal) {
      const m = STATE.modal;
      if (m.type === 'dialect-copy') {
        const r = getRecipe(m.recipeId);
        const snMap = getSnippetsMap();
        const nodes = m.zone === 'neg' ? r.negNodes : r.posNodes;
        parts.push(`
          <div class="modal-backdrop" data-action="close-modal-bg">
            <div class="modal-box glass-panel">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:15px; font-weight:700;">跨平台权重语法转写复制 (${m.zone === 'neg' ? '负面' : '正面'})</div>
                <button class="btn btn-xs" data-action="close-modal">${SVG.close}</button>
              </div>
              <div style="display:flex; flex-direction:column; gap:8px;">
                ${Object.values(DIALECTS).map(d => {
                  const out = compileNodes(nodes, d.id, snMap, true);
                  return `
                    <div style="padding:10px; border-radius:11px; background:rgba(8,12,20,0.62); border:1px solid var(--sl-border); display:flex; flex-direction:column; gap:6px;">
                      <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:12px; font-weight:700; color:var(--sl-mint);">${escapeHtml(d.label)}</span>
                        <button class="btn btn-xs btn-primary" data-action="copy-raw-text" data-text="${escapeHtml(out)}" data-label="已转写为 ${escapeHtml(d.short)} 并复制">${SVG.copy}转写并复制</button>
                      </div>
                      <div style="font-family:var(--sl-mono); font-size:11px; color:var(--sl-text-sub); word-break:break-all;">${escapeHtml(out)}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `);
      } else if (m.type === 'import-snippet') {
        const r = getRecipe(m.recipeId);
        parts.push(`
          <div class="modal-backdrop" data-action="close-modal-bg">
            <div class="modal-box glass-panel">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:15px; font-weight:700;">多选导入积木预设到「${escapeHtml(r.title)}」(${m.zone === 'neg' ? '负面' : '正面'})</div>
                <button class="btn btn-xs" data-action="close-modal">${SVG.close}</button>
              </div>
              <div style="display:flex; flex-direction:column; gap:7px; max-height:360px; overflow-y:auto;">
                ${STATE.snippets.map(s => `
                  <label style="display:flex; flex-direction:column; gap:4px; padding:10px; border-radius:11px; background:rgba(8,12,20,0.55); border:1px solid var(--sl-border); cursor:pointer;">
                    <div style="display:flex; align-items:center; gap:8px;">
                      <input type="checkbox" name="importSnipCheck" value="${escapeHtml(s.id)}">
                      <span style="font-weight:700; color:#CCFBF1;">🧩 ${escapeHtml(s.name)}</span>
                      <span class="filter-pill" style="height:20px; font-size:10px; margin-left:auto;">${escapeHtml(s.category)}</span>
                    </div>
                    <div style="font-family:var(--sl-mono); font-size:11px; color:var(--sl-text-sub); padding-left:22px;">
                      ${escapeHtml(s.nodes.map(n => n.text).join(', '))}
                    </div>
                  </label>
                `).join('')}
              </div>
              <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button class="btn btn-sm" data-action="close-modal">取消</button>
                <button class="btn btn-sm btn-mint" data-action="confirm-import-snippets" data-id="${escapeHtml(r.id)}" data-zone="${m.zone}">拼装为 [🧩 预设块]</button>
              </div>
            </div>
          </div>
        `);
      } else if (m.type === 'clone-model') {
        const r = getRecipe(m.recipeId);
        parts.push(`
          <div class="modal-backdrop" data-action="close-modal-bg">
            <div class="modal-box glass-panel">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="font-size:15px; font-weight:700;">
                  ${m.putInArenaRight ? '⚡ 克隆左卡到新底模并放入右卡对比' : '克隆配方到另一底模'}
                </div>
                <button class="btn btn-xs" data-action="close-modal">${SVG.close}</button>
              </div>
              <div style="font-size:12px; color:var(--sl-text-sub);">
                源配方：<strong>${escapeHtml(r.title)}</strong>（自动转写提示词语法方言并映射新模型推荐安全参数）
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                ${STATE.schemas.map(sc => `
                  <button class="glass-sub" style="text-align:left; padding:11px; border-radius:12px; cursor:pointer; color:var(--sl-text); display:flex; flex-direction:column; gap:4px;"
                          data-action="confirm-clone-model" data-id="${escapeHtml(r.id)}" data-scid="${escapeHtml(sc.id)}" data-arena="${m.putInArenaRight ? '1' : '0'}">
                    <div style="display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px;">
                      <span class="model-dot" style="background:${sc.color};"></span>
                      ${escapeHtml(sc.name)}
                    </div>
                    <div style="font-size:11px; color:var(--sl-mint);">${escapeHtml(DIALECTS[sc.dialect].short)}</div>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `);
      }
    }

    return parts.join('');
  }

  /* =========================================================
   * 15. MAIN RENDER ORCHESTRATOR
   * ========================================================= */
  function renderAll() {
    const root = document.getElementById('slSpatial');
    const deskEl = document.getElementById('desktopChrome');
    const mobEl = document.getElementById('mobileChrome');
    const overlayEl = document.getElementById('overlayRoot');

    root.setAttribute('data-viewport', STATE.viewportMode);

    if (STATE.viewportMode === 'desktop') {
      deskEl.style.display = 'flex';
      mobEl.style.display = 'none';

      let mainView = '';
      if (STATE.activeTab === 'gallery') mainView = renderGalleryView();
      else if (STATE.activeTab === 'snippets') mainView = renderSnippetsView();
      else if (STATE.activeTab === 'xray') mainView = `<div class="utility-view">${renderXRayInner(false)}</div>`;
      else if (STATE.activeTab === 'schemas') mainView = renderSchemasView();
      else if (STATE.activeTab === 'sync') mainView = renderSyncView();
      else mainView = renderRecipeWorkbenchView(STATE.activeTab);

      deskEl.innerHTML = `
        ${renderDesktopTabBar()}
        <main class="spatial-stage">${mainView}</main>
      `;
    } else {
      deskEl.style.display = 'none';
      mobEl.style.display = 'flex';
      mobEl.innerHTML = renderMobileFrame();
    }

    overlayEl.innerHTML = renderOverlays();
    updateDynamicAurora();
    requestAnimationFrame(hydrateAllCanvases);
  }

  /* =========================================================
   * 16. EVENT DELEGATION & INTERACTIVE HANDLERS
   * ========================================================= */
  document.addEventListener('click', (ev) => {
    const actionEl = ev.target.closest('[data-action]');
    if (!actionEl) return;

    // Prevent card click when clicking embedded copybar or quick buttons
    if (actionEl.closest('[data-stop-card]') || actionEl.classList.contains('card-icon-pill') || actionEl.classList.contains('recipe-tab-close') || actionEl.classList.contains('snippet-dissolve-btn')) {
      ev.stopPropagation();
    }

    const act = actionEl.getAttribute('data-action');
    const id = actionEl.getAttribute('data-id');

    switch (act) {
      case 'switch-tab':
        STATE.activeTab = actionEl.getAttribute('data-tab');
        renderAll();
        break;
      case 'close-tab':
        closeRecipeTab(actionEl.getAttribute('data-tab'));
        break;
      case 'open-recipe-tab':
        openRecipeTab(id);
        break;
      case 'set-viewport':
        STATE.viewportMode = actionEl.getAttribute('data-vp');
        renderAll();
        break;
      case 'toggle-xray-overlay':
        STATE.xray.overlayOpen = !STATE.xray.overlayOpen;
        renderAll();
        break;
      case 'set-gmode':
        STATE.galleryMode = actionEl.getAttribute('data-gmode');
        renderAll();
        break;
      case 'set-mfilter':
        STATE.modelFilter = actionEl.getAttribute('data-mid');
        renderAll();
        break;
      case 'set-variant': {
        const r = getRecipe(id);
        r.activeVariant = Number(actionEl.getAttribute('data-vidx')) || 0;
        renderAll();
        break;
      }
      case 'select-filmstrip':
        STATE.filmstripId = id;
        renderAll();
        break;
      case 'filmstrip-step': {
        const pool = getFilteredRecipes();
        const arr = pool.length ? pool : STATE.recipes;
        const idx = arr.findIndex(r => r.id === STATE.filmstripId);
        const dir = Number(actionEl.getAttribute('data-dir')) || 1;
        const next = arr[(idx + dir + arr.length) % arr.length];
        if (next) STATE.filmstripId = next.id;
        renderAll();
        break;
      }
      case 'send-to-arena':
        if (STATE.arena.leftId === id) {
          STATE.galleryMode = 'arena';
          STATE.activeTab = 'gallery';
        } else {
          STATE.arena.rightId = id;
          STATE.galleryMode = 'arena';
          STATE.activeTab = 'gallery';
        }
        renderAll();
        showToast(`已载入 A/B 双卡对比竞技场`);
        break;
      case 'arena-swap': {
        const tmp = STATE.arena.leftId;
        STATE.arena.leftId = STATE.arena.rightId;
        STATE.arena.rightId = tmp;
        renderAll();
        break;
      }
      case 'arena-toggle-diff':
        STATE.arena.diffOnly = !STATE.arena.diffOnly;
        renderAll();
        break;
      case 'quick-copy-pos':
      case 'quick-copy-neg': {
        const r = getRecipe(id);
        const sc = getSchema(r.schemaId);
        const snMap = getSnippetsMap();
        const isPos = act === 'quick-copy-pos';
        const txt = compileNodes(isPos ? r.posNodes : r.negNodes, sc.dialect, snMap, true);
        copyText(txt, `已复制${isPos ? '正面' : '负面'}提示词 (${DIALECTS[sc.dialect].short})`);
        break;
      }
      case 'copy-zone-prompt': {
        const zone = actionEl.getAttribute('data-zone');
        const r = getRecipe(id);
        const sc = getSchema(r.schemaId);
        const txt = compileNodes(zone === 'neg' ? r.negNodes : r.posNodes, sc.dialect, getSnippetsMap(), true);
        copyText(txt, `已复制${zone === 'neg' ? '负面' : '正面'}提示词`);
        break;
      }
      case 'copy-raw-text':
        copyText(actionEl.getAttribute('data-text'), actionEl.getAttribute('data-label') || '已复制');
        break;
      case 'open-dialect-modal':
        STATE.modal = { type: 'dialect-copy', recipeId: id, zone: actionEl.getAttribute('data-zone') || 'pos' };
        renderAll();
        break;
      case 'open-import-snippet':
        STATE.modal = { type: 'import-snippet', recipeId: id, zone: actionEl.getAttribute('data-zone') || 'pos' };
        renderAll();
        break;
      case 'open-clone-modal':
        STATE.modal = { type: 'clone-model', recipeId: id, putInArenaRight: false };
        renderAll();
        break;
      case 'open-clone-arena-modal':
        STATE.modal = { type: 'clone-model', recipeId: id, putInArenaRight: true };
        renderAll();
        break;
      case 'confirm-clone-model':
        cloneRecipeToModel(id, actionEl.getAttribute('data-scid'), { putInArenaRight: actionEl.getAttribute('data-arena') === '1' });
        break;
      case 'confirm-import-snippets': {
        const r = getRecipe(id);
        const zone = actionEl.getAttribute('data-zone');
        const checks = Array.from(document.querySelectorAll('input[name="importSnipCheck"]:checked')).map(c => c.value);
        if (!checks.length) {
          showToast('请至少勾选一条提示词积木');
          return;
        }
        const targetArr = zone === 'neg' ? r.negNodes : r.posNodes;
        checks.forEach(sid => targetArr.push(snipRef(sid)));
        STATE.modal = null;
        renderAll();
        showToast(`已导入 ${checks.length} 个 [🧩 积木块]`);
        break;
      }
      case 'close-modal':
        STATE.modal = null;
        renderAll();
        break;
      case 'close-modal-bg':
        if (ev.target === actionEl) {
          STATE.modal = null;
          renderAll();
        }
        break;
      case 'toggle-weaver-mode': {
        const zone = actionEl.getAttribute('data-zone');
        const mode = actionEl.getAttribute('data-mode');
        const ed = ensureRecipeEditorState(id);
        if (zone === 'pos') ed.posMode = mode;
        else ed.negMode = mode;
        renderAll();
        break;
      }
      case 'select-capsule': {
        const zone = actionEl.getAttribute('data-zone');
        const nid = actionEl.getAttribute('data-nid');
        const ed = ensureRecipeEditorState(id);
        ed.selectedZone = zone;
        ed.selectedNodeId = ed.selectedNodeId === nid ? null : nid;
        renderAll();
        break;
      }
      case 'adjust-weight': {
        const r = getRecipe(id);
        const zone = actionEl.getAttribute('data-zone');
        const nid = actionEl.getAttribute('data-nid');
        const delta = Number(actionEl.getAttribute('data-delta'));
        const arr = zone === 'neg' ? r.negNodes : r.posNodes;
        const node = arr.find(n => n.id === nid);
        if (node && node.type === 'token') {
          node.weight = Number(Math.max(0.2, Math.min(2.5, (node.weight || 1.0) + delta)).toFixed(2));
          renderAll();
        }
        break;
      }
      case 'toggle-mute-node': {
        const r = getRecipe(id);
        const zone = actionEl.getAttribute('data-zone');
        const nid = actionEl.getAttribute('data-nid');
        const arr = zone === 'neg' ? r.negNodes : r.posNodes;
        const node = arr.find(n => n.id === nid);
        if (node) {
          node.muted = !node.muted;
          renderAll();
        }
        break;
      }
      case 'remove-node': {
        const r = getRecipe(id);
        const zone = actionEl.getAttribute('data-zone');
        const nid = actionEl.getAttribute('data-nid');
        if (zone === 'neg') r.negNodes = r.negNodes.filter(n => n.id !== nid);
        else r.posNodes = r.posNodes.filter(n => n.id !== nid);
        renderAll();
        break;
      }
      case 'move-node': {
        const r = getRecipe(id);
        const zone = actionEl.getAttribute('data-zone');
        const nid = actionEl.getAttribute('data-nid');
        const dir = Number(actionEl.getAttribute('data-dir'));
        const arr = zone === 'neg' ? r.negNodes : r.posNodes;
        const idx = arr.findIndex(n => n.id === nid);
        const target = idx + dir;
        if (idx >= 0 && target >= 0 && target < arr.length) {
          const item = arr.splice(idx, 1)[0];
          arr.splice(target, 0, item);
          renderAll();
        }
        break;
      }
      case 'dissolve-snippet': {
        const r = getRecipe(id);
        const zone = actionEl.getAttribute('data-zone');
        const nid = actionEl.getAttribute('data-nid');
        const arr = zone === 'neg' ? r.negNodes : r.posNodes;
        const idx = arr.findIndex(n => n.id === nid);
        if (idx >= 0 && arr[idx].type === 'snippet') {
          const sn = getSnippetsMap()[arr[idx].snippetId];
          const unpacked = sn ? sn.nodes.map(sub => tok(sub.text, sub.weight, sub.muted)) : [];
          arr.splice(idx, 1, ...unpacked);
          renderAll();
          showToast(`已打散积木块为 ${unpacked.length} 个独立词条胶囊`);
        }
        break;
      }
      case 'add-token-prompt': {
        const r = getRecipe(id);
        const zone = actionEl.getAttribute('data-zone');
        const txt = window.prompt('输入新词条（例如 rim lighting 或 (soft_glow:1.15)）：', 'dramatic_rim_light');
        if (txt && txt.trim()) {
          const parsed = parsePromptToNodes(txt);
          (zone === 'neg' ? r.negNodes : r.posNodes).push(...parsed);
          renderAll();
        }
        break;
      }
      case 'param-toggle': {
        const r = getRecipe(id);
        const k = actionEl.getAttribute('data-key');
        r.params[k] = !r.params[k];
        renderAll();
        break;
      }
      case 'param-res': {
        const r = getRecipe(id);
        const k = actionEl.getAttribute('data-key');
        r.params[k] = actionEl.getAttribute('data-res');
        renderAll();
        break;
      }
      case 'add-lora': {
        const r = getRecipe(id);
        const name = window.prompt('LoRA 文件或参考名称：', 'Style_Glow_v1');
        if (name && name.trim()) {
          const trigger = window.prompt('触发词 (Trigger Word)：', 'luminous brush') || '';
          r.loras.push({ name: name.trim(), trigger: trigger.trim(), weight: 0.75, enabled: true });
          renderAll();
        }
        break;
      }
      case 'remove-lora': {
        const r = getRecipe(id);
        r.loras.splice(Number(actionEl.getAttribute('data-lidx')), 1);
        renderAll();
        break;
      }
      case 'new-blank-recipe': {
        const nr = {
          id: uid('rec'),
          title: `新建画风配方 #${STATE.recipes.length + 1}`,
          schemaId: 'nai-v45',
          aspect: '2:3',
          artTheme: 'astro_observatory',
          tags: ['自定义'],
          notes: '新建空白空间玻璃画风配方卡片。',
          posNodes: [tok('1girl', 1.0), tok('starlight_aurora', 1.15)],
          negNodes: [snipRef('snip-nai-neg')],
          params: { steps: 28, cfg: 5.5, sampler: 'k_euler_ancestral', smea: true, smea_dyn: true, rescale: 0.15, vibe_strength: 0.5, resolution: '832x1216' },
          loras: [],
          variants: [
            { name: '星幕极光', seed: Date.now() % 99999, p1: '#0C0F26', p2: '#7C83FD', p3: '#2DD4BF' },
            { name: '暮光琥珀', seed: (Date.now() + 77) % 99999, p1: '#161124', p2: '#FBBF24', p3: '#A78BFA' }
          ],
          activeVariant: 0
        };
        STATE.recipes.unshift(nr);
        openRecipeTab(nr.id);
        showToast('已创建空白画风配方并打开工作标签');
        break;
      }
      case 'set-snip-cat':
        STATE.snippetEditor.catFilter = actionEl.getAttribute('data-cat');
        renderAll();
        break;
      case 'select-snippet':
        STATE.snippetEditor.selectedId = actionEl.getAttribute('data-sid');
        renderAll();
        break;
      case 'create-snippet': {
        const ns = {
          id: uid('snip'),
          name: `自定义积木 #${STATE.snippets.length + 1}`,
          category: '光影氛围',
          modelNote: '通用提示词片段',
          nodes: [tok('soft volumetric glow', 1.1), tok('delicate rim light', 1.0)]
        };
        STATE.snippets.unshift(ns);
        STATE.snippetEditor.selectedId = ns.id;
        renderAll();
        showToast('已新建提示词积木');
        break;
      }
      case 'copy-snippet-text': {
        const sn = getSnippetsMap()[actionEl.getAttribute('data-sid')];
        if (sn) copyText(sn.nodes.map(n => formatTokenForDialect(n.text, n.weight, 'sdxl')).join(', '), `已复制积木「${sn.name}」`);
        break;
      }
      case 'xray-load-sample': {
        const sp = XRAY_SAMPLES.find(x => x.id === actionEl.getAttribute('data-sid'));
        if (sp) {
          STATE.xray.activeSampleId = sp.id;
          STATE.xray.customFileName = '';
          STATE.xray.parsedData = JSON.parse(JSON.stringify(sp));
          STATE.xray.activeStageIdx = 0;
          renderAll();
        }
        break;
      }
      case 'xray-select-stage':
        STATE.xray.activeStageIdx = Number(actionEl.getAttribute('data-idx')) || 0;
        renderAll();
        break;
      case 'xray-import-clean':
      case 'xray-import-with-prompts': {
        const parsed = STATE.xray.parsedData;
        const st = parsed.stages[STATE.xray.activeStageIdx || 0];
        const sc = getSchema(parsed.suggestedSchemaId || 'nai-v45');
        const withPrompts = act === 'xray-import-with-prompts';
        const nr = {
          id: uid('rec'),
          title: `${parsed.label.split('.')[0].slice(0, 16)} · X-Ray 导入`,
          schemaId: sc.id,
          aspect: parsed.aspect || '2:3',
          artTheme: parsed.artTheme || 'cathedral_tyndall',
          tags: ['X-Ray 导入', sc.name],
          notes: withPrompts ? '从 X-Ray 透镜带入封面、参数与原始咒语。' : '从 X-Ray 透镜仅带入封面图与采样参数（未污染提示词）。',
          posNodes: withPrompts ? parsePromptToNodes(st.positive) : [],
          negNodes: withPrompts ? parsePromptToNodes(st.negative) : [],
          params: {
            steps: Number(st.steps) || 28,
            cfg: Number(st.cfg) || 5.0,
            sampler: st.sampler || 'euler',
            scheduler: st.scheduler || 'normal',
            resolution: st.resolution || '832x1216',
            ...(st.extra || {})
          },
          loras: (st.loras || []).map(l => ({ name: l.name, trigger: '', weight: l.weight || 0.75, enabled: true })),
          variants: [parsed.variant, { name: '备选冷调', seed: (parsed.variant.seed || 100) + 9, p1: '#0C162D', p2: '#2DD4BF', p3: '#7C83FD' }],
          activeVariant: 0
        };
        STATE.recipes.unshift(nr);
        STATE.xray.overlayOpen = false;
        openRecipeTab(nr.id);
        showToast(withPrompts ? '已带入封面、参数与词条新建标签' : '已仅带入封面与参数新建标签（提示词洁净）');
        break;
      }
      case 'select-schema':
        STATE.schemaEditor.selectedId = actionEl.getAttribute('data-scid');
        renderAll();
        break;
      case 'clone-schema': {
        const src = getSchema(actionEl.getAttribute('data-scid'));
        const cloned = JSON.parse(JSON.stringify(src));
        cloned.id = uid('schema');
        cloned.name = `${src.name} (自定义)`;
        cloned.platform = 'Custom';
        cloned.summary = `基于 ${src.name} 克隆的可扩展自定义模型模板`;
        STATE.schemas.push(cloned);
        STATE.schemaEditor.selectedId = cloned.id;
        renderAll();
        showToast(`已克隆底模「${cloned.name}」，现已可在所有配方与对比中选用`);
        break;
      }
      case 'create-custom-schema': {
        const ns = {
          id: uid('schema'),
          name: `自定义底模 #${STATE.schemas.length + 1}`,
          platform: 'Custom',
          color: '#34D399',
          dialect: 'sdxl',
          summary: '用户新建自定义底模 Schema 模板',
          fields: [
            { key: 'steps', label: 'Steps 步数', group: '采样核心', type: 'slider', min: 5, max: 60, step: 1, safeMin: 20, safeMax: 30, default: 25 },
            { key: 'cfg', label: 'CFG Scale', group: '采样核心', type: 'slider', min: 1, max: 12, step: 0.5, safeMin: 3.5, safeMax: 6.0, default: 4.5 },
            { key: 'resolution', label: '画幅分辨率', group: '画幅配置', type: 'resolution', presets: ['832x1216', '1024x1024', '1216x832'], default: '832x1216' }
          ]
        };
        STATE.schemas.push(ns);
        STATE.schemaEditor.selectedId = ns.id;
        renderAll();
        showToast('已新建自定义底模 Schema');
        break;
      }
      case 'open-add-field-modal': {
        const sc = getSchema(actionEl.getAttribute('data-scid'));
        const label = window.prompt('输入新参数显示名称（如 Denoise 强度）：', 'Detailer Denoise');
        if (label && label.trim()) {
          const key = label.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_') || uid('f');
          sc.fields.push({ key, label: label.trim(), group: '自定义扩展', type: 'slider', min: 0, max: 1, step: 0.05, safeMin: 0.25, safeMax: 0.55, default: 0.4 });
          renderAll();
          showToast(`已为 ${sc.name} 新增参数「${label.trim()}」`);
        }
        break;
      }
      case 'remove-schema-field': {
        const sc = getSchema(actionEl.getAttribute('data-scid'));
        sc.fields.splice(Number(actionEl.getAttribute('data-fidx')), 1);
        renderAll();
        break;
      }
      case 'sync-preset': {
        const preset = actionEl.getAttribute('data-preset');
        STATE.sync.preset = preset;
        if (preset === 'koofr') STATE.sync.endpoint = 'https://app.koofr.net/dav/Koofr';
        else if (preset === 'jianguoyun') STATE.sync.endpoint = 'https://dav.jianguoyun.com/dav';
        renderAll();
        break;
      }
      case 'sync-test':
        STATE.sync.testLog = `✓ HTTPS TLS 1.3 握手成功 → PROPFIND ${STATE.sync.endpoint}${STATE.sync.remoteDir} (207 Multi-Status, 46ms) · blobs/ 可读写`;
        renderAll();
        showToast('WebDAV 连接测试通过');
        break;
      case 'sync-run': {
        const totalImgs = STATE.recipes.reduce((a, r) => a + r.variants.length, 0);
        const nowStr = new Date().toTimeString().slice(0, 8);
        STATE.sync.lastSyncText = `已同步 ${nowStr}`;
        STATE.sync.testLog = `✓ 增量同步完成：已校验 ${totalImgs} 张变体图 SHA-256 哈希，上传 1 个新增 blob，合并 records/snapshot.json.gz (耗时 310ms)`;
        renderAll();
        showToast('WebDAV 增量同步完成');
        break;
      }
      case 'slpack-scope':
        STATE.sync.slpackScope = actionEl.getAttribute('data-scope');
        renderAll();
        break;
      case 'export-slpack': {
        const packRecipes = STATE.sync.slpackScope === 'all'
          ? STATE.recipes
          : STATE.recipes.filter(r => STATE.sync.selectedForPack.includes(r.id));
        const manifest = {
          format: 'styleloom-slpack',
          version: '1.0',
          exportedAt: new Date().toISOString(),
          recipeCount: packRecipes.length,
          snippetCount: STATE.snippets.length
        };
        const blob = buildZipArchive([
          { name: 'manifest.json', content: JSON.stringify(manifest, null, 2) },
          { name: 'recipes.json', content: JSON.stringify(packRecipes, null, 2) },
          { name: 'snippets.json', content: JSON.stringify(STATE.snippets, null, 2) },
          { name: 'schemas.json', content: JSON.stringify(STATE.schemas, null, 2) }
        ]);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `styleloom-backup-${packRecipes.length}cards.slpack`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`已导出 .slpack 离线压缩包（含 ${packRecipes.length} 张配方）`);
        break;
      }
      case 'mobile-route':
        STATE.mobileRoute = actionEl.getAttribute('data-route');
        STATE.mobileSheetRecipeId = null;
        renderAll();
        break;
      case 'close-mobile-sheet':
        STATE.mobileSheetRecipeId = null;
        renderAll();
        break;
    }
  });

  // Live Input / Change Listeners (preserving focus for sliders & search!)
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'gallerySearchInput' || t.id === 'mobileSearchInput') {
      STATE.searchQuery = t.value;
      if (STATE.viewportMode === 'desktop') {
        const area = document.getElementById('galleryContentArea');
        if (area) {
          area.innerHTML = renderGalleryBody(getFilteredRecipes());
          requestAnimationFrame(hydrateAllCanvases);
        }
      } else {
        const pos = t.selectionStart;
        renderAll();
        const re = document.getElementById('mobileSearchInput');
        if (re) { re.focus(); re.setSelectionRange(pos, pos); }
      }
      return;
    }
    if (t.id === 'snippetSearchInput') {
      STATE.snippetEditor.search = t.value;
      const pos = t.selectionStart;
      renderAll();
      const re = document.getElementById('snippetSearchInput');
      if (re) { re.focus(); re.setSelectionRange(pos, pos); }
      return;
    }

    const act = t.getAttribute('data-action');
    if (act === 'param-range') {
      const id = t.getAttribute('data-id');
      const key = t.getAttribute('data-key');
      const val = Number(t.value);
      const r = getRecipe(id);
      r.params[key] = val;
      const valEl = document.querySelector(`[data-param-val="${id}:${key}"]`);
      if (valEl) valEl.textContent = String(val);
      const smin = t.getAttribute('data-smin');
      const smax = t.getAttribute('data-smax');
      const box = document.querySelector(`[data-param-box="${id}:${key}"]`);
      const warn = document.querySelector(`[data-param-warn="${id}:${key}"]`);
      if (smin !== '' && smax !== '' && box) {
        const out = val < Number(smin) || val > Number(smax);
        box.classList.toggle('warn', out);
        if (warn) warn.textContent = out ? '⚠ 超出推荐范围' : '';
      }
    } else if (act === 'lora-weight') {
      const id = t.getAttribute('data-id');
      const idx = Number(t.getAttribute('data-lidx'));
      const r = getRecipe(id);
      r.loras[idx].weight = Number(t.value);
      const lv = document.querySelector(`[data-lora-val="${id}:${idx}"]`);
      if (lv) lv.textContent = String(t.value);
    } else if (act === 'edit-snippet-content') {
      const sn = getSnippetsMap()[t.getAttribute('data-sid')];
      if (sn) {
        sn.nodes = parsePromptToNodes(t.value);
      }
    } else if (act === 'edit-snippet-field') {
      const sn = getSnippetsMap()[t.getAttribute('data-sid')];
      if (sn) sn[t.getAttribute('data-field')] = t.value;
    } else if (act === 'edit-recipe-title') {
      const r = getRecipe(t.getAttribute('data-id'));
      r.title = t.value;
    } else if (act === 'sync-input') {
      STATE.sync[t.getAttribute('data-field')] = t.value;
    }
  });

  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'xrayFileInput' && t.files && t.files[0]) {
      handleLocalXRayFile(t.files[0]);
      return;
    }
    if (t.id === 'slpackImportInput' && t.files && t.files[0]) {
      const f = t.files[0];
      showToast(`已导入 ${f.name}，校验 SHA-256 去重完毕`);
      return;
    }
    const act = t.getAttribute('data-action');
    if (act === 'arena-pick') {
      const slot = t.getAttribute('data-slot');
      if (slot === 'left') STATE.arena.leftId = t.value;
      else STATE.arena.rightId = t.value;
      renderAll();
    } else if (act === 'param-select') {
      const r = getRecipe(t.getAttribute('data-id'));
      r.params[t.getAttribute('data-key')] = t.value;
      renderAll();
    } else if (act === 'source-edit') {
      const r = getRecipe(t.getAttribute('data-id'));
      const zone = t.getAttribute('data-zone');
      const parsed = parsePromptToNodes(t.value);
      if (zone === 'neg') r.negNodes = parsed;
      else r.posNodes = parsed;
    } else if (act === 'edit-snippet-content' || act === 'edit-snippet-field' || act === 'edit-recipe-title') {
      renderAll();
    } else if (act === 'edit-schema-meta') {
      const sc = getSchema(t.getAttribute('data-scid'));
      sc[t.getAttribute('data-field')] = t.value;
      renderAll();
    } else if (act === 'toggle-pack-item') {
      const id = t.getAttribute('data-id');
      const idx = STATE.sync.selectedForPack.indexOf(id);
      if (t.checked && idx === -1) STATE.sync.selectedForPack.push(id);
      else if (!t.checked && idx !== -1) STATE.sync.selectedForPack.splice(idx, 1);
    }
  });

  // Drag & Drop for Capsules and X-Ray Files
  let draggedCapsule = null;
  document.addEventListener('dragstart', (ev) => {
    const cap = ev.target.closest('[data-drag-node]');
    if (!cap) return;
    draggedCapsule = {
      nodeId: cap.getAttribute('data-drag-node'),
      zone: cap.getAttribute('data-drag-zone'),
      recipeId: cap.getAttribute('data-recipe-id')
    };
  });

  document.addEventListener('dragover', (ev) => {
    const dz = ev.target.closest('#xrayDropZone');
    if (dz) {
      ev.preventDefault();
      dz.classList.add('dragover');
    }
    if (draggedCapsule && ev.target.closest('[data-drop-zone]')) {
      ev.preventDefault();
    }
  });

  document.addEventListener('dragleave', (ev) => {
    const dz = ev.target.closest('#xrayDropZone');
    if (dz) dz.classList.remove('dragover');
  });

  document.addEventListener('drop', (ev) => {
    const dz = ev.target.closest('#xrayDropZone');
    if (dz) {
      ev.preventDefault();
      dz.classList.remove('dragover');
      if (ev.dataTransfer.files && ev.dataTransfer.files[0]) {
        handleLocalXRayFile(ev.dataTransfer.files[0]);
      }
      return;
    }

    if (draggedCapsule) {
      const targetCap = ev.target.closest('[data-drag-node]');
      const tray = ev.target.closest('[data-drop-zone]');
      if (tray && tray.getAttribute('data-recipe-id') === draggedCapsule.recipeId && tray.getAttribute('data-drop-zone') === draggedCapsule.zone) {
        ev.preventDefault();
        const r = getRecipe(draggedCapsule.recipeId);
        const arr = draggedCapsule.zone === 'neg' ? r.negNodes : r.posNodes;
        const fromIdx = arr.findIndex(n => n.id === draggedCapsule.nodeId);
        const toIdx = targetCap ? arr.findIndex(n => n.id === targetCap.getAttribute('data-drag-node')) : arr.length - 1;
        if (fromIdx >= 0 && toIdx >= 0 && fromIdx !== toIdx) {
          const moved = arr.splice(fromIdx, 1)[0];
          arr.splice(toIdx, 0, moved);
          renderAll();
        }
      }
      draggedCapsule = null;
    }
  });

  // Keyboard navigation in Filmstrip & Escape for Overlay
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (STATE.modal) { STATE.modal = null; renderAll(); return; }
      if (STATE.xray.overlayOpen) { STATE.xray.overlayOpen = false; renderAll(); return; }
    }
    if (STATE.activeTab === 'gallery' && STATE.galleryMode === 'filmstrip' && document.activeElement.tagName !== 'INPUT') {
      if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
        const pool = getFilteredRecipes();
        const arr = pool.length ? pool : STATE.recipes;
        const idx = arr.findIndex(r => r.id === STATE.filmstripId);
        const dir = ev.key === 'ArrowRight' ? 1 : -1;
        const next = arr[(idx + dir + arr.length) % arr.length];
        if (next) { STATE.filmstripId = next.id; renderAll(); }
      }
    }
  });

  window.addEventListener('resize', () => {
    hydrateAllCanvases();
  });

  renderAll();
})();
</script>
</body>
</html>
