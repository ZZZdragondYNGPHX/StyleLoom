<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleLoom 画风织机 · 星幕工坊 Spatial Workbench</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #080C14;
    color: #F8FAFC;
    font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .sl-spatial {
    --sl-bg: #080C14;
    --sl-glass-1: rgba(17, 24, 39, 0.72);
    --sl-glass-2: rgba(26, 35, 56, 0.62);
    --sl-glass-3: rgba(36, 48, 76, 0.56);
    --sl-glass-hover: rgba(45, 60, 94, 0.72);
    --sl-border: rgba(255, 255, 255, 0.08);
    --sl-border-strong: rgba(255, 255, 255, 0.14);
    --sl-refract-top: rgba(255, 255, 255, 0.13);
    --sl-text: #F8FAFC;
    --sl-text-sub: #94A3B8;
    --sl-text-dim: #64748B;
    --sl-accent: #7C83FD;
    --sl-accent-soft: rgba(124, 131, 253, 0.18);
    --sl-mint: #2DD4BF;
    --sl-mint-soft: rgba(45, 212, 191, 0.16);
    --sl-amber: #FBBF24;
    --sl-amber-soft: rgba(251, 191, 36, 0.16);
    --sl-rose: #FB7185;
    --sl-rose-soft: rgba(251, 113, 133, 0.16);
    --sl-blur: blur(22px);
    --sl-mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sl-shadow-glass: 0 18px 46px rgba(2, 6, 17, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.13);
    --sl-shadow-card: 0 12px 32px rgba(2, 6, 17, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.13);
    --sl-r-xl: 20px;
    --sl-r-lg: 15px;
    --sl-r-md: 11px;
    --sl-r-sm: 8px;

    position: relative;
    min-height: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--sl-bg);
    color: var(--sl-text);
    box-sizing: border-box;
  }

  .sl-spatial *, .sl-spatial *::before, .sl-spatial *::after {
    box-sizing: border-box;
  }

  /* Custom scrollbars */
  .sl-spatial ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  .sl-spatial ::-webkit-scrollbar-track {
    background: transparent;
  }
  .sl-spatial ::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.22);
    border-radius: 999px;
  }
  .sl-spatial ::-webkit-scrollbar-thumb:hover {
    background: rgba(124, 131, 253, 0.45);
  }

  /* Deep-sea Starlight Aurora Backdrop */
  .aurora-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .aurora-spot {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.52;
    transition: background 0.8s ease, transform 1.2s ease, opacity 0.6s ease;
  }
  .aurora-spot-indigo {
    width: 58vw;
    height: 52vh;
    left: -12vw;
    top: -16vh;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.24) 0%, rgba(124, 131, 253, 0.08) 48%, transparent 72%);
  }
  .aurora-spot-mint {
    width: 52vw;
    height: 48vh;
    right: -10vw;
    bottom: -14vh;
    background: radial-gradient(circle, rgba(45, 212, 191, 0.16) 0%, rgba(45, 212, 191, 0.05) 48%, transparent 72%);
  }
  .aurora-spot-dynamic {
    width: 44vw;
    height: 44vh;
    left: 28vw;
    top: 18vh;
    opacity: 0.28;
    background: radial-gradient(circle, rgba(124, 131, 253, 0.18) 0%, transparent 70%);
  }
  .star-dust {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 14% 22%, rgba(248, 250, 252, 0.22), transparent),
      radial-gradient(1px 1px at 38% 12%, rgba(45, 212, 191, 0.2), transparent),
      radial-gradient(1px 1px at 67% 31%, rgba(248, 250, 252, 0.18), transparent),
      radial-gradient(1.2px 1.2px at 84% 18%, rgba(124, 131, 253, 0.25), transparent),
      radial-gradient(1px 1px at 22% 76%, rgba(248, 250, 252, 0.15), transparent),
      radial-gradient(1px 1px at 78% 82%, rgba(45, 212, 191, 0.16), transparent);
    opacity: 0.7;
  }

  /* Glass utility surfaces */
  .glass-panel {
    background: var(--sl-glass-1);
    backdrop-filter: var(--sl-blur);
    -webkit-backdrop-filter: var(--sl-blur);
    border: 1px solid var(--sl-border);
    border-top: 1px solid var(--sl-refract-top);
    box-shadow: var(--sl-shadow-glass);
  }
  .glass-sub {
    background: var(--sl-glass-2);
    backdrop-filter: var(--sl-blur);
    -webkit-backdrop-filter: var(--sl-blur);
    border: 1px solid var(--sl-border);
    border-top: 1px solid var(--sl-refract-top);
  }

  /* Top Spatial Multi-Tab Bar (Figma / Arc hybrid) */
  .spatial-tabbar {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: rgba(11, 16, 28, 0.84);
    backdrop-filter: var(--sl-blur);
    -webkit-backdrop-filter: var(--sl-blur);
    border-bottom: 1px solid var(--sl-border);
    box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    flex-shrink: 0;
  }
  .brand-mark {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px 5px 6px;
    border-radius: 10px;
    background: rgba(124, 131, 253, 0.12);
    border: 1px solid rgba(124, 131, 253, 0.28);
    border-top-color: rgba(255, 255, 255, 0.16);
    flex-shrink: 0;
  }
  .brand-orb {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: linear-gradient(135deg, #7C83FD 0%, #2DD4BF 100%);
    display: grid;
    place-items: center;
    color: #080C14;
    box-shadow: 0 0 14px rgba(124, 131, 253, 0.45);
  }
  .brand-name {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--sl-text);
  }
  .brand-tag {
    font-size: 10px;
    color: var(--sl-mint);
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .tab-home-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 33px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--sl-border);
    border-top-color: var(--sl-refract-top);
    background: var(--sl-glass-2);
    color: var(--sl-text-sub);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.18s ease;
  }
  .tab-home-btn:hover {
    color: var(--sl-text);
    background: var(--sl-glass-hover);
  }
  .tab-home-btn.active {
    background: linear-gradient(180deg, rgba(124, 131, 253, 0.28) 0%, rgba(124, 131, 253, 0.14) 100%);
    border-color: rgba(124, 131, 253, 0.5);
    border-top-color: rgba(255, 255, 255, 0.25);
    color: #FFFFFF;
    box-shadow: 0 6px 18px rgba(124, 131, 253, 0.22);
  }

  .tab-count-pill {
    font-size: 10.5px;
    font-family: var(--sl-mono);
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--sl-text-sub);
  }
  .tab-home-btn.active .tab-count-pill {
    background: rgba(255, 255, 255, 0.18);
    color: #fff;
  }

  .recipe-tabs-strip {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    padding: 2px 2px;
    scrollbar-width: none;
  }
  .recipe-tabs-strip::-webkit-scrollbar {
    display: none;
  }

  .recipe-tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 33px;
    max-width: 245px;
    padding: 0 8px 0 11px;
    border-radius: 10px;
    border: 1px solid var(--sl-border);
    border-top-color: rgba(255, 255, 255, 0.11);
    background: rgba(26, 35, 56, 0.45);
    color: var(--sl-text-sub);
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.18s ease;
  }
  .recipe-tab:hover {
    background: rgba(34, 48, 78, 0.65);
    color: var(--sl-text);
  }
  .recipe-tab.active {
    background: rgba(26, 35, 56, 0.88);
    border-color: rgba(124, 131, 253, 0.46);
    border-top-color: rgba(255, 255, 255, 0.22);
    color: var(--sl-text);
    box-shadow: 0 6px 18px rgba(4, 9, 24, 0.45), inset 0 1px 0 rgba(124, 131, 253, 0.26);
  }
  .recipe-tab-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .recipe-tab-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .recipe-tab-model {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--sl-text-sub);
    flex-shrink: 0;
  }
  .recipe-tab.active .recipe-tab-model {
    background: rgba(124, 131, 253, 0.2);
    color: #C7D2FE;
  }
  .recipe-tab-close {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--sl-text-dim);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s ease;
    padding: 0;
  }
  .recipe-tab-close:hover {
    background: rgba(251, 113, 133, 0.22);
    color: var(--sl-rose);
  }

  /* 4 Utility Notches */
  .utility-notches {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px;
    border-radius: 12px;
    background: rgba(17, 24, 39, 0.72);
    border: 1px solid var(--sl-border);
    border-top-color: var(--sl-refract-top);
    flex-shrink: 0;
  }
  .notch-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 27px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--sl-text-sub);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.16s ease;
  }
  .notch-btn:hover {
    color: var(--sl-text);
    background: rgba(255, 255, 255, 0.06);
  }
  .notch-btn.active {
    background: rgba(45, 212, 191, 0.16);
    border-color: rgba(45, 212, 191, 0.35);
    color: #99F6E4;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
  }
  .xray-summon-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 32px;
    padding: 0 11px;
    border-radius: 10px;
    border: 1px solid rgba(45, 212, 191, 0.34);
    border-top-color: rgba(255, 255, 255, 0.2);
    background: linear-gradient(135deg, rgba(45, 212, 191, 0.16), rgba(124, 131, 253, 0.16));
    color: #E2E8F0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .xray-summon-btn:hover {
    box-shadow: 0 0 18px rgba(45, 212, 191, 0.24);
    transform: translateY(-1px);
  }
  .xray-summon-btn.active {
    background: linear-gradient(135deg, rgba(45, 212, 191, 0.32), rgba(124, 131, 253, 0.3));
    color: #FFFFFF;
  }

  .viewport-toggle {
    display: inline-flex;
    align-items: center;
    padding: 3px;
    border-radius: 10px;
    background: rgba(17, 24, 39, 0.78);
    border: 1px solid var(--sl-border);
    border-top-color: var(--sl-refract-top);
  }
  .vp-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 26px;
    padding: 0 9px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--sl-text-sub);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.16s ease;
  }
  .vp-btn.active {
    background: var(--sl-accent);
    color: #FFFFFF;
    box-shadow: 0 3px 12px rgba(124, 131, 253, 0.4);
  }

  /* Main Workspace Stage */
  .spatial-stage {
    position: relative;
    z-index: 10;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Common Buttons & Inputs */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border-radius: 9px;
    border: 1px solid var(--sl-border-strong);
    border-top-color: rgba(255, 255, 255, 0.18);
    background: rgba(26, 35, 56, 0.72);
    color: var(--sl-text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.16s ease;
    white-space: nowrap;
  }
  .btn:hover {
    background: rgba(42, 56, 88, 0.85);
    border-color: rgba(255, 255, 255, 0.22);
  }
  .btn-sm {
    height: 27px;
    padding: 0 9px;
    font-size: 11.5px;
    border-radius: 7px;
  }
  .btn-xs {
    height: 23px;
    padding: 0 7px;
    font-size: 11px;
    border-radius: 6px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #7C83FD 0%, #6366F1 100%);
    border-color: rgba(165, 180, 252, 0.45);
    color: #FFFFFF;
    box-shadow: 0 4px 16px rgba(124, 131, 253, 0.28);
  }
  .btn-primary:hover {
    filter: brightness(1.08);
    box-shadow: 0 6px 20px rgba(124, 131, 253, 0.38);
  }
  .btn-mint {
    background: rgba(45, 212, 191, 0.18);
    border-color: rgba(45, 212, 191, 0.4);
    color: #99F6E4;
  }
  .btn-mint:hover {
    background: rgba(45, 212, 191, 0.28);
    color: #FFFFFF;
  }
  .btn-amber {
    background: rgba(251, 191, 36, 0.16);
    border-color: rgba(251, 191, 36, 0.38);
    color: #FDE68A;
  }
  .btn-rose {
    background: rgba(251, 113, 133, 0.16);
    border-color: rgba(251, 113, 133, 0.36);
    color: #FECDD3;
  }

  .sl-input, .sl-select, .sl-textarea {
    background: rgba(10, 15, 27, 0.65);
    border: 1px solid var(--sl-border-strong);
    border-radius: 9px;
    color: var(--sl-text);
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }
  .sl-input:focus, .sl-select:focus, .sl-textarea:focus {
    border-color: var(--sl-accent);
    box-shadow: 0 0 0 3px rgba(124, 131, 253, 0.16);
  }
  .sl-input, .sl-select {
    height: 32px;
    padding: 0 10px;
  }
  .sl-textarea {
    padding: 10px;
    resize: vertical;
    line-height: 1.5;
  }

  /* Gallery Toolbar & 3 Modes */
  .gallery-shell {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }
  .gallery-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .gallery-modes {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border-radius: 13px;
    background: var(--sl-glass-1);
    backdrop-filter: var(--sl-blur);
    border: 1px solid var(--sl-border);
    border-top-color: var(--sl-refract-top);
  }
  .gmode-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--sl-text-sub);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .gmode-btn:hover {
    color: var(--sl-text);
  }
  .gmode-btn.active {
    background: linear-gradient(135deg, rgba(124, 131, 253, 0.34), rgba(45, 212, 191, 0.2));
    border-color: rgba(124, 131, 253, 0.45);
    border-top-color: rgba(255, 255, 255, 0.2);
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(124, 131, 253, 0.2);
  }

  .gallery-filters {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    justify-content: flex-end;
    min-width: 260px;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    width: 230px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--sl-text-dim);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding-left: 31px;
  }
  .filter-pills {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    max-width: 520px;
    scrollbar-width: none;
  }
  .filter-pills::-webkit-scrollbar {
    display: none;
  }
  .filter-pill {
    height: 27px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--sl-border);
    background: rgba(17, 24, 39, 0.6);
    color: var(--sl-text-sub);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.16s ease;
  }
  .filter-pill:hover {
    color: var(--sl-text);
    border-color: var(--sl-border-strong);
  }
  .filter-pill.active {
    background: rgba(124, 131, 253, 0.22);
    border-color: rgba(124, 131, 253, 0.52);
    color: #E0E7FF;
  }

  .gallery-content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 18px 22px;
  }

  /* View 1: Aurora Masonry Grid */
  .masonry-columns {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 1320px) {
    .masonry-columns { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 960px) {
    .masonry-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .masonry-col {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }
  .art-card {
    position: relative;
    border-radius: var(--sl-r-lg);
    overflow: hidden;
    background: var(--sl-glass-1);
    border: 1px solid var(--sl-border);
    border-top: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: var(--sl-shadow-card);
    cursor: pointer;
    transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s ease, box-shadow 0.24s ease;
  }
  .art-card:hover {
    transform: translateY(-4px);
    border-color: rgba(124, 131, 253, 0.5);
    box-shadow: 0 22px 44px rgba(2, 6, 17, 0.66), 0 0 28px rgba(124, 131, 253, 0.16);
  }
  .art-card-canvas-wrap {
    position: relative;
    width: 100%;
    background: #0B1120;
    overflow: hidden;
  }
  .art-card-canvas-wrap canvas {
    display: block;
    width: 100%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .art-card:hover .art-card-canvas-wrap canvas {
    transform: scale(1.03);
  }
  .art-card-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8, 12, 20, 0.32) 0%, transparent 28%, transparent 56%, rgba(8, 12, 20, 0.86) 100%);
    pointer-events: none;
  }
  .art-card-top {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
  }
  .model-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(11, 16, 28, 0.68);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: 10.5px;
    font-weight: 600;
    color: #F8FAFC;
    letter-spacing: 0.01em;
  }
  .model-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .art-card-quick-top {
    display: flex;
    gap: 5px;
    opacity: 0;
    transform: translateY(-4px);
    transition: all 0.2s ease;
    pointer-events: auto;
  }
  .art-card:hover .art-card-quick-top {
    opacity: 1;
    transform: translateY(0);
  }
  .card-icon-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 25px;
    padding: 0 8px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(15, 23, 42, 0.78);
    backdrop-filter: blur(16px);
    color: #F8FAFC;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .card-icon-pill:hover {
    background: rgba(124, 131, 253, 0.85);
    border-color: rgba(255, 255, 255, 0.35);
  }

  .art-card-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 11px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .art-card-meta {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
  }
  .art-card-title {
    font-size: 13px;
    font-weight: 600;
    color: #F8FAFC;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    line-height: 1.25;
  }
  .art-card-ratio {
    font-size: 10px;
    font-family: var(--sl-mono);
    color: rgba(226, 232, 240, 0.75);
    background: rgba(15, 23, 42, 0.56);
    padding: 2px 6px;
    border-radius: 5px;
    flex-shrink: 0;
  }
  .art-hover-copybar {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.78);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .art-card:hover .art-hover-copybar {
    opacity: 1;
    transform: translateY(0);
  }
  .copybar-btn {
    flex: 1;
    height: 25px;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.07);
    color: #F8FAFC;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background 0.15s ease;
  }
  .copybar-btn:hover {
    background: rgba(124, 131, 253, 0.42);
  }
  .copybar-btn.mint:hover {
    background: rgba(45, 212, 191, 0.36);
  }

  /* View 2: Stage Filmstrip Mode */
  .filmstrip-stage {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 18px 14px;
    min-height: 0;
  }
  .filmstrip-theater {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--sl-r-xl);
    background: rgba(12, 17, 30, 0.56);
    border: 1px solid var(--sl-border);
    border-top-color: var(--sl-refract-top);
    overflow: hidden;
    padding: 16px;
  }
  .filmstrip-halo {
    position: absolute;
    width: 62%;
    height: 76%;
    border-radius: 50%;
    filter: blur(85px);
    opacity: 0.42;
    pointer-events: none;
    transition: background 0.6s ease;
  }
  .filmstrip-center {
    position: relative;
    z-index: 2;
    height: 100%;
    max-width: 54%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .filmstrip-frame {
    position: relative;
    max-height: calc(100% - 42px);
    max-width: 100%;
    border-radius: 14px;
    padding: 6px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 28px 60px rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .filmstrip-frame canvas {
    display: block;
    border-radius: 10px;
    max-height: 100%;
    max-width: 100%;
  }
  .filmstrip-hud {
    position: absolute;
    top: 16px;
    bottom: 16px;
    width: 270px;
    z-index: 4;
    border-radius: var(--sl-r-lg);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .filmstrip-hud.left { left: 16px; }
  .filmstrip-hud.right { right: 16px; }
  @media (max-width: 1180px) {
    .filmstrip-hud { width: 220px; padding: 11px; }
  }
  .hud-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--sl-text-sub);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .hud-tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .hud-chip {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 7px;
    background: rgba(124, 131, 253, 0.14);
    border: 1px solid rgba(124, 131, 253, 0.28);
    color: #E0E7FF;
    font-family: var(--sl-mono);
  }
  .hud-chip.mint {
    background: rgba(45, 212, 191, 0.14);
    border-color: rgba(45, 212, 191, 0.34);
    color: #99F6E4;
  }
  .hud-param-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
  }
  .hud-param-k { color: var(--sl-text-sub); }
  .hud-param-v { font-family: var(--sl-mono); font-weight: 600; color: var(--sl-text); }

  .filmstrip-rail-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: var(--sl-r-lg);
    flex-shrink: 0;
  }
  .filmstrip-rail {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow-x: auto;
    flex: 1;
    padding: 2px 4px;
  }
  .filmstrip-thumb {
    position: relative;
    width: 86px;
    height: 62px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
    opacity: 0.64;
    transition: all 0.18s ease;
  }
  .filmstrip-thumb:hover {
    opacity: 0.92;
    transform: translateY(-2px);
  }
  .filmstrip-thumb.active {
    opacity: 1;
    border-color: var(--sl-accent);
    box-shadow: 0 0 18px rgba(124, 131, 253, 0.45);
  }
  .filmstrip-thumb canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .filmstrip-thumb-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 2px 5px;
    font-size: 9.5px;
    background: rgba(8, 12, 20, 0.78);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* View 3: A/B Split Arena */
  .arena-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 18px 18px;
    height: 100%;
    overflow-y: auto;
  }
  .arena-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--sl-r-lg);
    flex-wrap: wrap;
  }
  .arena-slot-picker {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .slot-badge {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 800;
  }
  .slot-badge.a { background: rgba(124, 131, 253, 0.25); color: #C7D2FE; border: 1px solid rgba(124, 131, 253, 0.5); }
  .slot-badge.b { background: rgba(45, 212, 191, 0.22); color: #99F6E4; border: 1px solid rgba(45, 212, 191, 0.5); }

  .arena-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .arena-card {
    border-radius: var(--sl-r-xl);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .arena-art-box {
    position: relative;
    height: 300px;
    border-radius: 13px;
    overflow: hidden;
    background: #070B12;
    border: 1px solid var(--sl-border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .arena-art-box canvas {
    max-height: 100%;
    max-width: 100%;
    display: block;
  }
  .arena-diff-section {
    border-radius: var(--sl-r-xl);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .diff-table {
    display: grid;
    grid-template-columns: 155px 1fr 1fr 96px;
    gap: 6px;
    align-items: center;
    font-size: 12px;
  }
  .diff-row-group {
    display: contents;
  }
  .diff-cell {
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid transparent;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .diff-cell.changed {
    background: rgba(251, 191, 36, 0.1);
    border-color: rgba(251, 191, 36, 0.34);
    color: #FEF3C7;
  }
  .diff-cell.exclusive-a {
    background: rgba(124, 131, 253, 0.12);
    border-color: rgba(124, 131, 253, 0.35);
  }
  .diff-cell.exclusive-b {
    background: rgba(45, 212, 191, 0.12);
    border-color: rgba(45, 212, 191, 0.35);
  }
  .diff-status-pill {
    font-size: 10.5px;
    font-weight: 600;
    text-align: center;
    padding: 3px 6px;
    border-radius: 6px;
  }
  .diff-status-pill.same { background: rgba(148, 163, 184, 0.1); color: var(--sl-text-dim); }
  .diff-status-pill.diff { background: var(--sl-amber-soft); color: var(--sl-amber); }
  .diff-status-pill.only-a { background: var(--sl-accent-soft); color: #C7D2FE; }
  .diff-status-pill.only-b { background: var(--sl-mint-soft); color: #99F6E4; }

  .prompt-diff-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .prompt-diff-item {
    display: grid;
    grid-template-columns: 1fr 84px 1fr;
    gap: 10px;
    align-items: center;
    padding: 6px 10px;
    border-radius: 9px;
    background: rgba(15, 23, 42, 0.45);
    border: 1px solid var(--sl-border);
    font-family: var(--sl-mono);
    font-size: 11.5px;
  }
  .prompt-diff-item.diff-changed {
    border-color: rgba(251, 191, 36, 0.34);
    background: rgba(251, 191, 36, 0.07);
  }
  .prompt-diff-item.diff-only-a {
    border-color: rgba(124, 131, 253, 0.34);
    background: rgba(124, 131, 253, 0.08);
  }
  .prompt-diff-item.diff-only-b {
    border-color: rgba(45, 212, 191, 0.34);
    background: rgba(45, 212, 191, 0.08);
  }

  /* Recipe Independent Tab: Two-Column Spatial Workbench */
  .recipe-workbench {
    display: grid;
    grid-template-columns: minmax(340px, 43%) 1fr;
    gap: 16px;
    padding: 14px 18px 18px;
    height: 100%;
    min-height: 0;
  }
  @media (max-width: 1050px) {
    .recipe-workbench {
      grid-template-columns: 1fr;
      overflow-y: auto;
    }
  }
  .workbench-left {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .frame-stage-card {
    position: relative;
    flex: 1;
    min-height: 300px;
    border-radius: var(--sl-r-xl);
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .breathing-glow {
    position: absolute;
    width: 82%;
    height: 82%;
    border-radius: 50%;
    filter: blur(75px);
    opacity: 0.44;
    animation: breatheGlow 6.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breatheGlow {
    0%, 100% { transform: scale(0.95); opacity: 0.36; }
    50% { transform: scale(1.07); opacity: 0.54; }
  }
  .stage-canvas-bezel {
    position: relative;
    z-index: 2;
    max-height: calc(100% - 54px);
    max-width: 100%;
    padding: 7px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 24px 52px rgba(2, 6, 17, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage-canvas-bezel canvas {
    display: block;
    border-radius: 11px;
    max-width: 100%;
    max-height: 100%;
  }
  .variant-switcher {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.72);
    border: 1px solid var(--sl-border-strong);
  }
  .variant-pill {
    height: 25px;
    padding: 0 11px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--sl-text-sub);
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.16s ease;
  }
  .variant-pill.active {
    background: var(--sl-accent);
    color: #fff;
    box-shadow: 0 3px 10px rgba(124, 131, 253, 0.45);
  }

  .workbench-right {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }

  /* Luminous Capsule Weaver */
  .weaver-card {
    border-radius: var(--sl-r-xl);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .weaver-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .weaver-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .weaver-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .capsule-tray {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 11px;
    border-radius: 13px;
    background: rgba(8, 12, 20, 0.54);
    border: 1px solid var(--sl-border);
    min-height: 58px;
    align-items: flex-start;
  }
  .capsule {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(30, 41, 68, 0.72);
    border: 1px solid rgba(124, 131, 253, 0.34);
    box-shadow: inset 0 0 12px rgba(124, 131, 253, 0.16), 0 2px 8px rgba(0, 0, 0, 0.25);
    color: #F1F5F9;
    font-family: var(--sl-mono);
    font-size: 11.5px;
    cursor: pointer;
    user-select: none;
    transition: all 0.16s ease;
  }
  .capsule:hover {
    border-color: rgba(124, 131, 253, 0.7);
    transform: translateY(-1px);
  }
  .capsule.selected {
    background: rgba(124, 131, 253, 0.28);
    border-color: #A5B4FC;
    box-shadow: 0 0 0 2px rgba(124, 131, 253, 0.28), inset 0 0 14px rgba(124, 131, 253, 0.25);
  }
  .capsule.muted {
    opacity: 0.45;
    text-decoration: line-through;
    border-style: dashed;
    border-color: rgba(148, 163, 184, 0.35);
    box-shadow: none;
  }
  .capsule-weight {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 999px;
    background: rgba(124, 131, 253, 0.28);
    color: #E0E7FF;
  }
  .capsule-weight.up {
    background: rgba(251, 191, 36, 0.22);
    color: #FDE68A;
  }
  .capsule-weight.down {
    background: rgba(148, 163, 184, 0.2);
    color: #CBD5E1;
  }
  .capsule-snippet {
    background: linear-gradient(135deg, rgba(45, 212, 191, 0.2), rgba(20, 184, 166, 0.1));
    border: 1px solid rgba(45, 212, 191, 0.5);
    box-shadow: inset 0 0 14px rgba(45, 212, 191, 0.18), 0 4px 12px rgba(45, 212, 191, 0.1);
    color: #CCFBF1;
    font-family: inherit;
    font-weight: 600;
  }
  .capsule-snippet.selected {
    box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.34), inset 0 0 14px rgba(45, 212, 191, 0.28);
  }
  .snippet-dissolve-btn {
    border: none;
    background: rgba(45, 212, 191, 0.24);
    color: #99F6E4;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 999px;
    cursor: pointer;
  }
  .snippet-dissolve-btn:hover {
    background: #2DD4BF;
    color: #080C14;
  }

  .micro-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    border-radius: 10px;
    background: rgba(26, 35, 56, 0.88);
    border: 1px solid rgba(124, 131, 253, 0.42);
    flex-wrap: wrap;
    animation: fadeSlideIn 0.16s ease;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Dynamic Schema Parameter Panel */
  .schema-panel {
    border-radius: var(--sl-r-xl);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .schema-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    border-radius: 13px;
    background: rgba(12, 18, 32, 0.52);
    border: 1px solid var(--sl-border);
  }
  .schema-group-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--sl-text-sub);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .param-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 14px;
  }
  @media (max-width: 720px) {
    .param-grid { grid-template-columns: 1fr; }
  }
  .param-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid transparent;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .param-item.warn {
    border-color: rgba(251, 191, 36, 0.42);
    background: rgba(251, 191, 36, 0.07);
  }
  .param-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 12px;
  }
  .param-val {
    font-family: var(--sl-mono);
    font-weight: 700;
    font-size: 12px;
    color: var(--sl-mint);
  }
  .param-item.warn .param-val {
    color: var(--sl-amber);
  }
  .safe-track-wrap {
    position: relative;
    height: 18px;
    display: flex;
    align-items: center;
  }
  .safe-track-bg {
    position: absolute;
    left: 0;
    right: 0;
    height: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  .safe-track-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(45, 212, 191, 0.52);
    box-shadow: 0 0 8px rgba(45, 212, 191, 0.45);
    border-radius: 999px;
  }
  .safe-range-input {
    position: relative;
    z-index: 2;
    width: 100%;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    cursor: pointer;
  }
  .safe-range-input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #F8FAFC;
    border: 2px solid var(--sl-accent);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  .param-hint {
    font-size: 10.5px;
    color: var(--sl-text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .param-item.warn .param-hint {
    color: #FDE68A;
  }

  /* Toggle Switch */
  .sl-switch {
    position: relative;
    width: 38px;
    height: 21px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.24);
    border: 1px solid rgba(255, 255, 255, 0.12);
    cursor: pointer;
    transition: all 0.18s ease;
    flex-shrink: 0;
  }
  .sl-switch.on {
    background: rgba(45, 212, 191, 0.42);
    border-color: rgba(45, 212, 191, 0.7);
  }
  .sl-switch::after {
    content: "";
    position: absolute;
    left: 2px;
    top: 2px;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: #F8FAFC;
    transition: transform 0.18s ease;
  }
  .sl-switch.on::after {
    transform: translateX(17px);
  }

  /* Utility Views (Snippets, X-Ray, Schemas, Sync) */
  .utility-view {
    height: 100%;
    overflow-y: auto;
    padding: 16px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .two-col-split {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
    min-height: 0;
  }

  /* =========================================================
   * 3. PROMPT AST & MULTI-DIALECT TRANSPILER
   * ========================================================= */
  let uidCounter = 1000;
  function uid(prefix = 'id') {
    uidCounter += 1;
    return `${prefix}-${uidCounter}`;
  }

  function tok(text, weight = 1.0, muted = false) {
    return { id: uid('tok'), type: 'token', text: text.trim(), weight: Number(weight.toFixed(2)), muted: !!muted };
  }

  function snipRef(snippetId, muted = false) {
    return { id: uid('sref'), type: 'snippet', snippetId, muted: !!muted };
  }

  function parsePromptToNodes(rawText) {
    if (!rawText || !rawText.trim()) return [];
    const parts = rawText.split(',').map(s => s.trim()).filter(Boolean);
    return parts.map(part => {
      // NAI :: syntax e.g. 1.25::tag:: or -1.1::tag::
      let m = part.match(/^(-?\d+(?:\.\d+)?)::(.*?)::$/);
      if (m) return tok(m[2].trim(), parseFloat(m[1]));

      // SDXL / A1111 (tag:1.2) or ((tag:1.2))
      m = part.match(/^\(+([^():]+):(-?\d+(?:\.\d+)?)\)+$/);
      if (m) return tok(m[1].trim(), parseFloat(m[2]));

      // NAI {} braces
      if (/^\{+.*\}+$/.test(part)) {
        const open = (part.match(/^\{+/) || [''])[0].length;
        const inner = part.replace(/^\{+/, '').replace(/\}+$/, '').trim();
        return tok(inner, Number(Math.pow(1.05, open).toFixed(2)));
      }
      // [] brackets
      if (/^\[+.*\]+$/.test(part)) {
        const open = (part.match(/^\[+/) || [''])[0].length;
        const inner = part.replace(/^\[+/, '').replace(/\]+$/, '').trim();
        return tok(inner, Number(Math.pow(0.95, open).toFixed(2)));
      }
      // Plain () emphasis
      if (/^\(+[^()]+\)+$/.test(part)) {
        const open = (part.match(/^\(+/) || [''])[0].length;
        const inner = part.replace(/^\(+/, '').replace(/\)+$/, '').trim();
        return tok(inner, Number(Math.pow(1.1, open).toFixed(2)));
      }
      return tok(part, 1.0);
    });
  }

  function formatTokenForDialect(rawTag, weight, dialect) {
    let tag = rawTag.trim();
    const w = Number((weight == null ? 1.0 : weight).toFixed(2));

    if (dialect === 'moss') {
      tag = tag.replace(/_/g, ' ').replace(/^@/, 'style of ').replace(/^artist:/i, 'art style of ');
      if (Math.abs(w - 1.0) < 0.01) return tag;
      return `(${tag}:${w})`;
    }
    if (dialect === 'anima') {
      if (tag.startsWith('artist:')) tag = '@' + tag.slice(7);
      if (Math.abs(w - 1.0) < 0.01) return tag;
      return `(${tag}:${w})`;
    }
    if (dialect === 'nai_v4') {
      if (tag.startsWith('@')) tag = 'artist:' + tag.slice(1);
      if (Math.abs(w - 1.0) < 0.01) return tag;
      return `${w}::${tag}::`;
    }
    if (dialect === 'nai_v3') {
      if (tag.startsWith('@')) tag = 'artist:' + tag.slice(1);
      if (Math.abs(w - 1.0) < 0.01) return tag;
      if (w > 1.0) {
        const count = Math.max(1, Math.min(5, Math.round((w - 1.0) / 0.05)));
        return '{'.repeat(count) + tag + '}'.repeat(count);
      } else {
        const count = Math.max(1, Math.min(4, Math.round((1.0 - w) / 0.05)));
        return '['.repeat(count) + tag + ']'.repeat(count);
      }
    }
    // sdxl default
    if (tag.startsWith('@')) tag = 'artist:' + tag.slice(1);
    if (Math.abs(w - 1.0) < 0.01) return tag;
    return `(${tag}:${w})`;
  }

  function expandNodesFlat(nodes, snippetsMap, skipMuted = true) {
    const out = [];
    for (const n of nodes) {
      if (skipMuted && n.muted) continue;
      if (n.type === 'snippet') {
        const sn = snippetsMap[n.snippetId];
        if (sn) {
          for (const sub of sn.nodes) {
            if (skipMuted && sub.muted) continue;
            out.push({ ...sub, fromSnippet: sn.name });
          }
        }
      } else {
        out.push(n);
      }
    }
    return out;
  }

  function compileNodes(nodes, dialect, snippetsMap, skipMuted = true) {
    const flat = expandNodesFlat(nodes, snippetsMap, skipMuted);
    return flat.map(n => formatTokenForDialect(n.text, n.weight, dialect)).join(', ');
  }

  function normalizeTokenKey(text) {
    return text.toLowerCase().trim()
      .replace(/^artist:/, '')
      .replace(/^@/, '')
      .replace(/^style of /, '')
      .replace(/_/g, ' ')
      .replace(/\s+/g, ' ');
  }

  function getSchemaMap() {
    const map = {};
    for (const s of STATE.schemas) map[s.id] = s;
    return map;
  }
  function getSnippetsMap() {
    const map = {};
    for (const sn of STATE.snippets) map[sn.id] = sn;
    return map;
  }
  function getRecipe(id) {
    return STATE.recipes.find(r => r.id === id) || STATE.recipes[0];
  }
  function getSchema(id) {
    return STATE.schemas.find(s => s.id === id) || STATE.schemas[0];
  }

  function getFilteredRecipes() {
    const q = STATE.searchQuery.trim().toLowerCase();
    const snMap = getSnippetsMap();
    const scMap = getSchemaMap();
    return STATE.recipes.filter(r => {
      if (STATE.modelFilter !== 'all' && r.schemaId !== STATE.modelFilter) return false;
      if (!q) return true;
      const sc = scMap[r.schemaId];
      const posStr = compileNodes(r.posNodes, sc ? sc.dialect : 'sdxl', snMap, false).toLowerCase();
      const hay = `${r.title} ${r.tags.join(' ')} ${sc ? sc.name : ''} ${r.notes || ''} ${posStr}`.toLowerCase();
      return hay.includes(q);
    });
  }

  /* =========================================================

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function parseAspectRatio(aspectStr) {
    const parts = (aspectStr || '2:3').split(':').map(Number);
    if (parts.length === 2 && parts[0] > 0 && parts[1] > 0) return parts[0] / parts[1];
    return 2 / 3;
  }

  function drawAnimeSilhouette(ctx, cx, cy, scale, fill, rimColor, facingRight = true) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(facingRight ? scale : -scale, scale);

    // Flowing hair backdrop
    ctx.beginPath();
    ctx.moveTo(-18, -86);
    ctx.bezierCurveTo(-58, -68, -72, -10, -48, 42);
    ctx.bezierCurveTo(-30, 74, -64, 118, -32, 145);
    ctx.lineTo(36, 145);
    ctx.bezierCurveTo(64, 96, 44, 24, 34, -22);
    ctx.bezierCurveTo(32, -64, 16, -92, -18, -86);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();

    // Head & neck
    ctx.beginPath();
    ctx.ellipse(2, -62, 17, 21, 0.08, 0, Math.PI * 2);
    ctx.fill();

    // Flowing cloak / dress
    ctx.beginPath();
    ctx.moveTo(-16, -42);
    ctx.bezierCurveTo(-36, 8, -76, 82, -88, 168);
    ctx.lineTo(86, 168);
    ctx.bezierCurveTo(58, 92, 42, 22, 18, -42);
    ctx.closePath();
    ctx.fill();

    // Rim light edge highlight
    ctx.strokeStyle = rimColor;
    ctx.lineWidth = 2.6;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(4, -83);
    ctx.bezierCurveTo(22, -78, 30, -56, 20, -36);
    ctx.bezierCurveTo(42, 10, 56, 78, 82, 164);
    ctx.stroke();

    // Hair strand highlights
    ctx.lineWidth = 1.4;
    ctx.globalAlpha = 0.65;
    ctx.beginPath();
    ctx.moveTo(-14, -78);
    ctx.bezierCurveTo(-48, -42, -54, 18, -36, 72);
    ctx.stroke();

    ctx.restore();
  }

  function renderArtworkToCanvas(canvas, theme, variant, seedOffset = 0) {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const wCss = Math.max(80, Math.round(rect.width || canvas.clientWidth || 260));
    const hCss = Math.max(60, Math.round(rect.height || canvas.clientHeight || 360));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(wCss * dpr);
    const h = Math.round(hCss * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }

    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.scale(dpr, dpr);
    const W = wCss;
    const H = hCss;
    const v = variant || { seed: 1001, p1: '#1E3A8A', p2: '#60A5FA', p3: '#FDE68A' };
    const rnd = mulberry32((v.seed || 1001) + seedOffset);

    // Base rich gradient sky
    const bg = ctx.createLinearGradient(0, 0, W * 0.35, H);
    bg.addColorStop(0, v.p1);
    bg.addColorStop(0.55, '#0B1326');
    bg.addColorStop(1, '#050811');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Secondary radial bloom
    const bloom = ctx.createRadialGradient(W * 0.65, H * 0.28, 6, W * 0.65, H * 0.28, Math.max(W, H) * 0.72);
    bloom.addColorStop(0, v.p2 + '55');
    bloom.addColorStop(0.45, v.p3 + '1F');
    bloom.addColorStop(1, 'transparent');
    ctx.fillStyle = bloom;
    ctx.fillRect(0, 0, W, H);

    if (theme === 'cathedral_tyndall') {
      // Perspective Gothic arches & tall lancet stained windows
      for (let i = 0; i < 4; i++) {
        const ax = W * (0.14 + i * 0.24);
        const aw = W * 0.16;
        const ay = H * 0.12;
        const ah = H * 0.56;
        const wGrad = ctx.createLinearGradient(ax, ay, ax, ay + ah);
        wGrad.addColorStop(0, v.p3 + 'CC');
        wGrad.addColorStop(0.5, v.p2 + '66');
        wGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = wGrad;
        ctx.beginPath();
        ctx.moveTo(ax, ay + ah);
        ctx.lineTo(ax, ay + aw * 0.8);
        ctx.quadraticCurveTo(ax + aw * 0.5, ay - aw * 0.35, ax + aw, ay + aw * 0.8);
        ctx.lineTo(ax + aw, ay + ah);
        ctx.closePath();
        ctx.fill();

        // Dark colonnade pillars
        ctx.fillStyle = 'rgba(6, 10, 20, 0.78)';
        ctx.fillRect(ax - W * 0.04, 0, W * 0.045, H * 0.88);
      }

      // Volumetric Tyndall God-Rays
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let r = 0; r < 6; r++) {
        const rx = W * (0.18 + r * 0.13);
        const rayGrad = ctx.createLinearGradient(rx, 0, rx + W * 0.32, H);
        rayGrad.addColorStop(0, (r % 2 === 0 ? v.p3 : v.p2) + '54');
        rayGrad.addColorStop(0.75, v.p2 + '14');
        rayGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = rayGrad;
        ctx.beginPath();
        ctx.moveTo(rx - 14, 0);
        ctx.lineTo(rx + 26, 0);
        ctx.lineTo(rx + W * 0.42, H);
        ctx.lineTo(rx + W * 0.14, H);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Reflective marble floor
      const floorGrad = ctx.createLinearGradient(0, H * 0.74, 0, H);
      floorGrad.addColorStop(0, 'rgba(9, 14, 28, 0.72)');
      floorGrad.addColorStop(1, '#04070F');
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, H * 0.74, W, H * 0.26);

      // Character silhouette with luminous halo
      const halo = ctx.createRadialGradient(W * 0.49, H * 0.52, 4, W * 0.49, H * 0.52, W * 0.28);
      halo.addColorStop(0, v.p3 + '77');
      halo.addColorStop(1, 'transparent');
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, W, H);
      drawAnimeSilhouette(ctx, W * 0.49, H * 0.62, Math.min(W, H) / 310, '#0B1224', v.p3, true);
    } else if (theme === 'neon_rain_alley') {
      // Vanishing street lines & cyber buildings
      const vx = W * 0.52;
      const vy = H * 0.48;
      ctx.fillStyle = 'rgba(5, 8, 18, 0.85)';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(W * 0.34, vy * 0.78); ctx.lineTo(W * 0.34, vy * 1.15); ctx.lineTo(0, H * 0.85);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(W, 0); ctx.lineTo(W * 0.68, vy * 0.74); ctx.lineTo(W * 0.68, vy * 1.18); ctx.lineTo(W, H * 0.86);
      ctx.closePath(); ctx.fill();

      // Glowing cyber sign panels
      for (let s = 0; s < 9; s++) {
        const leftSide = s % 2 === 0;
        const sx = leftSide ? W * (0.06 + (s * 0.045)) : W * (0.68 + ((s % 3) * 0.07));
        const sy = H * (0.14 + (s % 4) * 0.11);
        const sw = W * (0.1 + rnd() * 0.08);
        const sh = H * (0.07 + rnd() * 0.09);
        const col = s % 3 === 0 ? v.p3 : v.p2;
        ctx.save();
        ctx.shadowColor = col;
        ctx.shadowBlur = 18;
        ctx.fillStyle = col + 'AA';
        ctx.fillRect(sx, sy, sw, sh);
        ctx.fillStyle = '#090E1A';
        ctx.fillRect(sx + 3, sy + 3, sw - 6, sh - 6);
        ctx.fillStyle = col;
        ctx.fillRect(sx + 7, sy + sh * 0.3, sw * 0.6, 3);
        ctx.fillRect(sx + 7, sy + sh * 0.56, sw * 0.42, 3);
        ctx.restore();
      }

      // Glowing shrine Torii silhouette at horizon
      ctx.save();
      ctx.strokeStyle = v.p3;
      ctx.shadowColor = v.p3;
      ctx.shadowBlur = 14;
      ctx.lineWidth = Math.max(3, W * 0.012);
      ctx.beginPath();
      ctx.moveTo(vx - W * 0.11, vy - H * 0.06); ctx.lineTo(vx + W * 0.11, vy - H * 0.06);
      ctx.moveTo(vx - W * 0.08, vy - H * 0.02); ctx.lineTo(vx + W * 0.08, vy - H * 0.02);
      ctx.moveTo(vx - W * 0.06, vy - H * 0.06); ctx.lineTo(vx - W * 0.06, vy + H * 0.14);
      ctx.moveTo(vx + W * 0.06, vy - H * 0.06); ctx.lineTo(vx + W * 0.06, vy + H * 0.14);
      ctx.stroke();
      ctx.restore();

      // Wet asphalt reflections
      const road = ctx.createLinearGradient(0, vy + H * 0.06, 0, H);
      road.addColorStop(0, '#070C18');
      road.addColorStop(1, '#04060D');
      ctx.fillStyle = road;
      ctx.fillRect(0, vy + H * 0.06, W, H);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let i = 0; i < 26; i++) {
        const ry = vy + H * 0.08 + rnd() * (H * 0.42);
        const rx = W * 0.15 + rnd() * W * 0.7;
        const rw = 16 + rnd() * 68;
        ctx.fillStyle = (i % 2 === 0 ? v.p2 : v.p3) + '44';
        ctx.fillRect(rx - rw / 2, ry, rw, 2.5);
      }
      ctx.restore();

      // Umbrella figure
      ctx.save();
      ctx.fillStyle = '#070B14';
      ctx.beginPath();
      ctx.arc(W * 0.38, H * 0.56, W * 0.09, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = v.p2;
      ctx.lineWidth = 2;
      ctx.stroke();
      drawAnimeSilhouette(ctx, W * 0.38, H * 0.73, Math.min(W, H) / 290, '#080D1A', v.p2, true);
      ctx.restore();

      // Rain streaks
      ctx.save();
      ctx.strokeStyle = 'rgba(224, 242, 254, 0.22)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 75; i++) {
        const rx = rnd() * W;
        const ry = rnd() * H;
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx - 6, ry + 18 + rnd() * 14);
        ctx.stroke();
      }
      ctx.restore();
    } else if (theme === 'abyss_jellyfish') {
      // Water caustic ribbons near surface
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let c = 0; c < 5; c++) {
        ctx.strokeStyle = (c % 2 === 0 ? v.p2 : v.p3) + '38';
        ctx.lineWidth = 12 + c * 4;
        ctx.beginPath();
        ctx.moveTo(-20, H * (0.06 + c * 0.04));
        ctx.bezierCurveTo(W * 0.3, H * 0.14, W * 0.7, H * 0.02, W + 20, H * (0.12 + c * 0.03));
        ctx.stroke();
      }

      // Luminous translucent jellyfish
      const jellies = [
        { x: W * 0.3, y: H * 0.28, r: Math.min(W, H) * 0.13, col: v.p2 },
        { x: W * 0.72, y: H * 0.22, r: Math.min(W, H) * 0.09, col: v.p3 },
        { x: W * 0.76, y: H * 0.56, r: Math.min(W, H) * 0.07, col: v.p2 }
      ];
      for (const jf of jellies) {
        const jg = ctx.createRadialGradient(jf.x, jf.y, 2, jf.x, jf.y, jf.r * 1.4);
        jg.addColorStop(0, '#FFFFFFAA');
        jg.addColorStop(0.4, jf.col + '88');
        jg.addColorStop(1, 'transparent');
        ctx.fillStyle = jg;
        ctx.beginPath();
        ctx.arc(jf.x, jf.y, jf.r * 1.1, Math.PI, 0);
        ctx.quadraticCurveTo(jf.x, jf.y + jf.r * 0.3, jf.x - jf.r * 1.1, jf.y);
        ctx.fill();

        ctx.strokeStyle = jf.col + '66';
        ctx.lineWidth = 1.4;
        for (let t = -3; t <= 3; t++) {
          ctx.beginPath();
          const sx = jf.x + t * (jf.r * 0.24);
          ctx.moveTo(sx, jf.y + 4);
          ctx.bezierCurveTo(sx - 12, jf.y + jf.r * 0.9, sx + 14, jf.y + jf.r * 1.6, sx - 6, jf.y + jf.r * 2.4);
          ctx.stroke();
        }
      }
      ctx.restore();

      // Floating silhouette
      drawAnimeSilhouette(ctx, W * 0.48, H * 0.64, Math.min(W, H) / 300, '#09192C', v.p2, false);
    } else if (theme === 'crimson_origami') {
      // Graphic sun/moon disc with concentric ring
      const cx = W * 0.52;
      const cy = H * 0.42;
      const rad = Math.min(W, H) * 0.29;
      const disc = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
      disc.addColorStop(0, v.p3);
      disc.addColorStop(1, v.p2);
      ctx.fillStyle = disc;
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, rad * 1.16, 0.2, Math.PI * 1.65);
      ctx.stroke();

      // Geometric Origami Cranes
      const cranes = [
        { x: W * 0.24, y: H * 0.24, s: 1.0, a: -0.3 },
        { x: W * 0.78, y: H * 0.30, s: 0.78, a: 0.35 },
        { x: W * 0.22, y: H * 0.72, s: 0.72, a: -0.2 }
      ];
      for (const c of cranes) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.a);
        ctx.scale(c.s * (W / 320), c.s * (W / 320));
        ctx.fillStyle = '#FFF1F2';
        ctx.beginPath(); ctx.moveTo(-36, 8); ctx.lineTo(0, -24); ctx.lineTo(28, 6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = v.p2;
        ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(42, -32); ctx.lineTo(14, 4); ctx.closePath(); ctx.fill();
        ctx.fillStyle = v.p3;
        ctx.beginPath(); ctx.moveTo(-36, 8); ctx.lineTo(-56, -12); ctx.lineTo(-10, 0); ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      drawAnimeSilhouette(ctx, W * 0.52, H * 0.66, Math.min(W, H) / 270, '#140910', v.p3, true);
    } else if (theme === 'astro_observatory') {
      // Sweeping diagonal Milky Way nebula
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const neb = ctx.createLinearGradient(0, H * 0.7, W, H * 0.1);
      neb.addColorStop(0, 'transparent');
      neb.addColorStop(0.45, v.p2 + '55');
      neb.addColorStop(0.7, v.p3 + '44');
      neb.addColorStop(1, 'transparent');
      ctx.fillStyle = neb;
      ctx.beginPath();
      ctx.ellipse(W * 0.52, H * 0.38, W * 0.65, H * 0.16, -0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Concentric brass astrolabe rings
      const ax = W * 0.54;
      const ay = H * 0.42;
      const ar = Math.min(W, H) * 0.34;
      ctx.save();
      ctx.strokeStyle = v.p3 + 'AA';
      ctx.lineWidth = 1.6;
      [1, 0.78, 0.54].forEach((mult, idx) => {
        ctx.beginPath();
        ctx.arc(ax, ay, ar * mult, 0, Math.PI * 2);
        ctx.stroke();
        if (idx === 0) {
          for (let d = 0; d < 24; d++) {
            const ang = (d / 24) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(ax + Math.cos(ang) * ar * 0.94, ay + Math.sin(ang) * ar * 0.94);
            ctx.lineTo(ax + Math.cos(ang) * ar, ay + Math.sin(ang) * ar);
            ctx.stroke();
          }
        }
      });
      ctx.restore();

      // Dome frame silhouette
      ctx.fillStyle = '#070A14';
      ctx.beginPath();
      ctx.rect(0, H * 0.78, W, H * 0.22);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(W * 0.5, H * 0.5, W * 0.65, 0, Math.PI * 2, true);
      ctx.rect(0, 0, W, H);
      ctx.fill('evenodd');

      drawAnimeSilhouette(ctx, W * 0.34, H * 0.72, Math.min(W, H) / 260, '#090D1B', v.p2, true);
    } else if (theme === 'glasshouse_watercolor') {
      // Soft watercolor bokeh washes
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      for (let i = 0; i < 14; i++) {
        const bx = rnd() * W;
        const by = rnd() * H * 0.82;
        const br = 24 + rnd() * 68;
        ctx.fillStyle = (i % 2 === 0 ? v.p2 : v.p3) + '2A';
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // Delicate conservatory iron arches
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.25)';
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(W * 0.5, H * 0.55, W * (0.28 + i * 0.14), Math.PI, 0);
        ctx.stroke();
      }
      // Botanical petal clusters
      for (let p = 0; p < 22; p++) {
        ctx.fillStyle = (p % 3 === 0 ? v.p3 : v.p2) + '99';
        ctx.beginPath();
        ctx.ellipse(rnd() * W, H * 0.58 + rnd() * H * 0.4, 8 + rnd() * 14, 4 + rnd() * 7, rnd() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      drawAnimeSilhouette(ctx, W * 0.52, H * 0.63, Math.min(W, H) / 300, '#1B2838', v.p3, false);
    } else {
      // obsidian_mecha: angular wing blades + blizzard mist + glowing visor
      ctx.save();
      const cx = W * 0.5;
      const cy = H * 0.54;
      // Mecha wing blades
      ctx.fillStyle = '#090E1B';
      ctx.strokeStyle = v.p2;
      ctx.lineWidth = 1.8;
      for (const dir of [-1, 1]) {
        for (let b = 0; b < 3; b++) {
          ctx.beginPath();
          ctx.moveTo(cx + dir * 18, cy - 28 + b * 24);
          ctx.lineTo(cx + dir * (W * 0.44 - b * 24), cy - 110 + b * 48);
          ctx.lineTo(cx + dir * (W * 0.34 - b * 18), cy - 30 + b * 32);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }
      drawAnimeSilhouette(ctx, cx, cy + H * 0.08, Math.min(W, H) / 290, '#0B1120', v.p2, true);
      // Glowing visor slit
      ctx.shadowColor = v.p2;
      ctx.shadowBlur = 14;
      ctx.fillStyle = v.p2;
      ctx.fillRect(cx - 8, cy - H * 0.125, 18, 3.5);
      ctx.restore();
    }

    // Floating atmospheric motes / stardust sparkles across all scenes
    ctx.save();
    for (let i = 0; i < 36; i++) {
      const mx = rnd() * W;
      const my = rnd() * H;
      const mr = 0.7 + rnd() * 2.1;
      ctx.fillStyle = i % 3 === 0 ? v.p3 + 'CC' : 'rgba(248, 250, 252, 0.55)';
      ctx.beginPath();
      ctx.arc(mx, my, mr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Subtle edge vignette
    const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.35, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, 'rgba(4, 7, 15, 0.48)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  function hydrateAllCanvases() {
    const canvases = document.querySelectorAll('canvas[data-art-theme]');
    canvases.forEach(c => {
      const theme = c.getAttribute('data-art-theme');
      const variantJson = c.getAttribute('data-art-variant');
      let variant = null;
      try { variant = JSON.parse(variantJson); } catch (_) {}
      renderArtworkToCanvas(c, theme, variant);
    });
  }

  /* =========================================================
   * 8. REAL X-RAY FILE PARSING (PNG Chunks + Stealth LSB + ComfyUI JSON)
   * ========================================================= */
  function readU32BE(u8, off) {
    return ((u8[off] << 24) | (u8[off + 1] << 16) | (u8[off + 2] << 8) | u8[off + 3]) >>> 0;
  }

  async function gunzipBytes(bytes) {
    if (typeof DecompressionStream === 'undefined') return null;
    for (const fmt of ['gzip', 'deflate']) {
      try {
        const ds = new DecompressionStream(fmt);
        const writer = ds.writable.getWriter();
        writer.write(bytes);
        writer.close();
        const buf = await new Response(ds.readable).arrayBuffer();
        return new TextDecoder('utf-8').decode(buf);
      } catch (_) {}
    }
    return null;
  }

  async function tryParseStealthPng(file) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = async () => {
        try {
          const c = document.createElement('canvas');
          c.width = img.width;
          c.height = img.height;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const data = ctx.getImageData(0, 0, img.width, img.height).data;
          URL.revokeObjectURL(url);

          // Column-major LSB bit reader (Alpha channel, then RGB)
          function readBits(mode) {
            const bytes = [];
            let curByte = 0;
            let bitCount = 0;
            const maxBits = Math.min(img.width * img.height * (mode === 'alpha' ? 1 : 3), 8 * 128000);
            outer: for (let x = 0; x < img.width; x++) {
              for (let y = 0; y < img.height; y++) {
                const idx = (y * img.width + x) * 4;
                const channels = mode === 'alpha' ? [data[idx + 3]] : [data[idx], data[idx + 1], data[idx + 2]];
                for (const ch of channels) {
                  curByte = (curByte << 1) | (ch & 1);
                  bitCount++;
                  if (bitCount === 8) {
                    bytes.push(curByte);
                    curByte = 0;
                    bitCount = 0;
                    if (bytes.length * 8 >= maxBits) break outer;
                  }
                }
              }
            }
            return new Uint8Array(bytes);
          }

          for (const mode of ['alpha', 'rgb']) {
            const raw = readBits(mode);
            if (raw.length < 20) continue;
            const head = new TextDecoder('ascii').decode(raw.slice(0, 15));
            const magics = ['stealth_pnginfo', 'stealth_pngcomp', 'stealth_rgbinfo', 'stealth_rgbcomp'];
            const foundMagic = magics.find(m => head.startsWith(m));
            if (foundMagic) {
              const lenPos = foundMagic.length;
              const bitLen = readU32BE(raw, lenPos);
              const byteLen = Math.ceil(bitLen / 8);
              const payload = raw.slice(lenPos + 4, lenPos + 4 + byteLen);
              const text = foundMagic.endsWith('comp') ? await gunzipBytes(payload) : new TextDecoder('utf-8').decode(payload);
              if (text) {
                resolve({ magic: foundMagic, text, width: img.width, height: img.height });
                return;
              }
            }
          }
          resolve({ magic: null, width: img.width, height: img.height });
        } catch (err) {
          URL.revokeObjectURL(url);
          resolve(null);
        }
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function parseComfyGraph(jsonObj, fileName) {
    const stages = [];
    // Handle UI format (nodes array) or API format (dict of nodeIds)
    const nodesList = Array.isArray(jsonObj.nodes)
      ? jsonObj.nodes.map((n, i) => ({ id: n.id ?? i, class_type: n.type || '', inputs: n.widgets_values || {}, uiNode: n }))
      : Object.entries(jsonObj).map(([id, n]) => ({ id, class_type: n.class_type || '', inputs: n.inputs || {} }));

    const samplers = nodesList.filter(n => /KSampler|SamplerCustom/i.test(n.class_type));
    const loras = nodesList
      .filter(n => /LoraLoader/i.test(n.class_type))
      .map(n => ({
        name: n.inputs.lora_name || (Array.isArray(n.inputs) ? n.inputs[0] : 'lora.safetensors'),
        weight: Number(n.inputs.strength_model ?? (Array.isArray(n.inputs) ? n.inputs[1] : 0.8))
      }));
    const ckptNode = nodesList.find(n => /CheckpointLoader|UNETLoader/i.test(n.class_type));
    const modelName = ckptNode
      ? (ckptNode.inputs.ckpt_name || ckptNode.inputs.unet_name || (Array.isArray(ckptNode.inputs) ? ckptNode.inputs[0] : 'ComfyUI Checkpoint'))
      : 'ComfyUI Workflow';

    const clipTexts = nodesList
      .filter(n => /CLIPTextEncode/i.test(n.class_type))
      .map(n => (typeof n.inputs.text === 'string' ? n.inputs.text : (Array.isArray(n.inputs) && typeof n.inputs[0] === 'string' ? n.inputs[0] : '')))
      .filter(Boolean);

    if (samplers.length > 0) {
      samplers.forEach((s, idx) => {
        const inp = s.inputs;
        const posRef = inp.positive && Array.isArray(inp.positive) ? jsonObj[inp.positive[0]] : null;
        const negRef = inp.negative && Array.isArray(inp.negative) ? jsonObj[inp.negative[0]] : null;
        const pos = posRef?.inputs?.text || clipTexts[0] || '';
        const neg = negRef?.inputs?.text || clipTexts[1] || '';
        stages.push({
          name: `阶段 ${idx + 1} · ${s.class_type}`,
          model: modelName,
          sampler: inp.sampler_name || (Array.isArray(inp) ? inp[4] : 'euler') || 'euler',
          scheduler: inp.scheduler || (Array.isArray(inp) ? inp[5] : 'normal') || 'normal',
          steps: Number(inp.steps ?? (Array.isArray(inp) ? inp[2] : 25) ?? 25),
          cfg: Number(inp.cfg ?? (Array.isArray(inp) ? inp[3] : 4.0) ?? 4.0),
          seed: inp.seed ?? (Array.isArray(inp) ? inp[0] : 0) ?? 0,
          resolution: '1024x1024',
          extra: { denoise: inp.denoise ?? (Array.isArray(inp) ? inp[6] : 1.0) ?? 1.0 },
          positive: pos,
          negative: neg,
          loras
        });
      });
    } else {
      stages.push({
        name: '工作流文本节点提取',
        model: modelName,
        sampler: 'euler',
        scheduler: 'normal',
        steps: 28,
        cfg: 4.0,
        seed: 0,
        resolution: '1024x1024',
        extra: { nodeCount: nodesList.length },
        positive: clipTexts[0] || JSON.stringify(jsonObj).slice(0, 260),
        negative: clipTexts[1] || '',
        loras
      });
    }

    const low = JSON.stringify(jsonObj).toLowerCase();
    const suggestedSchemaId = low.includes('moss') ? 'comfy-moss' : low.includes('anima') ? 'comfy-anima' : 'illustrious-xl';
    return {
      id: uid('xray'),
      label: fileName,
      badge: `ComfyUI · ${stages.length} Stage(s)`,
      sourceType: 'Local JSON File',
      suggestedSchemaId,
      artTheme: 'astro_observatory',
      aspect: '16:10',
      variant: { name: fileName, seed: fileName.length * 137, p1: '#0C0F26', p2: '#7C83FD', p3: '#2DD4BF' },
      stages
    };
  }

  async function handleLocalXRayFile(file) {
    if (!file) return;
    STATE.xray.customFileName = file.name;
    const lower = file.name.toLowerCase();

    if (lower.endsWith('.json')) {
      try {
        const text = await file.text();
        const obj = JSON.parse(text);
        STATE.xray.parsedData = parseComfyGraph(obj, file.name);
        STATE.xray.activeStageIdx = 0;
        renderAll();
        showToast(`已解析 ComfyUI 工作流：${file.name}`);
      } catch (e) {
        showToast(`JSON 解析失败：${e.message}`);
      }
      return;
    }

    if (lower.endsWith('.png')) {
      const buf = new Uint8Array(await file.arrayBuffer());
      const sig = [137, 80, 78, 71, 13, 10, 26, 10];
      const isPng = sig.every((b, i) => buf[i] === b);
      if (!isPng) {
        showToast('文件不是有效的 PNG 图像');
        return;
      }

      const chunks = {};
      let pos = 8;
      const dec = new TextDecoder('utf-8');
      while (pos + 12 <= buf.length) {
        const len = readU32BE(buf, pos);
        const type = String.fromCharCode(buf[pos + 4], buf[pos + 5], buf[pos + 6], buf[pos + 7]);
        const dataStart = pos + 8;
        const dataEnd = Math.min(dataStart + len, buf.length);
        const slice = buf.slice(dataStart, dataEnd);
        if (type === 'tEXt') {
          const nul = slice.indexOf(0);
          if (nul > 0) chunks[dec.decode(slice.slice(0, nul))] = dec.decode(slice.slice(nul + 1));
        } else if (type === 'iTXt') {
          const nul = slice.indexOf(0);
          if (nul > 0) {
            const k = dec.decode(slice.slice(0, nul));
            const rest = dec.decode(slice.slice(nul + 5)).replace(/^\x00+/, '');
            chunks[k] = rest;
          }
        } else if (type === 'zTXt') {
          const nul = slice.indexOf(0);
          if (nul > 0) {
            const k = dec.decode(slice.slice(0, nul));
            const unc = await gunzipBytes(slice.slice(nul + 2));
            if (unc) chunks[k] = unc;
          }
        }
        pos = dataEnd + 4;
        if (type === 'IEND') break;
      }

      if (chunks.prompt) {
        try {
          STATE.xray.parsedData = parseComfyGraph(JSON.parse(chunks.prompt), file.name);
          STATE.xray.activeStageIdx = 0;
          renderAll();
          showToast(`从 PNG Chunk 提取 ComfyUI 元数据成功`);
          return;
        } catch (_) {}
      }

      if (chunks.Description || chunks.Comment) {
        let comment = {};
        try { comment = JSON.parse(chunks.Comment || '{}'); } catch (_) {}
        STATE.xray.parsedData = {
          id: uid('xray'),
          label: file.name,
          badge: 'PNG Chunk · NovelAI',
          sourceType: 'PNG tEXt/iTXt Chunk',
          suggestedSchemaId: 'nai-v45',
          artTheme: 'cathedral_tyndall',
          aspect: '2:3',
          variant: { name: file.name, seed: file.size % 9999, p1: '#1E3A8A', p2: '#60A5FA', p3: '#FDE68A' },
          stages: [{
            name: 'NovelAI PNG 元数据',
            model: chunks.Source || 'NovelAI Diffusion',
            sampler: comment.sampler || 'k_euler_ancestral',
            scheduler: 'native',
            steps: comment.steps || 28,
            cfg: comment.scale || 5.5,
            seed: comment.seed || 0,
            resolution: `${comment.width || 832}x${comment.height || 1216}`,
            extra: { smea: !!comment.sm, smea_dyn: !!comment.sm_dyn },
            positive: chunks.Description || comment.prompt || '',
            negative: comment.uc || '',
            loras: []
          }]
        };
        STATE.xray.activeStageIdx = 0;
        renderAll();
        showToast('已解析 NovelAI PNG 元数据');
        return;
      }

      if (chunks.parameters) {
        const raw = chunks.parameters;
        const negSplit = raw.split('\nNegative prompt:');
        const posTxt = negSplit[0] || '';
        const rest = negSplit[1] || '';
        const stepsSplit = rest.split('\nSteps:');
        const negTxt = stepsSplit[0] || '';
        const paramLine = 'Steps:' + (stepsSplit[1] || '');
        const stepsM = paramLine.match(/Steps:\s*(\d+)/);
        const cfgM = paramLine.match(/CFG scale:\s*([\d.]+)/);
        const sampM = paramLine.match(/Sampler:\s*([^,]+)/);
        STATE.xray.parsedData = {
          id: uid('xray'),
          label: file.name,
          badge: 'PNG Chunk · A1111 / Forge',
          sourceType: 'PNG parameters Chunk',
          suggestedSchemaId: 'illustrious-xl',
          artTheme: 'obsidian_mecha',
          aspect: '2:3',
          variant: { name: file.name, seed: file.size % 9999, p1: '#0A101D', p2: '#2DD4BF', p3: '#E2E8F0' },
          stages: [{
            name: 'A1111 / Forge Parameters',
            model: (paramLine.match(/Model:\s*([^,]+)/) || [])[1] || 'SDXL Checkpoint',
            sampler: sampM ? sampM[1].trim() : 'Euler a',
            scheduler: 'karras',
            steps: stepsM ? Number(stepsM[1]) : 28,
            cfg: cfgM ? Number(cfgM[1]) : 5.0,
            seed: (paramLine.match(/Seed:\s*(\d+)/) || [])[1] || 0,
            resolution: (paramLine.match(/Size:\s*(\d+x\d+)/) || [])[1] || '832x1216',
            extra: {},
            positive: posTxt.trim(),
            negative: negTxt.trim(),
            loras: []
          }]
        };
        STATE.xray.activeStageIdx = 0;
        renderAll();
        showToast('已解析 A1111/Forge PNG parameters');
        return;
      }

      // Fallback: Stealth LSB scan!
      const stealth = await tryParseStealthPng(file);
      if (stealth && stealth.magic) {
        let info = {};
        try { info = JSON.parse(stealth.text); } catch (_) { info = { Description: stealth.text }; }
        let comment = {};
        try { comment = typeof info.Comment === 'string' ? JSON.parse(info.Comment) : (info.Comment || {}); } catch (_) {}
        STATE.xray.parsedData = {
          id: uid('xray'),
          label: file.name,
          badge: `LSB 隐写 · ${stealth.magic}`,
          sourceType: 'PNG Stealth LSB',
          suggestedSchemaId: 'nai-v45',
          artTheme: 'abyss_jellyfish',
          aspect: '3:4',
          variant: { name: file.name, seed: file.size % 9999, p1: '#041224', p2: '#2DD4BF', p3: '#7C83FD' },
          stages: [{
            name: `隐写提取 (${stealth.magic})`,
            model: info.Source || 'NovelAI Diffusion',
            sampler: comment.sampler || 'k_euler_ancestral',
            scheduler: 'native',
            steps: comment.steps || 28,
            cfg: comment.scale || 5.5,
            seed: comment.seed || 0,
            resolution: `${stealth.width}x${stealth.height}`,
            extra: { stealth_magic: stealth.magic },
            positive: info.Description || comment.prompt || stealth.text,
            negative: comment.uc || '',
            loras: []
          }]
        };
        STATE.xray.activeStageIdx = 0;
