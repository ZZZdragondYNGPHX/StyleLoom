          { key: 'cfg', label: 'CFG Scale', type: 'slider', min: 1, max: 12, step: 0.5, safeMin: 3, safeMax: 6, unit: '', hint: '推荐区间 3–6' }
        ]
      };
      state.schemas.push(created);
      state.selectedSchemaId = created.id;
      showToast(`已新建模板「${created.shortName}」`);
      renderAll();
    });

    stage.querySelector('#addFieldSubmitBtn').addEventListener('click', () => {
      const label = stage.querySelector('#newFieldLabel').value.trim();
      if (!label) {
        showToast('请先输入字段名称');
        return;
      }
      const fType = typeSel.value;
      const key = 'custom_' + Date.now().toString(36).slice(-4);
      if (fType === 'slider') {
        const min = parseFloat(stage.querySelector('#newFieldMin').value) || 0;
        const max = parseFloat(stage.querySelector('#newFieldMax').value) || 2;
        const safeMax = parseFloat(stage.querySelector('#newFieldSafeMax').value) || max * 0.7;
        sel.fields.push({ key, label, type: 'slider', min, max, step: 0.1, safeMin: min, safeMax, unit: '', hint: `安全上限 ${safeMax}` });
      } else if (fType === 'select') {
        sel.fields.push({ key, label, type: 'select', options: ['Standard', 'Balanced', 'Creative'] });
      } else {
        sel.fields.push({ key, label, type: 'toggle', hint: '自定义布尔参数' });
      }
      showToast(`已向「${sel.shortName}」新增字段 ${label}`);
      renderAll();
    });
  }

  /* ---------- 模块 5：云端同步 (.slpack + Koofr WebDAV) ---------- */
  function renderSyncView(stage, isMobile = false) {
    const wd = state.webdav;

    stage.innerHTML = `
      <div class="${isMobile ? '' : 'two-col-bento'}" style="${isMobile ? 'display:flex;flex-direction:column;gap:12px;' : ''}">
        <!-- 1. 离线 .slpack 手账包 -->
        <div class="bento-subcard" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div>
              <div style="font-size:15px;font-weight:750;">📦 离线 .slpack 手账归档包</div>
              <div style="font-size:11.5px;color:var(--text-sub);margin-top:2px;">全库或挑选配方导出，含 manifest.json 与 SHA-256 图像去重</div>
            </div>
          </div>

          <div class="seg-pill" style="align-self:flex-start;">
            <button type="button" class="seg-btn ${state.syncExportMode === 'all' ? 'active-pine' : ''}" data-exmode="all">全库导出 (${state.recipes.length}卡)</button>
            <button type="button" class="seg-btn ${state.syncExportMode === 'selected' ? 'active-pine' : ''}" data-exmode="selected">挑选导出</button>
          </div>

          ${state.syncExportMode === 'selected' ? `
            <div style="background:var(--bg-well);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;max-height:170px;" class="sl-scroll">
              <div style="font-size:11px;font-weight:700;color:var(--text-sub);">勾选要打包分享的画师串：</div>
              ${state.recipes.map((r) => `
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;">
                  <input type="checkbox" class="sync-rec-chk" value="${r.id}" ${state.syncSelectedRecipes.includes(r.id) ? 'checked' : ''}>
                  <span>${esc(r.title)}</span>
                </label>
              `).join('')}
            </div>
          ` : `
            <div style="background:var(--bg-well);border-radius:14px;padding:11px;font-size:12px;color:var(--text-sub);line-height:1.6;">
              当前本地库共包含 <strong>${state.recipes.length}</strong> 张画师串、<strong>${state.snippets.length}</strong> 个积木片段、<strong>${state.schemas.length}</strong> 套底模模板与 <strong>${state.recipes.reduce((a, r) => a + r.variants.length, 0)}</strong> 张高分辨率变体插画。
            </div>
          `}

          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn-primary" id="exportSlpackBtn">导出 .slpack 归档文件</button>
            <button type="button" class="btn-soft" id="simImportSlpackBtn">模拟导入校验 (SHA-256 去重)</button>
          </div>

          ${state.syncSlpackPreview ? `
            <div class="sync-log-box">${esc(state.syncSlpackPreview)}</div>
          ` : ''}
        </div>

        <!-- 2. Koofr HTTPS WebDAV 增量同步 -->
        <div class="bento-subcard" style="padding:16px;display:flex;flex-direction:column;gap:11px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div>
              <div style="font-size:15px;font-weight:750;">☁️ Koofr WebDAV 增量同步</div>
              <div style="font-size:11.5px;color:var(--text-sub);margin-top:2px;">原生 HTTPS 内容寻址 · 上次同步：${esc(wd.lastSync)}</div>
            </div>
            <span style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:${wd.connected ? 'var(--pine-soft)' : 'var(--amber-soft)'};color:${wd.connected ? 'var(--pine-dark)' : 'var(--amber)'};">
              ${wd.connected ? '● 已连接' : '○ 待测试'}
            </span>
          </div>

          <div style="background:var(--amber-soft);border-radius:14px;padding:10px 12px;font-size:11.5px;color:#854D14;line-height:1.5;">
            <strong>🔐 Koofr 应用专用密码指南：</strong><br>
            请勿直接使用账号登录密码。前往 Koofr 网页版 → <em>Account Preferences → Password → Generate App Password</em> 创建专用密码，并保留端点 <code>https://app.koofr.net/dav/Koofr</code>（区分大小写）。
          </div>

          <div style="display:flex;flex-direction:column;gap:8px;">
            <div>
              <div style="font-size:11px;font-weight:650;color:var(--text-sub);margin-bottom:3px;">WebDAV 端点 URL</div>
              <input type="text" class="form-input" id="wdEndpoint" value="${esc(wd.endpoint)}">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <div>
                <div style="font-size:11px;font-weight:650;color:var(--text-sub);margin-bottom:3px;">账号邮箱</div>
                <input type="text" class="form-input" id="wdEmail" value="${esc(wd.email)}">
              </div>
              <div>
                <div style="font-size:11px;font-weight:650;color:var(--text-sub);margin-bottom:3px;">应用专用密码</div>
                <input type="password" class="form-input" id="wdPass" value="${esc(wd.appPassword)}">
              </div>
            </div>
            <div>
              <div style="font-size:11px;font-weight:650;color:var(--text-sub);margin-bottom:3px;">远端同步目录</div>
              <input type="text" class="form-input" id="wdRemoteDir" value="${esc(wd.remoteDir)}">
            </div>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn-soft" id="wdSaveBtn">保存配置</button>
            <button type="button" class="btn-coral" id="wdTestBtn">测试 WebDAV 连接</button>
            <button type="button" class="btn-primary" id="wdSyncNowBtn">立即增量同步</button>
          </div>

          <div class="sync-log-box">${wd.logs.map((l) => esc(l)).join('<br>')}</div>
        </div>
      </div>
    `;

    stage.querySelectorAll('[data-exmode]').forEach((b) => b.addEventListener('click', () => {
      state.syncExportMode = b.getAttribute('data-exmode');
      renderSyncView(stage, isMobile);
    }));

    stage.querySelectorAll('.sync-rec-chk').forEach((chk) => chk.addEventListener('change', () => {
      const id = chk.value;
      if (chk.checked && !state.syncSelectedRecipes.includes(id)) state.syncSelectedRecipes.push(id);
      if (!chk.checked) state.syncSelectedRecipes = state.syncSelectedRecipes.filter((x) => x !== id);
    }));

    stage.querySelector('#exportSlpackBtn').addEventListener('click', () => {
      const picked = state.syncExportMode === 'all'
        ? state.recipes
        : state.recipes.filter((r) => state.syncSelectedRecipes.includes(r.id));
      const payload = {
        format: 'styleloom.slpack.v1',
        exportedAt: new Date().toISOString(),
        sha256Prefix: '9a4f8c2e1b70...d841',
        recipes: picked,
        snippets: state.snippets,
        schemas: state.schemas.filter((s) => !s.builtin)
      };
      const jsonStr = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `StyleLoom-backup-${picked.length}recipes.slpack`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      state.syncSlpackPreview = `[Export OK] manifest.json (${picked.length} recipes, ${state.snippets.length} snippets)\n[Blobs] ${picked.reduce((n, r) => n + r.variants.length, 0)} artworks indexed via SHA-256`;
      showToast(`已导出包含 ${picked.length} 张画师串的 .slpack 手账包`);
      renderSyncView(stage, isMobile);
    });

    stage.querySelector('#simImportSlpackBtn').addEventListener('click', () => {
      state.syncSlpackPreview = `[Import Check] SHA-256 内容寻址校验完成\n• 跳过 6 张已存在原图 Blob (节省 14.2 MB)\n• 无冲突合并 2 条远端提示词修订记录`;
      showToast('已完成 .slpack 导入去重模拟校验');
      renderSyncView(stage, isMobile);
    });

    const saveWdInputs = () => {
      wd.endpoint = stage.querySelector('#wdEndpoint').value.trim();
      wd.email = stage.querySelector('#wdEmail').value.trim();
      wd.appPassword = stage.querySelector('#wdPass').value;
      wd.remoteDir = stage.querySelector('#wdRemoteDir').value.trim() || '/StyleLoom';
    };

    stage.querySelector('#wdSaveBtn').addEventListener('click', () => {
      saveWdInputs();
      wd.logs.push(`[Save] 已保存配置 → ${wd.endpoint}${wd.remoteDir}`);
      showToast('WebDAV 配置已保存到本地');
      renderSyncView(stage, isMobile);
    });

    stage.querySelector('#wdTestBtn').addEventListener('click', () => {
      saveWdInputs();
      wd.connected = true;
      wd.logs.push(`[PROPFIND] ${wd.endpoint}${wd.remoteDir} → HTTP 207 Multi-Status (TLS 1.3 OK)`);
      showToast('Koofr WebDAV 连接测试成功 (207 Multi-Status)');
      renderSyncView(stage, isMobile);
    });

    stage.querySelector('#wdSyncNowBtn').addEventListener('click', () => {
      saveWdInputs();
      wd.connected = true;
      const now = new Date().toTimeString().slice(0, 8);
      wd.lastSync = `今天 ${now}`;
      wd.logs.push(`[Sync ${now}] 比对 blobs/ SHA-256 清单 (0 冲突) → 上传 snapshot.json.gz (18.4 KB) → 同步完成`);
      showToast('Koofr 增量同步完成');
      renderSyncView(stage, isMobile);
    });
  }

  function renderDesktopMainStage() {
    const stage = document.getElementById('desktopMainStage');
    if (state.activePage === 'gallery') renderGalleryView(stage);
    else if (state.activePage === 'snippets') renderSnippetsView(stage, false);
    else if (state.activePage === 'inspector') renderInspectorView(stage, false);
    else if (state.activePage === 'schemas') renderSchemasView(stage, false);
    else if (state.activePage === 'sync') renderSyncView(stage, false);
    requestAnimationFrame(hydrateAllCanvases);
  }

  /* =========================================================================
     10. 右侧悬浮 Bento 编辑抽屉 (与手机端全屏编辑器共享核心渲染器)
     ========================================================================= */
  function renderUnifiedActionBar(box, tokens, isMobile = false) {
    const sel = state.selectedToken && state.selectedToken.box === box
      ? tokens.find((t) => t.id === state.selectedToken.tokenId)
      : null;

    if (!sel) {
      return `
        <div class="unified-action-bar ${isMobile ? 'mobile-uab' : ''}">
          <span class="uab-hint">👆 点击下方任意干净胶囊，即在此栏调权、排序、静音或打散积木</span>
        </div>
      `;
    }

    const isSnippet = sel.kind === 'snippet';
    return `
      <div class="unified-action-bar active-bar ${isMobile ? 'mobile-uab' : ''}" data-uab-box="${box}">
        <button type="button" class="uab-btn" data-uab-act="w-down" title="权重 -0.05">−0.05</button>
        <span class="uab-weight-readout">${sel.weight.toFixed(2)}×</span>
        <button type="button" class="uab-btn" data-uab-act="w-up" title="权重 +0.05">+0.05</button>
        <span class="uab-sep"></span>
        <button type="button" class="uab-btn" data-uab-act="prev" title="前移一位">前移</button>
        <button type="button" class="uab-btn" data-uab-act="next" title="后移一位">后移</button>
        <span class="uab-sep"></span>
        <button type="button" class="uab-btn" data-uab-act="mute">${sel.muted ? '恢复生效' : '静音'}</button>
        ${isSnippet ? `<button type="button" class="uab-btn uab-coral" data-uab-act="unpack">✨ 打散为词条</button>` : ''}
        <button type="button" class="uab-btn uab-danger" data-uab-act="remove">移出</button>
      </div>
    `;
  }

  function renderPromptSectionHtml(rec, box, isMobile = false) {
    const tokens = box === 'pos' ? rec.posTokens : rec.negTokens;
    const isSrc = state.sourceMode[box];
    const sch = getSchema(rec.schemaId);
    const compiled = compileTokens(tokens, sch.dialect);

    return `
      <div class="prompt-bento" data-prompt-box="${box}">
        <div class="prompt-head">
          <span class="prompt-label">
            <span class="${box === 'pos' ? 'dot-pos' : 'dot-neg'}"></span>
            <span>${box === 'pos' ? '正面提示词' : '负面提示词'}</span>
            <span style="font-size:11px;font-weight:500;color:var(--text-muted);">(${tokens.length})</span>
          </span>
          <div class="prompt-head-actions">
            <button type="button" class="mini-pill-btn ${!isSrc ? 'active' : ''}" data-toggle-src="${box}">${isSrc ? '切换胶囊' : '源码'}</button>
            <button type="button" class="mini-pill-btn" data-open-import="${box}">+ 导入积木</button>
            <button type="button" class="mini-pill-btn primary" data-box-copy="${box}">${ICONS.copy} 复制</button>
            <button type="button" class="mini-pill-btn" data-box-dialect="${box}">转语法</button>
          </div>
        </div>

        ${!isSrc ? `
          ${renderUnifiedActionBar(box, tokens, isMobile)}
          <div class="capsule-pool">
            ${tokens.length ? tokens.map((tok) => {
              const isSel = state.selectedToken && state.selectedToken.box === box && state.selectedToken.tokenId === tok.id;
              const semClass = classifySemantic(tok);
              const label = tok.kind === 'snippet'
                ? `🧩 ${getSnippet(tok.snippetId)?.name || '未知积木'}`
                : tok.text;
              const hasWeight = Math.abs(tok.weight - 1.0) > 0.01;
              return `
                <button type="button" class="sem-capsule ${semClass} ${isSel ? 'selected-cap' : ''} ${tok.muted ? 'muted-cap' : ''}" data-cap-box="${box}" data-cap-id="${tok.id}">
                  <span>${esc(label)}</span>
                  ${hasWeight ? `<span class="cap-weight-badge">${tok.weight.toFixed(2)}×</span>` : ''}
                </button>
              `;
            }).join('') : `<span style="font-size:12px;color:var(--text-muted);padding:6px;">暂无词条，可在下方输入回车添加或从左下角点击积木织入</span>`}
          </div>
          <div class="add-token-row">
            <input type="text" class="add-token-input" data-add-input="${box}" placeholder="输入词条回车添加（如 artist:rei 或 1.2::rim light::）">
            <button type="button" class="mini-pill-btn" data-add-submit="${box}">添加</button>
          </div>
        ` : `
          <textarea class="source-textarea" data-src-area="${box}">${esc(tokensToSource(tokens))}</textarea>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-sub);">
            <span>支持 [[🧩 积木名]]、1.2::tag::、~~静音~~ 双向无损解析</span>
            <button type="button" class="mini-pill-btn primary" data-src-apply="${box}">应用源码到胶囊</button>
          </div>
        `}

        <div style="font-size:10.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${esc(compiled)}">
          输出预览 (${esc(sch.shortName)})：${esc(compiled || '（空）')}
        </div>
      </div>
    `;
  }

  function renderParamsSectionHtml(rec) {
    const sch = getSchema(rec.schemaId);
    return `
      <div class="params-bento">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12.5px;font-weight:700;">🎛️ 动态参数面板 · ${esc(sch.shortName)}</span>
          <span style="font-size:11px;color:var(--text-sub);">松针绿=安全 · 暖珊瑚=超区间提示</span>
        </div>

        ${sch.fields.map((f) => {
          const val = rec.params[f.key] !== undefined ? rec.params[f.key] : (f.type === 'slider' ? f.safeMin : f.type === 'select' ? f.options[0] : true);
          if (f.type === 'slider') {
            const outSafe = (f.safeMin !== undefined && val < f.safeMin) || (f.safeMax !== undefined && val > f.safeMax);
            return `
              <div class="param-card-row ${outSafe ? 'out-of-safe' : ''}">
                <div class="param-top">
                  <span class="param-name">${esc(f.label)}</span>
                  <span class="param-val-pill">${val}${esc(f.unit || '')}</span>
                </div>
                <input type="range" class="param-range" data-param-key="${esc(f.key)}" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}">
                <div class="param-safe-hint">
                  <span>安全区间：${f.safeMin}–${f.safeMax}${esc(f.unit || '')}</span>
                  <span>${outSafe ? '⚠️ 超出推荐安全区间' : (esc(f.hint || '安全区间内'))}</span>
                </div>
              </div>
            `;
          }
          if (f.type === 'select') {
            return `
              <div class="param-card-row">
                <div class="param-top">
                  <span class="param-name">${esc(f.label)}</span>
                </div>
                <div class="chip-options-wrap">
                  ${f.options.map((opt) => `
                    <button type="button" class="param-chip-opt ${val === opt ? 'active' : ''}" data-param-select="${esc(f.key)}" data-param-val="${esc(opt)}">${esc(opt)}</button>
                  `).join('')}
                </div>
              </div>
            `;
          }
          return `
            <div class="param-card-row" style="flex-direction:row;align-items:center;justify-content:space-between;">
              <div>
                <div class="param-name">${esc(f.label)}</div>
                <div style="font-size:10.5px;color:var(--text-sub);">${esc(f.hint || '')}</div>
              </div>
              <button type="button" class="toggle-switch ${val ? 'on' : ''}" data-param-toggle="${esc(f.key)}" aria-label="${esc(f.label)}"></button>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

          <div style="background:var(--bg-island);border-radius:16px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-card);">
            <div style="font-size:11px;font-weight:700;color:var(--coral-dark);">🧩 随手积木快捷织入（点击直接加入）</div>
            <div class="tag-bubbles-row" style="gap:6px;">
              ${state.snippets.map((s) => `
                <button type="button" class="shelf-block" data-mob-weave="${s.id}" style="flex-shrink:0;padding:5px 9px;">
                  <span style="font-size:11.5px;font-weight:650;color:var(--coral-dark);">+ 🧩 ${esc(s.name)}</span>
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${renderPromptSectionHtml(rec, 'pos', isMobile)}
        ${renderPromptSectionHtml(rec, 'neg', isMobile)}
        ${renderParamsSectionHtml(rec)}
      </div>
    `;

    // 绑定所有编辑器交互
    const titleInp = container.querySelector(isMobile ? '#mobTitleInp' : '#deskTitleInp');
    titleInp.addEventListener('input', (e) => {
      rec.title = e.target.value;
      if (!isMobile) renderDesktopMainStage();
    });

    const closeBtn = container.querySelector(isMobile ? '#mobCloseEditorBtn' : '#deskCloseEditorBtn');
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        if (isMobile) {
          state.mobileEditorOpen = false;
          renderMobile();
        } else {
          state.editorOpen = false;
          renderAll();
        }
      });
    }

    container.querySelector('[data-ed-star]').addEventListener('click', () => {
      rec.favorite = !rec.favorite;
      renderAll();
    });

    container.querySelectorAll('[data-ed-compare]').forEach((b) => b.addEventListener('click', () => openCompareModal(rec)));

    container.querySelector('[data-ed-clone]').addEventListener('click', () => {
      const nextSch = state.schemas.find((s) => s.id !== rec.schemaId) || state.schemas[0];
      cloneRecipeToSchema(rec.id, nextSch.id);
    });

    container.querySelector('[data-ed-schema]').addEventListener('change', (e) => {
      rec.schemaId = e.target.value;
      rec.params = { ...buildDefaultParams(getSchema(rec.schemaId)), ...rec.params };
      showToast(`已切换底模为「${getSchema(rec.schemaId).shortName}」`);
      renderAll();
    });

    container.querySelectorAll('[data-ed-variant]').forEach((b) => b.addEventListener('click', () => {
      rec.activeVariant = parseInt(b.getAttribute('data-ed-variant'), 10);
      renderAll();
    }));

    container.querySelectorAll('[data-mob-weave]').forEach((b) => b.addEventListener('click', () => {
      weaveSnippetIntoActive(b.getAttribute('data-mob-weave'));
    }));

    // 胶囊点击选中
    container.querySelectorAll('.sem-capsule').forEach((cap) => cap.addEventListener('click', () => {
      const box = cap.getAttribute('data-cap-box');
      const tokenId = cap.getAttribute('data-cap-id');
      if (state.selectedToken && state.selectedToken.box === box && state.selectedToken.tokenId === tokenId) {
        state.selectedToken = null;
      } else {
        state.selectedToken = { box, tokenId };
      }
      renderAll();
    }));

    // 统一操作栏动作
    container.querySelectorAll('[data-uab-act]').forEach((btn) => btn.addEventListener('click', () => {
      const bar = btn.closest('[data-uab-box]');
      mutateSelectedToken(bar.getAttribute('data-uab-box'), btn.getAttribute('data-uab-act'));
    }));

    // 源码切换 / 应用
    container.querySelectorAll('[data-toggle-src]').forEach((btn) => btn.addEventListener('click', () => {
      const box = btn.getAttribute('data-toggle-src');
      if (state.sourceMode[box]) {
        const area = container.querySelector(`[data-src-area="${box}"]`);
        if (area) {
          const parsed = sourceToTokens(area.value);
          if (box === 'pos') rec.posTokens = parsed;
          else rec.negTokens = parsed;
        }
      }
      state.sourceMode[box] = !state.sourceMode[box];
      state.selectedToken = null;
      renderAll();
    }));

    container.querySelectorAll('[data-src-apply]').forEach((btn) => btn.addEventListener('click', () => {
      const box = btn.getAttribute('data-src-apply');
      const area = container.querySelector(`[data-src-area="${box}"]`);
      const parsed = sourceToTokens(area.value);
      if (box === 'pos') rec.posTokens = parsed;
      else rec.negTokens = parsed;
      state.sourceMode[box] = false;
      showToast('已无损解析源码为彩色语义胶囊');
      renderAll();
    }));

    // 回车快速加词
    container.querySelectorAll('[data-add-input]').forEach((inp) => {
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addTokenToBox(inp.getAttribute('data-add-input'), inp.value);
        }
      });
    });

    container.querySelectorAll('[data-add-submit]').forEach((btn) => btn.addEventListener('click', () => {
      const box = btn.getAttribute('data-add-submit');
      const inp = container.querySelector(`[data-add-input="${box}"]`);
      if (inp) addTokenToBox(box, inp.value);
    }));

    // 多选导入积木 & 复制 & 转语法
    container.querySelectorAll('[data-open-import]').forEach((btn) => btn.addEventListener('click', () => {
      openMultiImportModal(rec, btn.getAttribute('data-open-import'));
    }));

    container.querySelectorAll('[data-box-copy]').forEach((btn) => btn.addEventListener('click', () => {
      const box = btn.getAttribute('data-box-copy');
      const toks = box === 'pos' ? rec.posTokens : rec.negTokens;
      copyText(compileTokens(toks, sch.dialect), `已按 ${sch.shortName} 格式复制${box === 'pos' ? '正面' : '负面'}提示词`);
    }));

    container.querySelectorAll('[data-box-dialect]').forEach((btn) => btn.addEventListener('click', () => {
      const box = btn.getAttribute('data-box-dialect');
      const toks = box === 'pos' ? rec.posTokens : rec.negTokens;
      openDialectPopover(btn, toks, box === 'pos' ? '正面词' : '负面词');
    }));

    // 动态参数事件
    container.querySelectorAll('[data-param-key]').forEach((rng) => {
      rng.addEventListener('input', (e) => {
        const key = rng.getAttribute('data-param-key');
        rec.params[key] = parseFloat(e.target.value);
        // 局部刷新动态参数区以保持流畅拖拽
        const row = rng.closest('.param-card-row');
        const valPill = row.querySelector('.param-val-pill');
        const hintEl = row.querySelector('.param-safe-hint span:last-child');
        const field = getSchema(rec.schemaId).fields.find((f) => f.key === key);
        const outSafe = field && ((field.safeMin !== undefined && rec.params[key] < field.safeMin) || (field.safeMax !== undefined && rec.params[key] > field.safeMax));
        row.classList.toggle('out-of-safe', Boolean(outSafe));
        if (valPill) valPill.textContent = `${rec.params[key]}${field?.unit || ''}`;
        if (hintEl) hintEl.textContent = outSafe ? '⚠️ 超出推荐安全区间' : (field?.hint || '安全区间内');
      });
    });

    container.querySelectorAll('[data-param-select]').forEach((btn) => btn.addEventListener('click', () => {
      rec.params[btn.getAttribute('data-param-select')] = btn.getAttribute('data-param-val');
      renderAll();
    }));

    container.querySelectorAll('[data-param-toggle]').forEach((btn) => btn.addEventListener('click', () => {
      const k = btn.getAttribute('data-param-toggle');
      rec.params[k] = !rec.params[k];
      renderAll();
    }));
  }

              <select class="schema-select-pill" id="cmpRightRecSel" style="width:52%;padding:4px 8px;">
                ${state.recipes.map((r) => `<option value="${r.id}" ${r.id === rightRec.id ? 'selected' : ''}>${esc(r.title.split('·')[0].trim())}</option>`).join('')}

      card.querySelector('#cmpRightVSel').addEventListener('change', (e) => { rightV = parseInt(e.target.value, 10); renderCmp(); });
      requestAnimationFrame(hydrateAllCanvases);

  /* =========================================================================
     12. Android 移动端 393×852 渲染与自适配缩放
     ========================================================================= */
  function updateMobileScale() {
    if (state.viewport !== 'mobile') return;
    const stage = document.getElementById('mobileStage');
    const wrap = document.getElementById('phoneScaleWrap');
    if (!stage || !wrap) return;
    const availH = stage.clientHeight - 76;
    const availW = stage.clientWidth - 24;
    const scale = Math.min(1, availH / 852, availW / 393);
    wrap.style.transform = `scale(${Math.max(0.55, scale).toFixed(3)})`;
  }

        <div class="search-capsule" style="flex:none;padding:7px 12px;">
          ${ICONS.search}
          <input type="text" id="mobSearchInp" value="${esc(state.search)}" placeholder="搜索画师串 / 标签...">
        </div>
        <div class="tag-bubbles-row" style="flex-shrink:0;">
          ${allTags.map((t) => `<button type="button" class="tag-bubble ${state.activeTag === t ? 'active' : ''}" data-mob-tag="${esc(t)}">${t === '全部' ? '全部' : '#' + esc(t)}</button>`).join('')}
        </div>
        <div class="phone-masonry-2" id="mobMasonryArea"></div>
      `;

      const paintMobileMasonry = () => {
        const list = getFilteredRecipes();
        const col0 = list.filter((_, i) => i % 2 === 0);
        const col1 = list.filter((_, i) => i % 2 === 1);
        const area = body.querySelector('#mobMasonryArea');
        area.innerHTML = `
          <div class="masonry-col">${col0.map((r) => renderRecipeCardHtml(r, state.galleryMode, true)).join('')}</div>
          <div class="masonry-col">${col1.map((r) => renderRecipeCardHtml(r, state.galleryMode, true)).join('')}</div>
        `;
        bindRecipeCardEvents(area, true);
        requestAnimationFrame(hydrateAllCanvases);
      };
      paintMobileMasonry();

      body.querySelector('#mobSearchInp').addEventListener('input', (e) => {
        state.search = e.target.value;
        paintMobileMasonry();
      });
      body.querySelectorAll('[data-mob-tag]').forEach((b) => b.addEventListener('click', () => {
        state.activeTag = b.getAttribute('data-mob-tag');
        body.querySelectorAll('[data-mob-tag]').forEach((t) => t.classList.toggle('active', t.getAttribute('data-mob-tag') === state.activeTag));
        paintMobileMasonry();
      }));
    } else if (state.activePage === 'snippets') {
      renderSnippetsView(body, true);
    } else if (state.activePage === 'inspector') {
      renderInspectorView(body, true);
    } else if (state.activePage === 'schemas') {
      renderSchemasView(body, true);
    } else if (state.activePage === 'sync') {
      renderSyncView(body, true);
    }

    const navItems = [
      { id: 'gallery', label: '画廊', icon: ICONS.gallery },
      { id: 'snippets', label: '积木', icon: ICONS.snippets },
      { id: 'inspector', label: '透镜', icon: ICONS.inspector },
      { id: 'schemas', label: '底模', icon: ICONS.schemas },
      { id: 'sync', label: '同步', icon: ICONS.sync }
    ];
    nav.innerHTML = navItems.map((n) => `
      <button type="button" class="phone-nav-btn ${state.activePage === n.id ? 'active' : ''}" data-mob-nav="${n.id}">
        ${n.icon}
        <span>${n.label}</span>
      </button>
    `).join('');
    nav.querySelectorAll('[data-mob-nav]').forEach((b) => b.addEventListener('click', () => {
      state.activePage = b.getAttribute('data-mob-nav');
      state.mobileEditorOpen = false;
      renderMobile();
      requestAnimationFrame(hydrateAllCanvases);
    }));

    const rec = getActiveRecipe();
    if (state.mobileEditorOpen && rec) {
      sheet.classList.remove('closed');
      renderEditorInner(sheet, rec, true);
    } else {
      sheet.classList.add('closed');
    }
    updateMobileScale();
  }

  /* =========================================================================
     13. 总渲染入口与全局监听器
     ========================================================================= */
  function renderAll() {
    const app = document.getElementById('slApp');
    app.setAttribute('data-viewport', state.viewport);

    if (state.viewport === 'desktop') {
      renderDesktopSidebar();
      renderDesktopTopControl();
      renderDesktopMainStage();
      renderDesktopEditor();
    } else {
      renderMobile();
    }
    requestAnimationFrame(hydrateAllCanvases);
  }

  document.getElementById('exitMobileBtn').addEventListener('click', () => {
    state.viewport = 'desktop';
    state.mobileEditorOpen = false;
    renderAll();
  });

  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modalBackdrop') closeModal();
  });

  document.addEventListener('click', (e) => {
    const pop = document.getElementById('dialectPopover');
    if (!pop.classList.contains('hidden') && !pop.contains(e.target) && !e.target.closest('[data-copy-dialect], [data-box-dialect], [data-snp-dialect], #inspDialectPos, #inspDialectNeg')) {
      pop.classList.add('hidden');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      document.getElementById('dialectPopover').classList.add('hidden');
    }
  });

  window.addEventListener('resize', () => {
    updateMobileScale();
    hydrateAllCanvases();
  });

  renderAll();
})();
</script>
</body>
</html>
