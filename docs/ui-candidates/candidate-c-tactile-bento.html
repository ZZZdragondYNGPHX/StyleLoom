<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleLoom（画风织机）· 方案 C：柔雾便签 Tactile Bento Studio</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }

  .sl-bento {
    min-height: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;

    /* 护眼鼠尾草灰绿 × 柔雾白瓷色板 */
    --bg-canvas: #E8EEEA;
    --bg-island: #F9FBF9;
    --bg-surface: #FFFFFF;
    --bg-well: #EEF4F0;
    --bg-well-hover: #E4EDE7;
    --text-main: #1D2622;
    --text-sub: #67756E;
    --text-muted: #8E9C95;

    --pine: #357A66;
    --pine-dark: #275C4D;
    --pine-soft: #E5F1EC;
    --pine-border: rgba(53, 122, 102, 0.24);

    --coral: #D97757;
    --coral-dark: #B6583A;
    --coral-soft: #FDEFE9;
    --coral-border: rgba(217, 119, 87, 0.35);

    --indigo: #5B6AD0;
    --indigo-dark: #414FB2;
    --indigo-soft: #EEF0FC;
    --indigo-border: rgba(91, 106, 208, 0.28);

    --amber: #D9822B;
    --amber-soft: #FDF2E4;

    --shadow-island: 0 8px 28px rgba(29, 38, 34, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --shadow-card: 0 4px 16px rgba(29, 38, 34, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    --shadow-lift: 0 12px 30px rgba(29, 38, 34, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.92);
    --border-porcelain: 1px solid rgba(255, 255, 255, 0.85);
    --border-soft: 1px solid rgba(29, 38, 34, 0.06);

    --radius-island: 22px;
    --radius-card: 18px;
    --radius-sm: 12px;
    --radius-pill: 999px;

    --font-sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", "Cascadia Code", Consolas, monospace;

    font-family: var(--font-sans);
    color: var(--text-main);
    background:
      radial-gradient(circle at 12% 16%, rgba(255, 255, 255, 0.58) 0%, transparent 42%),
      radial-gradient(circle at 86% 84%, rgba(53, 122, 102, 0.09) 0%, transparent 48%),
      radial-gradient(circle at 52% 48%, rgba(217, 119, 87, 0.04) 0%, transparent 55%),
      var(--bg-canvas);
    box-sizing: border-box;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  .sl-bento *, .sl-bento *::before, .sl-bento *::after {
    box-sizing: border-box;
  }

  .sl-bento input, .sl-bento textarea, .sl-bento select {
    font-family: inherit;
    color: var(--text-main);
  }

  .sl-bento button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
    padding: 0;
  }

  /* 柔和自定义滚动条 */
  .sl-scroll {
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(103, 117, 110, 0.25) transparent;
  }
  .sl-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .sl-scroll::-webkit-scrollbar-track { background: transparent; }
  .sl-scroll::-webkit-scrollbar-thumb {
    background: rgba(103, 117, 110, 0.24);
    border-radius: 999px;
  }
  .sl-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(103, 117, 110, 0.42);
  }

  /* 通用 Bento 岛屿容器 */
  .bento-island {
    background: var(--bg-island);
    border-radius: var(--radius-island);
    border: var(--border-porcelain);
    box-shadow: var(--shadow-island);
  }

  .bento-subcard {
    background: var(--bg-surface);
    border-radius: var(--radius-card);
    border: var(--border-porcelain);
    box-shadow: var(--shadow-card);
  }

  /* 桌面端三岛空间布局 */
  .desktop-shell {
    flex: 1;
    min-height: 0;
    display: flex;
    padding: 12px;
    gap: 12px;
  }

  .sl-bento[data-viewport="mobile"] .desktop-shell { display: none; }
  .sl-bento[data-viewport="desktop"] .mobile-stage { display: none; }

  /* 1. 左侧 Arc 式悬浮导航岛 */
  .nav-island {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
    min-height: 0;
  }

  .brand-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px;
  }

  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 13px;
    background: linear-gradient(145deg, #3D8A73, #2B6554);
    box-shadow: 0 4px 12px rgba(53, 122, 102, 0.28), inset 0 1px 0 rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    flex-shrink: 0;
  }

  .brand-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 2px;
  }

  .nav-upper {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-right: 2px;
  }

  .nav-group-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 0 8px;
    margin-bottom: 4px;
    letter-spacing: 0.03em;
  }

  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-sub);
    transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    text-align: left;
  }

  .nav-pill:hover {
    background: var(--bg-well);
    color: var(--text-main);
    transform: translateX(2px);
  }

  .nav-pill.active {
    background: var(--pine);
    color: #FFFFFF;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(53, 122, 102, 0.25);
  }

  .nav-pill .pill-count {
    margin-left: auto;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: var(--radius-pill);
    background: rgba(29, 38, 34, 0.06);
    color: var(--text-sub);
    font-weight: 600;
  }

  .nav-pill.active .pill-count {
    background: rgba(255, 255, 255, 0.22);
    color: #FFFFFF;
  }

  .filter-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 12px;
    font-size: 12.5px;
    color: var(--text-sub);
    transition: all 0.16s ease;
    text-align: left;
  }

  .filter-pill:hover {
    background: var(--bg-well);
    color: var(--text-main);
  }

  .filter-pill.active {
    background: var(--pine-soft);
    color: var(--pine-dark);
    font-weight: 600;
  }

  .filter-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }

  .filter-pill.active .filter-dot {
    background: var(--pine);
  }

  .filter-pill .pill-count {
    margin-left: auto;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: var(--radius-pill);
    background: rgba(255, 255, 255, 0.78);
    color: var(--text-sub);
    font-weight: 600;
  }

  /* 左下角独创：常驻随手积木抽屉 */
  .quick-shelf {
    background: var(--bg-well);
    border-radius: 18px;
    padding: 11px;
    border: 1px solid rgba(255, 255, 255, 0.78);
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 288px;
    min-height: 180px;
  }

  .shelf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .shelf-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .shelf-target-switch {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.7);
    border-radius: var(--radius-pill);
    padding: 2px;
    gap: 2px;
  }

  .shelf-target-btn {
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: var(--radius-pill);
    color: var(--text-sub);
    transition: all 0.15s ease;
  }

  .shelf-target-btn.active {
    background: var(--coral);
    color: #FFFFFF;
    box-shadow: 0 2px 6px rgba(217, 119, 87, 0.25);
  }

  .shelf-hint {
    font-size: 10.5px;
    color: var(--text-sub);
    line-height: 1.35;
  }

  .shelf-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-height: 0;
  }

  .shelf-block {
    background: linear-gradient(135deg, #FFF7F4 0%, #FCEEE9 100%);
    border: 1px dashed var(--coral-border);
    border-radius: 13px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-align: left;
    transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 2px 8px rgba(217, 119, 87, 0.06);
  }

  .shelf-block:hover {
    transform: translateY(-1px);
    background: linear-gradient(135deg, #FFF2EC 0%, #FADFD4 100%);
    box-shadow: 0 5px 14px rgba(217, 119, 87, 0.14);
  }

  .shelf-block:active {
    transform: scale(0.97);
  }

  .shelf-block-icon {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    background: rgba(217, 119, 87, 0.15);
    color: var(--coral-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
  }

  .shelf-block-info {
    min-width: 0;
    flex: 1;
  }

  .shelf-block-name {
    font-size: 12px;
    font-weight: 650;
    color: var(--coral-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .shelf-block-meta {
    font-size: 10px;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  .shelf-block-plus {
    font-size: 11px;
    font-weight: 700;
    color: var(--coral-dark);
    background: rgba(255, 255, 255, 0.8);
    padding: 2px 7px;
    border-radius: var(--radius-pill);
    flex-shrink: 0;
  }

  /* 2. 中央主内容 Bento 岛 */
  .main-column {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .top-control-island {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .search-capsule {
    flex: 1;
    min-width: 200px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-well);
    border-radius: var(--radius-pill);
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.85);
    transition: all 0.16s ease;
  }

  .search-capsule:focus-within {
    background: #FFFFFF;
    box-shadow: 0 0 0 3px rgba(53, 122, 102, 0.14);
  }

  .search-capsule input {
    border: none;
    background: transparent;
    outline: none;
    font-size: 13px;
    width: 100%;
  }

  .search-capsule input::placeholder { color: var(--text-muted); }

  /* 胶囊分段控件 */
  .seg-pill {
    display: inline-flex;
    align-items: center;
    background: var(--bg-well);
    padding: 3px;
    border-radius: var(--radius-pill);
    gap: 2px;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  .seg-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 11px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-sub);
    transition: all 0.16s ease;
    white-space: nowrap;
  }

  .seg-btn:hover { color: var(--text-main); }

  .seg-btn.active {
    background: #FFFFFF;
    color: var(--text-main);
    box-shadow: 0 2px 8px rgba(29, 38, 34, 0.08);
  }

  .seg-btn.active-pine {
    background: var(--pine);
    color: #FFFFFF;
    box-shadow: 0 3px 10px rgba(53, 122, 102, 0.25);
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-pill);
    background: var(--pine);
    color: #FFFFFF;
    font-size: 12.5px;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(53, 122, 102, 0.24);
    transition: all 0.16s ease;
    white-space: nowrap;
  }

  .btn-primary:hover {
    background: var(--pine-dark);
    transform: translateY(-1px);
  }

  .btn-primary:active { transform: scale(0.97); }

  .btn-soft {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: var(--radius-pill);
    background: var(--bg-well);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.8);
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .btn-soft:hover {
    background: var(--bg-well-hover);
    transform: translateY(-1px);
  }

  .btn-coral {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: var(--radius-pill);
    background: var(--coral-soft);
    color: var(--coral-dark);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--coral-border);
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .btn-coral:hover {
    background: #F9DFD4;
    transform: translateY(-1px);
  }

  /* 标签气泡行 */
  .tag-bubbles-row {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .tag-bubbles-row::-webkit-scrollbar { display: none; }

  .tag-bubble {
    padding: 5px 11px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 500;
    background: var(--bg-well);
    color: var(--text-sub);
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .tag-bubble:hover {
    background: var(--bg-well-hover);
    color: var(--text-main);
  }

  .tag-bubble.active {
    background: var(--pine-soft);
    color: var(--pine-dark);
    font-weight: 650;
    box-shadow: inset 0 0 0 1px var(--pine-border);
  }

  /* 主内容滚动 Bento 岛 */
  .main-stage-island {
    flex: 1;
    min-height: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }

  /* 瀑布流多列排布（按真实瀑布流分列渲染确保卡片稳定不跳动） */
  .masonry-grid {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    width: 100%;
  }

  .masonry-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* 画师串卡片 */
  .recipe-card {
    background: var(--bg-surface);
    border-radius: 20px;
    border: var(--border-porcelain);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
    position: relative;
  }

  .recipe-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lift);
  }

  .recipe-card.selected {
    box-shadow: 0 0 0 2.5px var(--pine), 0 14px 32px rgba(53, 122, 102, 0.16);
  }

  .card-art-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #DCE5DF;
    border-radius: 18px;
  }

  .recipe-card.memo-mode .card-art-wrap {
    border-radius: 18px 18px 14px 14px;
    margin: 6px 6px 0 6px;
    width: calc(100% - 12px);
  }

  .card-art-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .card-top-badges {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }

  .model-glass-pill {
    pointer-events: auto;
    font-size: 11px;
    font-weight: 650;
    padding: 4px 9px;
    border-radius: var(--radius-pill);
    background: rgba(249, 251, 249, 0.84);
    backdrop-filter: blur(8px);
    color: var(--text-main);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .star-glass-btn {
    pointer-events: auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(249, 251, 249, 0.84);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    transition: transform 0.15s ease;
  }

  .star-glass-btn:hover { transform: scale(1.08); }
  .star-glass-btn.starred { color: #E2A329; }

  .variant-dots-mini {
    position: absolute;
    bottom: 10px;
    right: 10px;
    display: flex;
    gap: 4px;
    background: rgba(29, 38, 34, 0.42);
    backdrop-filter: blur(6px);
    padding: 4px 7px;
    border-radius: var(--radius-pill);
  }

  .variant-dot-mini {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
  }
  .variant-dot-mini.active { background: #FFFFFF; width: 12px; border-radius: 99px; }

  /* 纯图模式下底部轻量标题与悬停快捷栏 */
  .pure-overlay {
    position: absolute;
    inset: auto 0 0 0;
    padding: 26px 10px 10px 10px;
    background: linear-gradient(to top, rgba(20, 27, 24, 0.72) 0%, rgba(20, 27, 24, 0.25) 62%, transparent 100%);
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .pure-title {
    font-size: 12.5px;
    font-weight: 650;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    padding-right: 44px;
  }

  .pure-hover-bar {
    display: flex;
    align-items: center;
    gap: 5px;
    opacity: 0;
    transform: translateY(4px);
    transition: all 0.18s ease;
  }

  .recipe-card:hover .pure-hover-bar {
    opacity: 1;
    transform: translateY(0);
  }

  .hover-copy-chip {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: var(--radius-pill);
    background: rgba(249, 251, 249, 0.92);
    color: var(--text-main);
    box-shadow: 0 2px 6px rgba(0,0,0,0.16);
    transition: background 0.14s ease;
  }

  .hover-copy-chip:hover { background: #FFFFFF; color: var(--pine-dark); }

  /* 便签卡模式：卡片下方素雅便签条 */
  .memo-strip {
    padding: 10px 12px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .memo-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .memo-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .memo-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .memo-chip {
    font-size: 11px;
    font-weight: 550;
    padding: 3px 8px;
    border-radius: var(--radius-pill);
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .memo-chip.kind-indigo { background: var(--indigo-soft); color: var(--indigo-dark); }
  .memo-chip.kind-coral { background: var(--coral-soft); color: var(--coral-dark); border: 1px dashed var(--coral-border); }
  .memo-chip.kind-pine { background: var(--pine-soft); color: var(--pine-dark); }
  .memo-chip.kind-neutral { background: var(--bg-well); color: var(--text-sub); }

  .memo-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-top: 2px;
  }

  .memo-quick-copy {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 10px;
    border-radius: var(--radius-pill);
    background: var(--pine-soft);
    color: var(--pine-dark);
    font-size: 11.5px;
    font-weight: 650;
    transition: all 0.15s ease;
  }

  .memo-quick-copy:hover {
    background: var(--pine);
    color: #FFFFFF;
  }

  .memo-sub-btn {
    padding: 6px 9px;
    border-radius: var(--radius-pill);
    background: var(--bg-well);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
  }

  .memo-sub-btn:hover { background: var(--bg-well-hover); color: var(--text-main); }

  /* 3. 右侧悬浮 Bento 编辑抽屉 */
  .editor-island {
    width: 440px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 14px;
    gap: 12px;
  }

  .editor-island.collapsed { display: none; }

  .editor-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .editor-title-input {
    flex: 1;
    min-width: 0;
    font-size: 15.5px;
    font-weight: 700;
    border: none;
    background: transparent;
    padding: 4px 8px;
    border-radius: 10px;
    outline: none;
    transition: background 0.15s ease;
  }

  .editor-title-input:hover, .editor-title-input:focus {
    background: var(--bg-well);
  }

  .icon-pill-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-well);
    color: var(--text-sub);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }

  .icon-pill-btn:hover { background: var(--bg-well-hover); color: var(--text-main); }
  .icon-pill-btn.starred { color: #E2A329; background: #FDF5DF; }

  .editor-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 3px;
  }

  /* 预览图轮播 Bento 盒 */
  .preview-bento {
    background: var(--bg-well);
    border-radius: 18px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .preview-stage {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .preview-main-wrap {
    width: 148px;
    height: 188px;
    border-radius: 14px;
    overflow: hidden;
    background: #DCE5DF;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(29, 38, 34, 0.08);
  }

  .preview-side-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
  }

  .schema-select-pill {
    width: 100%;
    padding: 7px 10px;
    border-radius: 12px;
    border: 1px solid rgba(29, 38, 34, 0.08);
    background: #FFFFFF;
    font-size: 12px;
    font-weight: 650;
    outline: none;
    cursor: pointer;
  }

  .variant-thumbs {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .variant-thumb-btn {
    padding: 4px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.72);
    color: var(--text-sub);
    transition: all 0.15s ease;
  }

  .variant-thumb-btn.active {
    background: var(--pine);
    color: #FFFFFF;
  }

  /* 提示词 Bento 区块 */
  .prompt-bento {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 12px;
    border: var(--border-porcelain);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .prompt-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-wrap: wrap;
  }

  .prompt-label {
    font-size: 12.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot-pos { width: 8px; height: 8px; border-radius: 50%; background: var(--pine); }
  .dot-neg { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }

  .prompt-head-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }

  .mini-pill-btn {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: var(--radius-pill);
    background: var(--bg-well);
    color: var(--text-sub);
    transition: all 0.14s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .mini-pill-btn:hover { background: var(--bg-well-hover); color: var(--text-main); }
  .mini-pill-btn.active { background: var(--pine-soft); color: var(--pine-dark); }
  .mini-pill-btn.primary { background: var(--pine); color: #FFFFFF; }
  .mini-pill-btn.primary:hover { background: var(--pine-dark); }

  /* 独创：顶部统一操作栏（Unified Capsule Action Bar） */
  .unified-action-bar {
    background: var(--bg-well);
    border-radius: 14px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    min-height: 40px;
    transition: all 0.18s ease;
  }

  .unified-action-bar.active-bar {
    background: #E6F1EC;
    box-shadow: inset 0 0 0 1px var(--pine-border);
  }

  .uab-hint {
    font-size: 11px;
    color: var(--text-sub);
    padding: 2px 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .uab-btn {
    height: 28px;
    padding: 0 9px;
    border-radius: 10px;
    background: #FFFFFF;
    color: var(--text-main);
    font-size: 11.5px;
    font-weight: 650;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    box-shadow: 0 1px 3px rgba(29, 38, 34, 0.08);
    transition: all 0.12s ease;
  }

  .uab-btn:hover { background: var(--pine); color: #FFFFFF; transform: translateY(-1px); }
  .uab-btn:active { transform: scale(0.96); }
  .uab-btn.uab-coral { background: var(--coral-soft); color: var(--coral-dark); }
  .uab-btn.uab-coral:hover { background: var(--coral); color: #FFFFFF; }
  .uab-btn.uab-danger { color: #B84234; }
  .uab-btn.uab-danger:hover { background: #C94A3B; color: #FFFFFF; }

  .uab-weight-readout {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--pine-dark);
    padding: 0 5px;
    min-width: 44px;
    text-align: center;
  }

  .uab-sep {
    width: 1px;
    height: 16px;
    background: rgba(29, 38, 34, 0.12);
    margin: 0 2px;
  }

  /* 语义磁吸干净胶囊池（没有任何内部小按钮！） */
  .capsule-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 44px;
    padding: 4px 2px;
  }

  .sem-capsule {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 11px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
    transition: all 0.15s cubic-bezier(0.22, 1, 0.36, 1);
    max-width: 100%;
    text-align: left;
  }

  .sem-capsule:hover { transform: translateY(-1px); }

  .sem-capsule.sem-indigo {
    background: var(--indigo-soft);
    color: var(--indigo-dark);
    border: 1px solid var(--indigo-border);
  }

  .sem-capsule.sem-coral {
    background: linear-gradient(135deg, #FFF5F1 0%, #FCEBE4 100%);
    color: var(--coral-dark);
    border: 1.5px dashed var(--coral-border);
  }

  .sem-capsule.sem-pine {
    background: var(--pine-soft);
    color: var(--pine-dark);
    border: 1px solid var(--pine-border);
  }

  .sem-capsule.sem-neutral {
    background: var(--bg-well);
    color: var(--text-main);
    border: 1px solid rgba(29, 38, 34, 0.08);
  }

  .sem-capsule.selected-cap {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 0 0 2.5px var(--pine), 0 6px 14px rgba(53, 122, 102, 0.18);
    z-index: 2;
  }

  .sem-capsule.sem-coral.selected-cap {
    box-shadow: 0 0 0 2.5px var(--coral), 0 6px 14px rgba(217, 119, 87, 0.22);
  }

  .sem-capsule.muted-cap {
    opacity: 0.45;
    text-decoration: line-through;
    text-decoration-style: dashed;
    border-style: dashed;
  }

  .cap-weight-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.85);
    color: var(--text-main);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .add-token-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .add-token-input {
    flex: 1;
    min-width: 0;
    background: var(--bg-well);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    padding: 7px 12px;
    font-size: 12px;
    outline: none;
    transition: all 0.15s ease;
  }

  .add-token-input:focus {
    background: #FFFFFF;
    border-color: var(--pine-border);
    box-shadow: 0 0 0 3px rgba(53, 122, 102, 0.12);
  }

  .source-textarea {
    width: 100%;
    min-height: 92px;
    border-radius: 14px;
    border: 1px solid rgba(29, 38, 34, 0.1);
    background: var(--bg-well);
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
  }

  .source-textarea:focus {
    background: #FFFFFF;
    border-color: var(--pine);
  }

  /* 动态参数面板 */
  .params-bento {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 12px;
    border: var(--border-porcelain);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .param-card-row {
    background: var(--bg-well);
    border-radius: 14px;
    padding: 9px 11px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .param-card-row.out-of-safe {
    background: var(--coral-soft);
    box-shadow: inset 0 0 0 1px var(--coral-border);
  }

  .param-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .param-name {
    font-size: 12px;
    font-weight: 650;
  }

  .param-val-pill {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    background: var(--pine-soft);
    color: var(--pine-dark);
  }

  .param-card-row.out-of-safe .param-val-pill {
    background: #FFFFFF;
    color: var(--coral-dark);
  }

  .param-range {
    width: 100%;
    accent-color: var(--pine);
    cursor: pointer;
    height: 6px;
  }

  .param-card-row.out-of-safe .param-range {
    accent-color: var(--coral);
  }

  .param-safe-hint {
    font-size: 10.5px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .param-card-row.out-of-safe .param-safe-hint {
    color: var(--coral-dark);
    font-weight: 600;
  }

  .chip-options-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .param-chip-opt {
    padding: 4px 10px;
    border-radius: var(--radius-pill);
    font-size: 11.5px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.78);
    color: var(--text-sub);
    transition: all 0.14s ease;
  }

  .param-chip-opt.active {
    background: var(--pine);
    color: #FFFFFF;
  }

  .toggle-switch {
    width: 40px;
    height: 22px;
    border-radius: var(--radius-pill);
    background: rgba(29, 38, 34, 0.18);
    position: relative;
    transition: background 0.18s ease;
  }

  .toggle-switch.on { background: var(--pine); }

  .toggle-switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    transition: transform 0.18s ease;
  }

  .toggle-switch.on::after { transform: translateX(18px); }

  /* 积木零件盒 / 原图透镜 / 底模工坊 / 云端同步 视图排版 */
  .bento-grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
    gap: 14px;
  }

  .snippet-bento-card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 15px;
    border: var(--border-porcelain);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .snippet-bento-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lift);
  }

  .snippet-cat-pill {
    font-size: 11px;
    font-weight: 650;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    background: var(--coral-soft);
    color: var(--coral-dark);
  }

  .snippet-code-preview {
    background: var(--bg-well);
    border-radius: 12px;
    padding: 9px 11px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--text-main);
    word-break: break-word;
  }

  /* 原图透镜 Bento Split */
  .inspector-layout {
    display: grid;
    grid-template-columns: 310px 1fr;
    gap: 14px;
    align-items: start;
  }

  .drop-zone-card {
    background: var(--bg-well);
    border: 2px dashed rgba(53, 122, 102, 0.35);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    transition: all 0.18s ease;
  }

  .drop-zone-card.dragover {
    background: var(--pine-soft);
    border-color: var(--pine);
  }

  .sample-btn-pill {
    width: 100%;
    padding: 9px 12px;
    border-radius: 14px;
    background: #FFFFFF;
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    text-align: left;
    transition: all 0.15s ease;
  }

  .sample-btn-pill:hover { transform: translateY(-1px); }
  .sample-btn-pill.active {
    background: var(--pine);
    color: #FFFFFF;
  }

  .sticker-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .param-sticker {
    background: var(--bg-well);
    border-radius: 13px;
    padding: 7px 11px;
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    transition: all 0.14s ease;
  }

  .param-sticker:hover { background: var(--pine-soft); }

  .sticker-k { font-size: 10px; color: var(--text-sub); font-weight: 600; }
  .sticker-v { font-size: 12px; font-weight: 700; font-family: var(--font-mono); }

  /* 底模工坊 & 云端同步 */
  .two-col-bento {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 14px;
    align-items: start;
  }

  .form-input {
    width: 100%;
    background: var(--bg-well);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 12.5px;
    outline: none;
    transition: all 0.15s ease;
  }

  .form-input:focus {
    background: #FFFFFF;
    border-color: var(--pine);
    box-shadow: 0 0 0 3px rgba(53, 122, 102, 0.12);
  }

  .sync-log-box {
    background: #232C28;
    color: #DFECE5;
    border-radius: 14px;
    padding: 10px 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.55;
    max-height: 150px;
    overflow-y: auto;
  }

  /* 弹窗 & 下拉 */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(29, 38, 34, 0.34);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 60;
  }

  .modal-backdrop.hidden { display: none; }

  .modal-card {
    background: var(--bg-island);
    border-radius: 24px;
    border: var(--border-porcelain);
    box-shadow: 0 24px 64px rgba(29, 38, 34, 0.22);
    width: min(760px, 100%);
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    padding: 18px;
    gap: 14px;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .modal-title { font-size: 16px; font-weight: 750; }

  .compare-dual-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .compare-pane {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow-card);
  }

  .compare-canvas-box {
    width: 100%;
    height: 310px;
    border-radius: 14px;
    overflow: hidden;
    background: #DCE5DF;
  }

  /* 语法方言选择弹层 */
  .dialect-popover {
    position: fixed;
    z-index: 70;
    background: var(--bg-island);
    border-radius: 18px;
    padding: 8px;
    border: var(--border-porcelain);
    box-shadow: var(--shadow-lift);
    width: 260px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .dialect-popover.hidden { display: none; }

  .dialect-item {
    padding: 8px 10px;
    border-radius: 12px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: background 0.14s ease;
  }
  .dialect-item:hover { background: var(--pine-soft); }
  .dialect-name { font-size: 12px; font-weight: 700; color: var(--text-main); }
  .dialect-sample { font-size: 10.5px; font-family: var(--font-mono); color: var(--text-sub); }

  /* Toast 提示 */
  .sl-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #1D2622;
    color: #F9FBF9;
    padding: 9px 16px;
    border-radius: var(--radius-pill);
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 12px 28px rgba(29, 38, 34, 0.25);
    opacity: 0;
    pointer-events: none;
    transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 90;
    max-width: 90vw;
  }

  .sl-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #5EE0B2;
    flex-shrink: 0;
  }

  /* =========================================================
     Android 移动端 393×852 仿真预览框架
     ========================================================= */
  .mobile-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }

  .mobile-stage-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-island);
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-card);
    border: var(--border-porcelain);
    z-index: 4;
    flex-shrink: 0;
  }

  .phone-scale-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
  }

  .phone-chassis {
    width: 393px;
    height: 852px;
    border-radius: 46px;
    padding: 10px;
    background: linear-gradient(155deg, #32403A 0%, #1F2824 100%);
    box-shadow: 0 28px 70px rgba(29, 38, 34, 0.26), inset 0 0 0 2px rgba(255, 255, 255, 0.14);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .phone-screen {
    flex: 1;
    min-height: 0;
    border-radius: 37px;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.6) 0%, transparent 45%),
      var(--bg-canvas);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .phone-statusbar {
    height: 36px;
    padding: 8px 22px 4px 22px;
    display: flex;
    align-items: center;

  const customImageCache = new Map();

  function hashSeed(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeRng(seed) {
    let s = seed || 1234567;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function drawGrain(ctx, w, h, rng, alpha = 0.035) {
    ctx.save();
    for (let i = 0; i < 420; i++) {
      const x = rng() * w;
      const y = rng() * h;
      const r = 0.6 + rng() * 1.4;
      ctx.fillStyle = rng() > 0.5 ? `rgba(255,255,255,${alpha})` : `rgba(20,25,22,${alpha})`;
      ctx.fillRect(x, y, r, r);
    }
    ctx.restore();
  }

  function paintCyberPortrait(ctx, w, h, v, rng) {
    const palettes = [
      { bg1: '#09111F', bg2: '#132A42', neon1: '#35F2FF', neon2: '#6C73FF', skin: '#DCE6F2', hair: '#152238' },
      { bg1: '#0B1726', bg2: '#1E4658', neon1: '#6EFFD8', neon2: '#63B3FF', skin: '#E6F1F5', hair: '#183344' },
      { bg1: '#120D22', bg2: '#2D1A47', neon1: '#FF5AA5', neon2: '#42E8FF', skin: '#EADDF2', hair: '#1F1336' }
    ];
    const p = palettes[v % 3];

    const sky = ctx.createLinearGradient(0, 0, w * 0.4, h);
    sky.addColorStop(0, p.bg1);
    sky.addColorStop(0.6, p.bg2);
    sky.addColorStop(1, '#060A12');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // 远景赛博高楼霓虹柱
    for (let i = 0; i < 9; i++) {
      const bx = (i / 9) * w + (rng() - 0.5) * 20;
      const bw = 18 + rng() * 34;
      const bh = h * (0.35 + rng() * 0.48);
      ctx.fillStyle = 'rgba(8, 14, 26, 0.55)';
      ctx.fillRect(bx, h - bh, bw, bh);
      ctx.fillStyle = i % 2 === 0 ? `${p.neon1}22` : `${p.neon2}22`;
      ctx.fillRect(bx + bw * 0.25, h - bh + 18, 3, bh * 0.55);
    }

    // 背后全息光环
    const cx = w * (v === 1 ? 0.54 : 0.5);
    const cy = h * 0.42;
    const halo = ctx.createRadialGradient(cx, cy, w * 0.05, cx, cy, w * 0.58);
    halo.addColorStop(0, `${p.neon1}66`);
    halo.addColorStop(0.45, `${p.neon2}2A`);
    halo.addColorStop(1, 'transparent');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.strokeStyle = `${p.neon1}88`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, w * 0.34, -0.4, Math.PI * 1.45);
    ctx.stroke();

    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = `${p.neon2}99`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(cx, cy, w * 0.40, 0.3, Math.PI * 1.8);
    ctx.stroke();
    ctx.restore();

    // 肩颈与科技领口剪影
    const scale = v === 1 ? 1.1 : 1.0;
    ctx.save();
    ctx.translate(w * 0.5, h * 0.5);
    ctx.scale(scale, scale);
    ctx.translate(-w * 0.5, -h * 0.5);

    ctx.fillStyle = '#0D1420';
    ctx.beginPath();
    ctx.moveTo(w * 0.14, h * 1.05);
    ctx.quadraticCurveTo(w * 0.24, h * 0.72, w * 0.39, h * 0.68);
    ctx.lineTo(w * 0.61, h * 0.68);
    ctx.quadraticCurveTo(w * 0.76, h * 0.72, w * 0.88, h * 1.05);
    ctx.closePath();
    ctx.fill();

    // 领口冷光边
    ctx.strokeStyle = p.neon1;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(w * 0.34, h * 0.73);
    ctx.lineTo(w * 0.5, h * 0.85);
    ctx.lineTo(w * 0.66, h * 0.73);
    ctx.stroke();

    // 颈部与精致侧脸轮廓
    const faceGrad = ctx.createLinearGradient(w * 0.36, h * 0.28, w * 0.65, h * 0.66);
    faceGrad.addColorStop(0, p.skin);
    faceGrad.addColorStop(0.55, '#8FA5C4');
    faceGrad.addColorStop(1, '#26364D');
    ctx.fillStyle = faceGrad;

    ctx.fillRect(w * 0.44, h * 0.55, w * 0.12, h * 0.16);
    ctx.beginPath();
    ctx.ellipse(w * 0.5, h * 0.43, w * 0.145, h * 0.185, 0, 0, Math.PI * 2);
    ctx.fill();

    // 飘逸发丝与边缘冷光
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.moveTo(w * 0.32, h * 0.42);
    ctx.quadraticCurveTo(w * 0.31, h * 0.20, w * 0.50, h * 0.20);
    ctx.quadraticCurveTo(w * 0.69, h * 0.20, w * 0.69, h * 0.46);
    ctx.quadraticCurveTo(w * 0.72, h * 0.68, w * 0.64, h * 0.77);
    ctx.quadraticCurveTo(w * 0.60, h * 0.55, w * 0.58, h * 0.38);
    ctx.quadraticCurveTo(w * 0.50, h * 0.31, w * 0.41, h * 0.38);
    ctx.quadraticCurveTo(w * 0.38, h * 0.55, w * 0.35, h * 0.74);
    ctx.quadraticCurveTo(w * 0.29, h * 0.58, w * 0.32, h * 0.42);
    ctx.fill();

    // 刘海
    ctx.beginPath();
    ctx.moveTo(w * 0.38, h * 0.35);
    ctx.lineTo(w * 0.43, h * 0.44);
    ctx.lineTo(w * 0.47, h * 0.34);
    ctx.lineTo(w * 0.51, h * 0.46);
    ctx.lineTo(w * 0.55, h * 0.35);
    ctx.lineTo(w * 0.62, h * 0.43);
    ctx.lineTo(w * 0.63, h * 0.29);
    ctx.lineTo(w * 0.38, h * 0.29);
    ctx.closePath();
    ctx.fill();

    // 发丝冷光描边
    ctx.strokeStyle = p.neon1;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w * 0.32, h * 0.42);
    ctx.quadraticCurveTo(w * 0.31, h * 0.20, w * 0.50, h * 0.20);
    ctx.quadraticCurveTo(w * 0.67, h * 0.21, w * 0.68, h * 0.44);
    ctx.stroke();

    // 发光双瞳
    [w * 0.44, w * 0.56].forEach((ex, idx) => {
      const eyeColor = (v === 2 && idx === 1) ? '#FF5AA5' : p.neon1;
      ctx.fillStyle = eyeColor;
      ctx.shadowColor = eyeColor;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(ex, h * 0.45, 7.5, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(ex - 2, h * 0.446, 2, 0, Math.PI * 2);
      ctx.fill();
    });

    // 赛博耳机装置
    ctx.fillStyle = '#1E2D45';
    ctx.strokeStyle = p.neon2;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(w * 0.63, h * 0.40, 12, 26, 5);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w * 0.69, h * 0.40);
    ctx.lineTo(w * 0.72, h * 0.28);
    ctx.stroke();

    ctx.restore();

    // 前景雨丝与荧光 Bokeh 光斑
    ctx.strokeStyle = `${p.neon1}55`;
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 28; i++) {
      const rx = rng() * w;
      const ry = rng() * h;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 8, ry + 28 + rng() * 24);
      ctx.stroke();
    }
    for (let i = 0; i < 12; i++) {
      const bx = rng() * w;
      const by = rng() * h;
      const br = 4 + rng() * 14;
      ctx.fillStyle = i % 2 === 0 ? `${p.neon1}24` : `${p.neon2}24`;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fill();
    }
    drawGrain(ctx, w, h, rng, 0.03);
  }

  function paintCloudShrine(ctx, w, h, v, rng) {
    const palettes = [

    ctx.fillStyle = p.moon;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();

    // 浮世绘卷云条纹
    ctx.fillStyle = `${p.paper1}BB`;
    ctx.fillRect(w * 0.06, my - 10, w * 0.45, 10);
    ctx.fillRect(w * 0.42, my + 24, w * 0.50, 9);

    // 松枝与鹤剪影
    ctx.strokeStyle = p.ink;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, h * 0.20);
    ctx.quadraticCurveTo(w * 0.22, h * 0.26, w * 0.42, h * 0.18);
    ctx.stroke();

    // 北斋风层浪
    const drawWaveBand = (yBase, color, amp) => {
      ctx.fillStyle = color;
      ctx.strokeStyle = p.ink;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, yBase);
      for (let x = 0; x <= w; x += 24) {
        const y = yBase + Math.sin(x * 0.03 + yBase * 0.02) * amp;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    };
    drawWaveBand(h * 0.64, p.wave2, 16);
    drawWaveBand(h * 0.76, p.wave1, 20);

    // 卷曲浪花白沫
    ctx.fillStyle = p.foam;
    ctx.strokeStyle = p.ink;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(w * 0.34, h * 0.64, 28, Math.PI * 0.85, Math.PI * 1.95);
    ctx.arc(w * 0.36, h * 0.65, 16, Math.PI * 1.95, Math.PI * 0.9, true);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // 金箔碎点
    ctx.fillStyle = 'rgba(218, 175, 72, 0.55)';
    for (let i = 0; i < 20; i++) {
      ctx.fillRect(rng() * w, rng() * h * 0.55, 3, 3);
    }
    drawGrain(ctx, w, h, rng, 0.05);
  }

  function paintGeometricGirl(ctx, w, h, v, rng) {
    const palettes = [
      { bg: '#F7F3EA', c1: '#357A66', c2: '#D97757', c3: '#5B6AD0', hair: '#1F2A26', skin: '#FCEBE2' },
      { bg: '#FAF5E4', c1: '#2E59B7', c2: '#E3A72F', c3: '#E05344', hair: '#1C2233', skin: '#FDEEE4' },
      { bg: '#EFF5F2', c1: '#49A089', c2: '#E27D8B', c3: '#2A3330', hair: '#202624', skin: '#FCF1EC' }
    ];
    const p = palettes[v % 3];

    ctx.fillStyle = p.bg;
    ctx.fillRect(0, 0, w, h);

    // 包豪斯几何色块底图
    ctx.fillStyle = p.c1;
    ctx.beginPath();
    ctx.arc(w * 0.72, h * 0.34, w * 0.28, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = p.c2;
    ctx.beginPath();
    ctx.moveTo(w * 0.08, h * 0.82);
    ctx.lineTo(w * 0.42, h * 0.38);
    ctx.lineTo(w * 0.52, h * 0.86);
    ctx.closePath();
    ctx.fill();

    // 漫画网点装饰
    ctx.fillStyle = `${p.c3}40`;
    for (let gx = w * 0.10; gx < w * 0.42; gx += 11) {
      for (let gy = h * 0.12; gy < h * 0.36; gy += 11) {
        ctx.beginPath();
        ctx.arc(gx, gy, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 少女几何利落波波头与五官线稿
    ctx.fillStyle = p.skin;
    ctx.strokeStyle = p.hair;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(w * 0.50, h * 0.49, w * 0.16, h * 0.19, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 撞色几何发块
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.moveTo(w * 0.30, h * 0.64);
    ctx.lineTo(w * 0.33, h * 0.28);
    ctx.quadraticCurveTo(w * 0.50, h * 0.21, w * 0.67, h * 0.29);
    ctx.lineTo(w * 0.70, h * 0.62);
    ctx.lineTo(w * 0.61, h * 0.58);
    ctx.lineTo(w * 0.58, h * 0.38);
    ctx.lineTo(w * 0.42, h * 0.41);
    ctx.lineTo(w * 0.38, h * 0.61);
    ctx.closePath();
    ctx.fill();

    // 时尚大眼与腮红色块
    ctx.fillStyle = p.c2;
    ctx.beginPath();
    ctx.arc(w * 0.42, h * 0.53, 8, 0, Math.PI * 2);
    ctx.arc(w * 0.58, h * 0.53, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = p.c3;
    ctx.beginPath();
    ctx.roundRect(w * 0.41, h * 0.47, 13, 14, 5);
    ctx.roundRect(w * 0.53, h * 0.47, 13, 14, 5);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(w * 0.44, h * 0.50, 3, 0, Math.PI * 2);
    ctx.arc(w * 0.56, h * 0.50, 3, 0, Math.PI * 2);
    ctx.fill();

    // 撞色几何领口与动感丝带
    ctx.fillStyle = p.c3;
    ctx.beginPath();
    ctx.moveTo(w * 0.24, h);
    ctx.lineTo(w * 0.40, h * 0.70);
    ctx.lineTo(w * 0.60, h * 0.70);
    ctx.lineTo(w * 0.76, h);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = p.c2;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(w * 0.14, h * 0.78);
    ctx.bezierCurveTo(w * 0.38, h * 0.62, w * 0.64, h * 0.90, w * 0.88, h * 0.68);
    ctx.stroke();

    drawGrain(ctx, w, h, rng, 0.025);
  }

  function renderArtCanvas(canvas, artId, variantIndex = 0, customDataUrl = null) {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const cssW = Math.max(120, Math.round(rect.width || canvas.clientWidth || 240));
    const cssH = Math.max(120, Math.round(rect.height || canvas.clientHeight || 300));
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    const ctx = canvas.getContext('2d');
    if (typeof ctx.roundRect !== 'function') {
      ctx.roundRect = function (x, y, rw, rh, rad) {
        const r = Math.min(Number(rad) || 0, Math.abs(rw) / 2, Math.abs(rh) / 2);
        this.moveTo(x + r, y);
        this.arcTo(x + rw, y, x + rw, y + rh, r);
        this.arcTo(x + rw, y + rh, x, y + rh, r);
        this.arcTo(x, y + rh, x, y, r);
        this.arcTo(x, y, x + rw, y, r);
        this.closePath();
      };
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (customDataUrl) {
      let img = customImageCache.get(customDataUrl);
      if (!img) {
        img = new Image();
        img.onload = () => {
          customImageCache.set(customDataUrl, img);
          renderArtCanvas(canvas, artId, variantIndex, customDataUrl);
        };
        img.src = customDataUrl;
        customImageCache.set(customDataUrl, img);
      }
      if (img.complete && img.naturalWidth > 0) {
        const scale = Math.max(cssW / img.naturalWidth, cssH / img.naturalHeight);
        const dw = img.naturalWidth * scale;
        const dh = img.naturalHeight * scale;
        ctx.drawImage(img, (cssW - dw) / 2, (cssH - dh) / 2, dw, dh);
        return;
      }
    }

    const rng = makeRng(hashSeed(`${artId}:${variantIndex}`));
    switch (artId) {
      case 'cyber_portrait': paintCyberPortrait(ctx, cssW, cssH, variantIndex, rng); break;
      case 'cloud_shrine': paintCloudShrine(ctx, cssW, cssH, variantIndex, rng); break;
      case 'watercolor_conservatory': paintWatercolorConservatory(ctx, cssW, cssH, variantIndex, rng); break;
      case 'baroque_cathedral': paintBaroqueCathedral(ctx, cssW, cssH, variantIndex, rng); break;
      case 'rainy_neon': paintRainyNeon(ctx, cssW, cssH, variantIndex, rng); break;
      case 'emerald_forest': paintEmeraldForest(ctx, cssW, cssH, variantIndex, rng); break;
      case 'ukiyoe_red_moon': paintUkiyoeMoon(ctx, cssW, cssH, variantIndex, rng); break;
      case 'geometric_girl': paintGeometricGirl(ctx, cssW, cssH, variantIndex, rng); break;
      default: paintCloudShrine(ctx, cssW, cssH, variantIndex, rng); break;
    }
  }

  function hydrateAllCanvases() {
    document.querySelectorAll('canvas[data-art]').forEach((cv) => {
      const artId = cv.getAttribute('data-art');
      const vIdx = parseInt(cv.getAttribute('data-variant') || '0', 10);
      const customUrl = cv.getAttribute('data-custom-url') || null;
      renderArtCanvas(cv, artId, vIdx, customUrl);
    });
  }

  /* =========================================================================
     4. 提示词 AST 编译与 4 种权重语法转换引擎
     ========================================================================= */
  const DIALECTS = [
    { id: 'nai5', name: 'NAI V4.5 / V5', sample: '1.2::tag::' },
    { id: 'sdxl', name: 'SDXL / ComfyUI', sample: '(tag:1.2)' },
    { id: 'nai3', name: 'NAI 旧括号', sample: '{{{tag}}} / [tag]' },
    { id: 'anima_moss', name: 'Anima / MOSS', sample: '@artist · 去下划线空格' }
  ];

  function getSchema(schemaId) {
    return state.schemas.find((s) => s.id === schemaId) || state.schemas[0];
  }

  function getSnippet(snippetId) {
    return state.snippets.find((s) => s.id === snippetId);
  }

  function getActiveRecipe() {
    return state.recipes.find((r) => r.id === state.activeRecipeId) || state.recipes[0];
  }

  function formatWeightVal(w) {
    return Number(w).toFixed(2).replace(/\.?0+$/, '');
  }

  function formatSingleTag(rawText, weight, dialect) {
    let text = rawText.trim();
    if (!text) return '';

    if (dialect === 'anima_moss') {
      text = text.replace(/^artist:/i, '@');
      text = text.replace(/_/g, ' ');
    } else if (dialect === 'sdxl' || dialect === 'nai5' || dialect === 'nai3') {
      if (text.startsWith('@')) {
        text = 'artist:' + text.slice(1).replace(/\s+/g, '_');
      }
    }

    const w = Math.round(weight * 100) / 100;
    if (Math.abs(w - 1.0) < 0.01) return text;

    if (dialect === 'nai5') {
      return `${formatWeightVal(w)}::${text}::`;
    }
    if (dialect === 'sdxl' || dialect === 'anima_moss') {
      return `(${text}:${formatWeightVal(w)})`;
    }
    if (dialect === 'nai3') {
      const steps = Math.max(1, Math.min(5, Math.round(Math.abs(w - 1.0) / 0.05)));
      if (w > 1.0) return '{'.repeat(steps) + text + '}'.repeat(steps);
      return '['.repeat(steps) + text + ']'.repeat(steps);
    }
    return text;
  }

  function parseRawPromptParts(rawStr) {
    return rawStr
      .split(',')
      .map((s) => s.trim())
      .filter(Boolean)
      .map((part) => {
        let muted = false;
        let p = part;
        if (p.startsWith('~~') && p.endsWith('~~') && p.length > 4) {
          muted = true;
          p = p.slice(2, -2).trim();
        }
        let weight = 1.0;
        const mNai = p.match(/^(\d+(?:\.\d+)?)::(.*?)::$/);
        const mSdxl = p.match(/^\((.+):(\d+(?:\.\d+)?)\)$/);
        if (mNai) {
          weight = parseFloat(mNai[1]);
          p = mNai[2].trim();
        } else if (mSdxl) {
          p = mSdxl[1].trim();
          weight = parseFloat(mSdxl[2]);
        } else if (/^\{+.+\}+$/.test(p)) {
          const cnt = p.match(/^\{+/)[0].length;
          weight = Number((1 + cnt * 0.05).toFixed(2));
          p = p.replace(/^\{+|\}+$/g, '').trim();
        } else if (/^\[+.+\]+$/.test(p)) {
          const cnt = p.match(/^\[+/)[0].length;
          weight = Number(Math.max(0.5, 1 - cnt * 0.05).toFixed(2));
          p = p.replace(/^\[+|\]+$/g, '').trim();
        }
        return { text: p, weight, muted };
      });
  }

  function compileTokens(tokens, dialect) {
    const out = [];
    for (const tok of tokens) {
      if (tok.muted) continue;
      if (tok.kind === 'snippet') {
        const snp = getSnippet(tok.snippetId);
        if (!snp) continue;
        const subParts = parseRawPromptParts(snp.raw);
        for (const sp of subParts) {
          if (sp.muted) continue;
          const combinedWeight = Math.abs(tok.weight - 1.0) > 0.01 ? tok.weight * sp.weight : sp.weight;
          out.push(formatSingleTag(sp.text, combinedWeight, dialect));
        }
      } else {
        out.push(formatSingleTag(tok.text, tok.weight, dialect));
      }
    }
    return out.filter(Boolean).join(', ');
  }

  function tokensToSource(tokens) {
    return tokens.map((t) => {
      const wStr = Math.abs(t.weight - 1.0) > 0.01 ? `${formatWeightVal(t.weight)}::` : '';
      const wEnd = wStr ? '::' : '';
      let core = '';
      if (t.kind === 'snippet') {
        const snp = getSnippet(t.snippetId);
        core = `[[🧩 ${snp ? snp.name : t.snippetId}]]`;
      } else {
        core = t.text;
      }
      const line = `${wStr}${core}${wEnd}`;
      return t.muted ? `~~${line}~~` : line;
    }).join(', ');
  }

  function sourceToTokens(sourceStr) {
    const rawParts = sourceStr.split(',').map((s) => s.trim()).filter(Boolean);
    const result = [];
    for (const raw of rawParts) {
      let muted = false;
      let p = raw;
      if (p.startsWith('~~') && p.endsWith('~~') && p.length > 4) {
        muted = true;
        p = p.slice(2, -2).trim();
      }
      let weight = 1.0;
      const mNai = p.match(/^(\d+(?:\.\d+)?)::(.*?)::$/);
      const mSdxl = p.match(/^\((.+):(\d+(?:\.\d+)?)\)$/);
      if (mNai) {
        weight = parseFloat(mNai[1]);
        p = mNai[2].trim();
      } else if (mSdxl) {
        p = mSdxl[1].trim();
        weight = parseFloat(mSdxl[2]);
      }
      const mSnippet = p.match(/^\[\[\s*(?:🧩\s*)?(.+?)\s*\]\]$/);
      if (mSnippet) {
        const targetName = mSnippet[1].trim();
        const found = state.snippets.find((s) => s.name === targetName || s.id === targetName);
        if (found) {
          result.push(snpTok(found.id, weight, muted));
          continue;
        }
      }
      const parsed = parseRawPromptParts(p)[0] || { text: p, weight: 1.0 };
      result.push(tagTok(parsed.text, Math.abs(weight - 1.0) > 0.01 ? weight : parsed.weight, muted));
    }
    return result;
  }

  function classifySemantic(tok) {
    if (tok.kind === 'snippet') return 'sem-coral';
    const lower = tok.text.toLowerCase();
    if (lower.startsWith('artist:') || lower.startsWith('@')) return 'sem-indigo';
    if (/(masterpiece|best quality|very aesthetic|absurdres|digital illustration|d3style|ukiyo-e|watercolor)/.test(lower)) {
      return 'sem-pine';
    }
    return 'sem-neutral';
  }

  function getMemoChipClass(tok) {
    const cls = classifySemantic(tok);
    if (cls === 'sem-indigo') return 'kind-indigo';
    if (cls === 'sem-coral') return 'kind-coral';
    if (cls === 'sem-pine') return 'kind-pine';
    return 'kind-neutral';
  }

  /* =========================================================================
     5. 工具函数：剪贴板、Toast、SVG 图标库、Safe HTML 转义

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('slToast');
    const txt = document.getElementById('slToastText');
    if (!el || !txt) return;
    txt.textContent = msg;
    el.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('visible'), 2500);
  }

  function copyText(text, successMsg) {
    if (!text) {
      showToast('当前内容为空，无需复制');
      return;
    }
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      showToast(successMsg || `已复制 (${text.length} 字符)`);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => showToast(successMsg || `已复制 (${text.length} 字符)`),
        fallback
      );
    } else {
      fallback();
    }
  }

  /* =========================================================================
     6. 核心操作逻辑：织入积木、统一胶囊操作栏、打散、克隆、同步
     ========================================================================= */
  function weaveSnippetIntoActive(snippetId, forcedTarget) {
    const rec = getActiveRecipe();
    const snp = getSnippet(snippetId);
    if (!rec || !snp) return;
    let targetBox = forcedTarget || state.shelfTarget;
    if (targetBox === 'auto') {
      targetBox = snp.category === '常用负面' ? 'neg' : 'pos';
    }
    const list = targetBox === 'neg' ? rec.negTokens : rec.posTokens;
    const newTok = snpTok(snp.id, 1.0, false);
    list.push(newTok);
    state.selectedToken = { box: targetBox, tokenId: newTok.id };
    state.sourceMode[targetBox] = false;
    state.editorOpen = true;
    showToast(`已将 🧩「${snp.name}」织入「${rec.title}」的${targetBox === 'neg' ? '负面' : '正面'}框`);
    renderAll();
  }

  function mutateSelectedToken(box, action) {
    const rec = getActiveRecipe();
    if (!rec || !state.selectedToken || state.selectedToken.box !== box) return;
    const list = box === 'pos' ? rec.posTokens : rec.negTokens;
    const idx = list.findIndex((t) => t.id === state.selectedToken.tokenId);
    if (idx < 0) return;
    const tok = list[idx];

    if (action === 'w-down') {
      tok.weight = Math.max(0.2, Number((tok.weight - 0.05).toFixed(2)));
    } else if (action === 'w-up') {
      tok.weight = Math.min(2.5, Number((tok.weight + 0.05).toFixed(2)));
    } else if (action === 'prev' && idx > 0) {
      [list[idx - 1], list[idx]] = [list[idx], list[idx - 1]];
    } else if (action === 'next' && idx < list.length - 1) {
      [list[idx + 1], list[idx]] = [list[idx], list[idx + 1]];
    } else if (action === 'mute') {
      tok.muted = !tok.muted;
    } else if (action === 'unpack' && tok.kind === 'snippet') {
      const snp = getSnippet(tok.snippetId);
      if (snp) {
        const sub = parseRawPromptParts(snp.raw).map((sp) => {
          const w = Math.abs(tok.weight - 1.0) > 0.01 ? Number((tok.weight * sp.weight).toFixed(2)) : sp.weight;
          return tagTok(sp.text, w, tok.muted || sp.muted);
        });
        list.splice(idx, 1, ...sub);
        state.selectedToken = sub[0] ? { box, tokenId: sub[0].id } : null;
        showToast(`已将 🧩「${snp.name}」原地打散为 ${sub.length} 个独立词条`);
      }
    } else if (action === 'remove') {
      list.splice(idx, 1);
      state.selectedToken = null;
    }
    renderAll();
  }

  function addTokenToBox(box, rawInput) {
    const rec = getActiveRecipe();
    const cleaned = rawInput.trim().replace(/^,+|,+$/g, '');
    if (!rec || !cleaned) return;
    const list = box === 'pos' ? rec.posTokens : rec.negTokens;
    const parsed = sourceToTokens(cleaned);
    let lastTok = null;
    for (const tok of parsed) {
      lastTok = tok;
      list.push(tok);
    }
    if (lastTok) state.selectedToken = { box, tokenId: lastTok.id };
    renderAll();
  }

  function cloneRecipeToSchema(recipeId, targetSchemaId) {
    const src = state.recipes.find((r) => r.id === recipeId);
    const sch = getSchema(targetSchemaId);
    if (!src || !sch) return;
    const clone = JSON.parse(JSON.stringify(src));
    clone.id = nextId('rec');
    clone.title = `${src.title.split('·')[0].trim()} · ${sch.shortName}`;
    clone.schemaId = sch.id;
    clone.params = buildDefaultParams(sch);
    clone.posTokens.forEach((t) => (t.id = nextId('tok')));
    clone.negTokens.forEach((t) => (t.id = nextId('tok')));
    state.recipes.unshift(clone);
    state.activeRecipeId = clone.id;
    state.selectedToken = null;
    showToast(`已克隆到「${sch.shortName}」并支持对应语法导出`);
    renderAll();
  }

  function buildDefaultParams(schema) {
    const params = {};
    for (const f of schema.fields) {
      if (f.type === 'slider') {
        params[f.key] = f.safeMin !== undefined ? Math.round(((f.safeMin + f.safeMax) / 2) * 10) / 10 : f.min;
      } else if (f.type === 'select') {
        params[f.key] = f.options[0];
      } else if (f.type === 'toggle') {
        params[f.key] = true;
      } else {
        params[f.key] = '';
      }
    }
    return params;
  }

  function getFilteredRecipes() {
    return state.recipes.filter((r) => {
      if (state.smartFilter === 'starred' && !r.favorite) return false;
      if (state.smartFilter !== 'all' && state.smartFilter !== 'starred') {
        const sch = getSchema(r.schemaId);
        if (r.schemaId !== state.smartFilter && sch.platform !== state.smartFilter) return false;
      }
      if (state.activeTag !== '全部' && !r.tags.includes(state.activeTag)) return false;
      if (state.search.trim()) {
        const q = state.search.trim().toLowerCase();
        const sch = getSchema(r.schemaId);
        const pos = compileTokens(r.posTokens, sch.dialect).toLowerCase();
        const neg = compileTokens(r.negTokens, sch.dialect).toLowerCase();
        const hay = `${r.title} ${r.tags.join(' ')} ${sch.name} ${pos} ${neg}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  /* ---------- 模块 3：原图透镜 (Spell Inspector) ---------- */
  function parsePngChunksQuick(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    const sig = [137, 80, 78, 71, 13, 10, 26, 10];
    for (let i = 0; i < 8; i++) if (bytes[i] !== sig[i]) return null;
    const chunks = {};
    let offset = 8;
    const dec = new TextDecoder('utf-8', { fatal: false });
    while (offset + 8 <= bytes.length) {
      const len = (bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3];
      const type = String.fromCharCode(bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]);
      const dataStart = offset + 8;
      const dataEnd = dataStart + len;
      if (dataEnd > bytes.length) break;
      if (type === 'tEXt' || type === 'iTXt') {
        const slice = bytes.slice(dataStart, dataEnd);
        const nul = slice.indexOf(0);
        if (nul > 0) {
          const key = dec.decode(slice.slice(0, nul));
          const val = dec.decode(slice.slice(nul + 1)).replace(/^\x00+/, '');
          chunks[key] = val;
        }
      }
      if (type === 'IEND') break;
      offset = dataEnd + 4;
    }
    return chunks;
  }

  function handleInspectorFile(file) {
    if (!file) return;
    if (file.name.toLowerCase().endsWith('.json')) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const json = JSON.parse(reader.result);
          const nodeCount = Object.keys(json.nodes || json).length;
          state.inspectorCustomFile = {
            title: file.name,
            badge: `ComfyUI 工作流 JSON · 识别到 ${nodeCount} 个节点`,
            dataUrl: null,
            artId: 'geometric_girl',
            variantIndex: 0,
            schemaId: 'anima-base',
            stages: [{
              stageName: 'ComfyUI JSON 导入解析',
              model: '从节点图提取模型配置',
              sampler: 'euler · normal',
              steps: 24,
              cfg: 4.5,
              seed: String(Math.floor(Math.random() * 900000000)),
              resolution: '1024 × 1024',
              extra: `源文件: ${file.name} (${Math.round(file.size / 1024)} KB)`,
              pos: JSON.stringify(json).slice(0, 220) + '...',
              neg: 'lowres, worst quality',
              params: { steps: 24, cfg: 4.5, sampler: 'Euler', scheduler: 'Normal' }
            }]
          };
          state.inspectorStageIdx = 0;
          showToast(`已解析工作流文件：${file.name}`);
          renderAll();
        } catch (err) {
          showToast('JSON 解析失败，请确认格式正确');
        }
      };
      reader.readAsText(file);
      return;
    }

    const urlReader = new FileReader();
    urlReader.onload = () => {
      const dataUrl = urlReader.result;
      const binReader = new FileReader();
      binReader.onload = () => {
        const chunks = parsePngChunksQuick(binReader.result) || {};
        const rawMeta = chunks.parameters || chunks.Comment || chunks.Description || chunks.prompt || '';
        let pos = chunks.Description || 'masterpiece, best quality, anime illustration (本地图片导入)';
        let neg = 'lowres, bad anatomy, bad hands';
        let steps = 28;
        let cfg = 5.5;
        let sampler = 'Euler_a';
        if (chunks.parameters) {
          const parts = chunks.parameters.split(/Negative prompt:/i);
          pos = parts[0].trim() || pos;
          if (parts[1]) {
            const np = parts[1].split(/Steps:/i);
            neg = np[0].trim() || neg;
          }
          const mSteps = chunks.parameters.match(/Steps:\s*(\d+)/i);
          const mCfg = chunks.parameters.match(/CFG scale:\s*([\d.]+)/i);
          const mSamp = chunks.parameters.match(/Sampler:\s*([^,\n]+)/i);
          if (mSteps) steps = parseInt(mSteps[1], 10);
          if (mCfg) cfg = parseFloat(mCfg[1]);
          if (mSamp) sampler = mSamp[1].trim();
        } else if (chunks.Comment) {
          try {
            const c = JSON.parse(chunks.Comment);
            pos = c.prompt || pos;
            neg = c.uc || neg;
            steps = c.steps || steps;
            cfg = c.scale || cfg;
            sampler = c.sampler || sampler;
          } catch (_) {}
        }

        state.inspectorCustomFile = {
          title: file.name.replace(/\.[^.]+$/, ''),
          badge: rawMeta ? `本地 PNG 元数据解析成功 (${Object.keys(chunks).join(', ')})` : `本地图像载入 (${Math.round(file.size / 1024)} KB · 未发现明文 Chunk，可作封面新建)`,
          dataUrl,
          artId: 'cloud_shrine',
          variantIndex: 0,
          schemaId: chunks.Description ? 'nai-v5' : 'illustrious-xl',
          stages: [{
            stageName: '本地图像提取结果',
            model: chunks.Source || 'Local PNG / Image',
            sampler,
            steps,
            cfg,
            seed: 'Local-File',
            resolution: '原图尺寸',
            extra: `文件名: ${file.name}`,
            pos,
            neg,
            params: { steps, guidance: cfg, cfg, sampler }
          }]
        };
        state.inspectorStageIdx = 0;
        showToast(`已载入本地文件「${file.name}」`);
        renderAll();
      };
      binReader.readAsArrayBuffer(file);
    };
    urlReader.readAsDataURL(file);
  }
