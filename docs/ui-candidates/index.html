<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StyleLoom 画风织机 · 前端彻底重构候选方案对比台</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  .sl-hub {
    --hub-bg: #111216;
    --hub-bar: #17191f;
    --hub-surface: #1e212a;
    --hub-border: rgba(255, 255, 255, 0.09);
    --hub-text: #f3f4f6;
    --hub-muted: #9ca3af;
    --hub-accent: #e5a93c;
    --hub-accent-soft: rgba(229, 169, 60, 0.14);
    height: 100vh;
    min-height: 720px;
    display: flex;
    flex-direction: column;
    background: var(--hub-bg);
    color: var(--hub-text);
  }

  .hub-topbar {
    height: 44px;
    flex-shrink: 0;
    background: var(--hub-bar);
    border-bottom: 1px solid var(--hub-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    gap: 10px;
  }

  .hub-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .hub-brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: linear-gradient(135deg, #e5a93c, #c45630);
    display: grid;
    place-items: center;
    color: #fff;
  }

  .hub-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.04);
    padding: 3px;
    border-radius: 10px;
    border: 1px solid var(--hub-border);
    overflow-x: auto;
  }

  .hub-tab {
    border: none;
    background: transparent;
    color: var(--hub-muted);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 7px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.16s ease;
  }

  .hub-tab:hover {
    color: var(--hub-text);
    background: rgba(255, 255, 255, 0.06);
  }

  .hub-tab.active {
    background: var(--hub-surface);
    color: var(--hub-text);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .hub-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .hub-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .hub-btn {
    border: 1px solid var(--hub-border);
    background: var(--hub-surface);
    color: var(--hub-text);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    transition: all 0.15s ease;
  }

  .hub-btn:hover {
    border-color: rgba(255, 255, 255, 0.22);
    background: #262a35;
  }

  .hub-btn.active-info {
    border-color: rgba(229, 169, 60, 0.45);
    background: var(--hub-accent-soft);
    color: #f8d488;
  }

  .hub-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #0a0b0e;
  }

  .hub-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: transparent;
  }

  .hub-drawer {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 390px;
    max-width: calc(100vw - 24px);
    background: rgba(23, 25, 31, 0.94);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    z-index: 50;
    display: none;
  }

  .hub-drawer.open {
    display: block;
  }

  .hub-drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .hub-drawer-title {
    font-size: 14px;
    font-weight: 700;
  }

  .hub-drawer-close {
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: var(--hub-text);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
  }

  .hub-meta-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 12px;
    line-height: 1.55;
    color: #d1d5db;
  }

  .hub-meta-card {
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .hub-meta-card strong {
    color: #fff;
    display: block;
    margin-bottom: 3px;
  }

  .hub-pill-tag {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.08);
    color: #e5e7eb;
    margin-right: 4px;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="sl-hub">
  <header class="hub-topbar">
    <div class="hub-brand">
      <span class="hub-brand-mark">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg>
      </span>
      <span>StyleLoom 候选对比台</span>
    </div>

    <nav class="hub-tabs" id="hubTabs">
      <button class="hub-tab active" data-id="a">
        <span class="hub-dot" style="background:#c45630;"></span>
        <span>A · 织机画册 (Editorial)</span>
      </button>
      <button class="hub-tab" data-id="b">
        <span class="hub-dot" style="background:#e5a93c;"></span>
        <span>B · 暗房光学 (Darkroom)</span>
      </button>
      <button class="hub-tab" data-id="c">
        <span class="hub-dot" style="background:#357a66;"></span>
        <span>C · 柔雾便签 (Tactile Bento)</span>
      </button>
      <button class="hub-tab" data-id="d">
        <span class="hub-dot" style="background:#7c83fd;"></span>
        <span>D · 星幕工坊 (Spatial Glass)</span>
      </button>
    </nav>

    <div class="hub-actions">
      <button class="hub-btn" id="toggleInfoBtn" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>当前方案要点</span>
      </button>
      <a class="hub-btn" id="openStandaloneLink" href="candidate-a-editorial-gallery.html" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>新标签页全屏</span>
      </a>
    </div>
  </header>

  <main class="hub-stage">
    <iframe id="previewFrame" class="hub-frame" src="candidate-a-editorial-gallery.html" title="StyleLoom UI Candidate"></iframe>

    <aside class="hub-drawer" id="infoDrawer">
      <div class="hub-drawer-head">
        <div class="hub-drawer-title" id="drawerTitle">方案 A · 织机画册</div>
        <button class="hub-drawer-close" id="closeDrawerBtn" type="button">×</button>
      </div>
      <div class="hub-meta-list" id="drawerBody"></div>
    </aside>
  </main>
</div>

<script>
(function () {
  var CANDIDATES = {
    a: {
      file: 'candidate-a-editorial-gallery.html',
      title: '方案 A · 织机画册 (Warm Gallery Editorial)',
      palette: '暖砂宣纸 #F6F3EC + 朱砂陶红 #C45630（支持一键切暖炭夜读）',
      layout: '取消左右侧边栏，94% 全画幅画册；顶部悬浮毛玻璃胶囊坞 + 无框杂志筛选丝带',
      capsule: '极简字牌胶囊（隐藏微图标噪音），悬停/点击词条弹出轻盈微工具条；支持打散积木与双模式互转',
      highlight: '点击画师串弹出居中「双跨页画册灯箱」，左页内置鼠标可拖动分割线的 A/B 双图拉帘对比器'
    },
    b: {
      file: 'candidate-b-darkroom-console.html',
      title: '方案 B · 暗房光学 (Darkroom Console HUD)',
      palette: '纯正碳黑暗房 #0A0B0D + 徕卡琥珀金 #E5A93C + 光学青 #38BDF8',
      layout: '54px 极窄左轨 + 中央高刷暗房瀑布流 + 右侧常驻无框精密检查器 + 底部实时咒语发射坞',
      capsule: '轨道刻度胶囊（底部嵌 2px 金色权重进度条），🧩 积木点击支持内联预览内部词条后再打散',
      highlight: 'Blender 式无边框横向拖拽滑轨（内标安全推荐区间暗带），底部常驻一键秒复制正/负面与转写语法'
    },
    c: {
      file: 'candidate-c-tactile-bento.html',
      title: '方案 C · 柔雾便签 (Tactile Bento Studio)',
      palette: '护眼鼠尾草灰绿 #E8EEEA + 柔雾白瓷大圆角岛屿 + 松针绿 #357A66 + 暖珊瑚 #D97757',
      layout: '全岛屿悬浮 Bento（零通顶分割线），左侧 Arc 导航岛左下角常驻「随手积木抽屉」，一点即织入',
      capsule: '彻底消灭胶囊小按钮：按语义温和着色 + 顶部唯一宽敞操作栏（权重/前移/后移/静音/打散/移出）',
      highlight: '瀑布流支持「纯图鉴赏 ↔ 便签图文卡」切换，鼠尾草护眼色感在手机/桌面触控操作都零压迫'
    },
    d: {
      file: 'candidate-d-spatial-workbench.html',
      title: '方案 D · 星幕工坊 (Spatial Glass Multi-Tab)',
      palette: '深海星幕极光 #080C14 + 22px 空间磨砂玻璃 + 星云电光蓝紫 #7C83FD + 极光青 #2DD4BF',
      layout: 'Figma/Arc 式顶部多标签工作栏（同时开启多个配方秒切）+ 画风总库内独创三视图自由切换',
      capsule: '流光微发光胶囊，支持点击精调与多标签页内双栏独立工坊，左侧背景随作品色调呼吸渲染',
      highlight: '自带「极光瀑布流 / 舞台巡礼选片台 / A-B 双卡同屏竞技场（自动标出模型语法与参数差异）」'
    }
  };

  var frame = document.getElementById('previewFrame');
  var tabs = document.querySelectorAll('.hub-tab');
  var openLink = document.getElementById('openStandaloneLink');
  var drawer = document.getElementById('infoDrawer');
  var infoBtn = document.getElementById('toggleInfoBtn');
  var closeBtn = document.getElementById('closeDrawerBtn');
  var drawerTitle = document.getElementById('drawerTitle');
  var drawerBody = document.getElementById('drawerBody');
  var activeId = 'a';

  function renderInfo(id) {
    var c = CANDIDATES[id];
    drawerTitle.textContent = c.title;
    drawerBody.innerHTML =
      '<div class="hub-meta-card"><strong>色板与视觉氛围</strong>' + c.palette + '</div>' +
      '<div class="hub-meta-card"><strong>空间架构差异</strong>' + c.layout + '</div>' +
      '<div class="hub-meta-card"><strong>提示词胶囊交互创新</strong>' + c.capsule + '</div>' +
      '<div class="hub-meta-card"><strong>独创核心体验</strong>' + c.highlight +
      '<div><span class="hub-pill-tag">桌面端 + Android 手机切换</span><span class="hub-pill-tag">5 大核心页签可交互</span></div></div>';
  }

  function selectCandidate(id) {
    activeId = id;
    var c = CANDIDATES[id];
    tabs.forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-id') === id);
    });
    frame.src = c.file;
    openLink.href = c.file;
    renderInfo(id);
  }

  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      selectCandidate(t.getAttribute('data-id'));
    });
  });

  infoBtn.addEventListener('click', function () {
    var willOpen = !drawer.classList.contains('open');
    drawer.classList.toggle('open', willOpen);
    infoBtn.classList.toggle('active-info', willOpen);
  });

  closeBtn.addEventListener('click', function () {
    drawer.classList.remove('open');
    infoBtn.classList.remove('active-info');
  });

  renderInfo(activeId);
})();
</script>
</body>
</html>
